name: secret-scan

# A secret removed from the working tree still ships to anyone who clones a
# public repo, so history scanning matters. What actually runs, per event:
#   TruffleHog  - full history on every event (head-only input, no base).
#   Gitleaks    - event diff on push/PR; the action's full-scan branch (no
#                 --log-opts) runs only for schedule and manual dispatch, so
#                 the weekly schedule is the automatic full-history re-scan.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Sundays 05:00 UTC.
    - cron: "0 5 * * 0"

# Read-only by default. Nothing here writes to the repo, and on pull_request a
# fork gets a read-only token regardless, so fork PRs reach no secret.
permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@v7.0.1
        with:
          # Without this the checkout is shallow and history scanning is a no-op.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR commenting needs a write-scoped token that fork PRs never receive.
          # A failed job is the signal instead, so no write permission is needed.
          GITLEAKS_ENABLE_COMMENTS: false
          # GITLEAKS_LICENSE is deliberately absent: it is required for
          # organization-owned repos only, and this repo is user-owned.

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          # The action otherwise picks a range from the event: the push diff or
          # the PR diff. Passing head with no base makes every event scan the
          # whole history reachable from the checked-out commit.
          head: HEAD
          # Image tag carries no leading v, unlike the action ref above.
          # Pinned because this input defaults to the floating latest tag.
          version: 3.96.0
          extra_args: --results=verified --force-skip-binaries --force-skip-archives
