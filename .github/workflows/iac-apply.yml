name: iac-apply

# The merge is the approval gate: a pull request showed the plan, a merge applies
# it. There is no separate deploy ritual to forget.
#
# Only the roots the pushed commit touched are applied. Applying all of them
# would reconcile drift nobody reviewed, in a run whose pull request never
# mentioned it.
#
# Two writers exist for this state - an operator's `tofu apply` from the control
# node and this job - and the backend's `use_lockfile` plus the `-lock-timeout`
# below are what stop them interleaving. The concurrency group stops two of
# *these* runs overlapping.

# Workflow-level environment, non-secret only. The OpenTofu version lives here
# because three workflows run `tofu`, and a bump applied to two of them makes the
# plan verdict and the applied tree disagree with nothing flagging it.
env:
  TOFU_VERSION: 1.13.2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel an apply in progress: a half-applied change is worse than a
  # queued one. A second push waits for the first to finish.
  group: tofu-apply
  cancel-in-progress: false

jobs:
  apply:
    name: tofu apply
    # workflow_dispatch can name any ref, and this job holds every production
    # credential. Without this guard, `gh workflow run iac-apply.yml --ref
    # some-branch` plans and applies an unreviewed tree to the live zones with
    # no pull request and no comment. A push here is already main-only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A plan over two zones and the account finishes in well under a minute; the
    # timeout is there so a hung API call cannot hold the concurrency group for
    # GitHub's six-hour default.
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The GITHUB_TOKEN extraheader otherwise stays in .git/config while
          # third-party actions and provider code run in this workspace.
          persist-credentials: false
          # The changed-root diff compares the pushed commit to the one before it,
          # and a shallow clone does not contain that parent.
          fetch-depth: 0

      # A manual dispatch has no `before` commit, so it applies the roots the tip
      # commit touched. That keeps a dispatch from reconciling drift the merge
      # review never saw.
      - name: Detect changed roots
        id: roots
        run: |
          before='${{ github.event.before }}'
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            range='HEAD~1 HEAD'
          else
            range="$before $GITHUB_SHA"
          fi
          roots=''
          for dir in $(git diff --name-only $range -- iac/ | cut -d/ -f2 | sort -u); do
            if [ -d "iac/$dir" ]; then
              roots="${roots:+$roots }$dir"
            fi
          done
          echo "roots=$roots" >> "$GITHUB_OUTPUT"
          if [ -z "$roots" ]; then
            echo "No IaC root changed. Nothing to apply."
          else
            echo "Changed roots: $roots"
          fi

      # The secrets are declared on this step and the ones below, not at workflow
      # scope: a workflow-level env puts every credential in the environment of
      # every step, including checkout, the tailnet action and the OpenTofu
      # installer.
      - name: Require every secret this job reads
        if: steps.roots.outputs.roots != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_state_passphrase: ${{ secrets.TF_VAR_STATE_PASSPHRASE }}
          TF_VAR_lukapg_public_ipv4: ${{ secrets.TF_VAR_LUKAPG_PUBLIC_IPV4 }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN AWS_ACCESS_KEY_ID \
                      AWS_SECRET_ACCESS_KEY TF_VAR_state_passphrase \
                      TF_VAR_lukapg_public_ipv4 \
                      TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::missing repository secrets: ${missing[*]}"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "docs/infrastructure/cloudflare-iac.md lists what each one is for."
            exit 1
          fi

      - name: Join the tailnet
        if: steps.roots.outputs.roots != ''
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: tofu-apply-${{ github.run_id }}

      # The action builds the `tailscale up` flags itself, including
      # --accept-routes and --hostname, so both belong in its inputs. Passing
      # either through `args` fails with "flag provided multiple times", which
      # is what the first two attempts at this step did. The probe below is the
      # part that was genuinely missing: proof the subnet route resolves.
      - name: Check the tailnet path to the object store
        if: steps.roots.outputs.roots != ''
        env:
          S3_ENDPOINT: http://192.168.30.140:9000
        run: |
          code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$S3_ENDPOINT" || true)
          if [ "$code" = "000" ]; then
            echo "::error::cannot reach $S3_ENDPOINT over the tailnet. Check the tag:ci grant for tcp:9000 and that the node accepted the subnet route."
            tailscale status || true
            exit 1
          fi
          echo "object store reachable over the tailnet (HTTP $code)"

      - name: Install OpenTofu
        if: steps.roots.outputs.roots != ''
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          # 1.13.2 is the newest 1.13 release with a published GitHub release;
          # 1.13.3, 1.13.4 and 1.13.5 exist as tags only, and the action
          # resolves versions through the releases API, so they fail with
          # "No matching version found". Bump when they publish artifacts.
          tofu_version: ${{ env.TOFU_VERSION }}

      # Plan to a file, then apply exactly that file. Applying the saved plan
      # rather than a fresh one means what lands is what was printed here, even if
      # the account drifts between the two steps.
      #
      # -lockfile=readonly: the version that lands is the version the pull request
      # planned against. -lock-timeout: an operator apply from the control node and
      # this job queue instead of one failing on the state lock.
      #
      # iac/object-store is deliberately absent from this loop: its state lives in
      # the bucket it creates, so it is applied from the control node after the
      # bootstrap in docs/infrastructure/object-storage.md.
      - name: Plan and apply each changed root
        if: steps.roots.outputs.roots != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_state_passphrase: ${{ secrets.TF_VAR_STATE_PASSPHRASE }}
          TF_VAR_lukapg_public_ipv4: ${{ secrets.TF_VAR_LUKAPG_PUBLIC_IPV4 }}
        run: |
          set -o pipefail

          for root in ${{ steps.roots.outputs.roots }}; do
            # Each root sees only the credentials it consumes. The step-level env
            # is the union; unsetting here keeps the other vendor's token out of
            # the environment OpenTofu and its providers execute in.
            case "$root" in
              cloudflare) ;;
              object-store)
                echo "iac/object-store is applied from the control node, not here. Skipping."
                unset CLOUDFLARE_API_TOKEN TF_VAR_lukapg_public_ipv4
                continue ;;
              *)
                echo "::error::iac/$root has no entry in this workflow's root list"
                exit 1 ;;
            esac

            echo "::group::$root"
            rc=0
            tofu -chdir="iac/$root" init -input=false -no-color -lockfile=readonly \
              || exit 1
            tofu -chdir="iac/$root" plan -input=false -no-color -lock-timeout=5m \
              -detailed-exitcode -out="/tmp/apply-$root.tfplan" > "/tmp/plan-$root.txt" 2>&1 \
              || rc=$?
            cat "/tmp/plan-$root.txt"
            case "$rc" in
              0) echo "iac/$root matches the tree. Nothing to apply." ;;
              2) tofu -chdir="iac/$root" apply -input=false -no-color -lock-timeout=5m \
                   "/tmp/apply-$root.tfplan" || exit 1 ;;
              *) echo "::error::tofu plan failed for iac/$root with exit code $rc"
                 exit 1 ;;
            esac
            echo "::endgroup::"
          done

      # The rollback path is not a revert this workflow can perform: it is
      # `git revert` plus this workflow running again, or an operator apply from
      # the control node. Printing it here means the person reading a failed run
      # knows both exist.
      - name: Say what the rollback is
        if: always()
        run: |
          {
            echo "### Rollback"
            echo
            echo "Revert the merge commit and push to main: this workflow applies the"
            echo "reverted tree. The state object is versioned, so a corrupted apply can"
            echo "also be rolled back by restoring the previous version from the bucket."
          } >> "$GITHUB_STEP_SUMMARY"
