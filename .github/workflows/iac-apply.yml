name: iac-apply

# The merge is the approval gate: a pull request showed the plan, a merge applies
# it. There is no separate deploy ritual to forget.
#
# Two writers now exist for this state - an operator's `tofu apply` from the
# control node and this job - and the backend's `use_lockfile` is what stops them
# interleaving. The concurrency group stops two of *these* runs overlapping.
on:
  push:
    branches:
      - main
    paths:
      - 'iac/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel an apply in progress: a half-applied change is worse than a
  # queued one. A second push waits for the first to finish.
  group: tofu-apply
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_VAR_state_passphrase: ${{ secrets.TF_VAR_STATE_PASSPHRASE }}
  TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
  TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}

jobs:
  apply:
    name: tofu apply
    runs-on: ubuntu-latest
    # A plan over two zones and the account finishes in well under a minute; the
    # timeout is there so a hung API call cannot hold the concurrency group for
    # GitHub's six-hour default.
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require every secret this job reads
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN AWS_ACCESS_KEY_ID \
                      AWS_SECRET_ACCESS_KEY TF_VAR_state_passphrase \
                      TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::missing repository secrets: ${missing[*]}"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "docs/infrastructure/cloudflare-iac.md lists what each one is for."
            exit 1
          fi

      - name: Join the tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --hostname=tofu-apply-${{ github.run_id }}

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.5

      - name: Init
        run: tofu -chdir=iac/cloudflare init -input=false -no-color

      # Plan to a file, then apply exactly that file. Applying the saved plan
      # rather than a fresh one means what lands is what was printed here, even if
      # the account drifts between the two steps.
      - name: Plan
        id: plan
        run: |
          rc=0
          tofu -chdir=iac/cloudflare plan -input=false -no-color -detailed-exitcode \
            -out=/tmp/apply.tfplan > /tmp/plan.txt 2>&1 || rc=$?
          cat /tmp/plan.txt
          case "$rc" in
            0) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::tofu plan failed with exit code $rc"; exit 1 ;;
          esac

      - name: Apply
        if: steps.plan.outputs.changed == 'true'
        run: tofu -chdir=iac/cloudflare apply -input=false -no-color /tmp/apply.tfplan

      # The rollback path is not a revert this workflow can perform: it is
      # `git revert` plus this workflow running again, or an operator apply from
      # the control node. Printing it here means the person reading a failed run
      # knows both exist.
      - name: Say what the rollback is
        if: always()
        run: |
          {
            echo "### Rollback"
            echo
            echo "Revert the merge commit and push to main: this workflow applies the"
            echo "reverted tree. The state object is versioned, so a corrupted apply can"
            echo "also be rolled back by restoring the previous version from the bucket."
          } >> "$GITHUB_STEP_SUMMARY"
