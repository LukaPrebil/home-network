# Version updates for the two things this repo pins.
#
# GitHub Actions are pinned to commit SHAs with the release tag in a trailing
# comment, and Dependabot understands that shape: it bumps the SHA and rewrites
# the annotation. Terraform providers are pinned twice, in required_providers and
# in the lock file; Dependabot updates the constraint, and `tofu init -upgrade`
# in the pull request is what moves the lock entry.
#
# Both secret scopes (Actions and Dependabot) hold the tokens the plan job reads,
# because a Dependabot pull request only ever sees the Dependabot scope. Anything
# touching iac/** runs the plan job, so a provider bump is reviewed against a real
# plan before it merges. Apply is not triggered by a workflow change, only by
# iac/**, which is why a bump to a workflow file cannot deploy.
#
# No open-pull-requests-limit: updates are rare enough here that a cap would only
# queue work behind itself. `directories` with a glob covers every root under
# iac/, including one added later.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Ljubljana
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: terraform
    directories:
      - "/iac/*"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Ljubljana
    commit-message:
      prefix: chore(iac)
