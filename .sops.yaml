---
# SOPS encryption rules. Holds only the PUBLIC age recipient, so it is safe to
# commit; the matching private key lives at ~/.config/sops/age/keys.txt on the
# operator's machine and is never committed.
#
# The recipient is a post-quantum hybrid age key (age1pq1...), which is why it
# is 1959 characters rather than the 62 of a classical X25519 age key.
#
# No encrypted_regex is set on purpose: every key in the target file is a
# secret, and an allowlist regex would silently commit any future key that
# failed to match it as plaintext. SOPS already leaves key NAMES readable, so
# diffs stay reviewable without one.
creation_rules:
  - path_regex: ansible/group_vars/all/secrets\.sops\.yml$
    age: 
