services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    restart: unless-stopped
    privileged: true
    network_mode: host
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    volumes:
      - ./homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro 

  glances:
    container_name: glances
    image: nicolargo/glances:latest
    command: glances -w  # Run Glances in web mode
    ports:
      - "61208:61208"  # Web UI
      - "61209:61209"  # API
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always
    privileged: true

  uptime-kuma:
    container_name: uptime-kuma
    image: louislam/uptime-kuma:latest
    volumes:
      - ./kuma_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 3001:3001
    restart: unless-stopped

  ddns-updater:
    container_name: ddns-updater
    image: qmcgaw/ddns-updater:latest
    network_mode: bridge
    ports:
      - 8000:8000/tcp
    volumes:
      - ./ddns-data:/updater/data
    restart: always

  nginx:
    container_name: nginx-proxy-manager
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    ports:
      - "80:80"   # HTTP
      - "443:443" # HTTPS
      - "81:81"   # NPM Web UI
    volumes:
      - ./npm_data:/data
      - ./npm_letsencrypt:/etc/letsencrypt

  octoeverywhere-elegoo-connect:
    container_name: octoeverywhere-cc
    image: octoeverywhere/octoeverywhere:latest
    environment:
      - COMPANION_MODE=elegoo
      - PRINTER_IP=192.168.1.100
    restart: always
    volumes:
      - ./octo_data:/data

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"  # Standard MQTT port
      - "9001:9001"  # MQTT over WebSockets
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    # Optional: If you want to create users later, add this line
    # command: mosquitto -c /mosquitto-no-auth.conf

networks:
  web:
    driver: bridge
  internal:
    driver: bridge
