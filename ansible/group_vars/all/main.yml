---
# Global variables for all hosts

# SSH connection policy for every fleet connection (control node only). The
# repo-tracked ansible/known_hosts pins each host by its ansible_host IP: a
# changed key on a pinned IP fails the converge, a new IP pins on first
# contact (accept-new). Provision playbooks refresh the pin for guests they
# (re)build via refresh-pinned-host-key.yml. The path is made absolute with
# playbook_dir because ssh_config(5) defines tilde, token and env expansion
# for UserKnownHostsFile but no relative-path resolution.
ansible_ssh_common_args: "-o UserKnownHostsFile={{ playbook_dir }}/known_hosts -o StrictHostKeyChecking=accept-new"

# Home Assistant MCP contract (ha_mcp role on the containers VM; consumed ad
# hoc by operator-spawned agents and, when rebuilt, by hermes). Declared here
# rather than in the role because the consumer resolves the endpoint from
# another host. MCP_SECRET_PATH is the credential - a high-entropy URL path
# in SOPS - and gates both the MCP tool surface and the settings UI; until
# the operator adds vault_ha_mcp_secret_path, converges fail on the missing
# var (fail-fast on missing auth config, ADR 0001).
ha_mcp_secret_path: "{{ vault_ha_mcp_secret_path }}"

# Network configuration
domain: home.local
dns_servers:
  - 192.168.30.145  # AdGuard Home (Primary - LXC on n5p, VLAN 30)
  - 192.168.30.110  # AdGuard Home (Secondary - native on rpi4, VLAN 30)
  # Fallback to Cloudflare if both AdGuard servers are down
  - 1.1.1.1        # Cloudflare DNS (fallback)
  - 1.0.0.1        # Cloudflare DNS (fallback)

# TrueNAS NFS configuration
truenas_nfs_server: "192.168.30.150"  # VLAN 30 (Servers)
truenas_docker_volumes_share: "/mnt/tank/docker-volumes"
truenas_immich_photos_share: "/mnt/tank/immich-photos"
truenas_external_data_share: "/mnt/tank/external-data"
truenas_paperless_share: "/mnt/tank/paperless"
truenas_plex_apps_share: "/mnt/plex-apps"  # Separate pool
truenas_plex_bulk_share: "/mnt/plex-bulk"  # Separate pool

# NFS client mount options (shared default for all TrueNAS NFS mounts)
# - nofail + _netdev: don't block boot on unreachable NFS
# - x-systemd.automount: mount on first access; retries past the boot race
# - x-systemd.mount-timeout=60s: give NFS up to 60s to come up on first access
# - x-systemd.idle-timeout=0: never auto-unmount on idle
nfs_common_opts: "defaults,nofail,_netdev,x-systemd.automount,x-systemd.mount-timeout=60s,x-systemd.idle-timeout=0"

# Docker socket proxy contract (served by the docker_socket_proxy role on each
# docker host; consumed by autoheal + uptime_kuma). The proxy is the only
# container that mounts the raw /var/run/docker.sock; consumers reach the scoped
# Docker API over tcp on this internal-only network. Kept here so the role and
# its consumers share one source of truth for the name/port/endpoint.
docker_socket_proxy_network: "socket-proxy"
docker_socket_proxy_container_name: "docker-socket-proxy"
docker_socket_proxy_port: 2375
docker_socket_proxy_endpoint: "tcp://{{ docker_socket_proxy_container_name }}:{{ docker_socket_proxy_port }}"

# iSCSI CHAP contract (M-08): the TrueNAS targets (pds, uptime-kuma) require
# one-way CHAP at login; discovery stays unauthenticated by design (it reveals
# only target names). The secret lives in SOPS; 12-16 chars, no spaces, no '#'
# are TrueNAS middleware rules (plugins/iscsi_/auth.py _validate_secret).
iscsi_chap_user: "{{ vault_iscsi_chap_user }}"
iscsi_chap_secret: "{{ vault_iscsi_chap_secret }}"

# MQTT broker contract (served by the mosquitto role on the containers VM;
# consumed by the taptap_mqtt bridge on the same host and by Home Assistant on
# another). Declared here rather than in the role because a consumer on a
# different host has to resolve the same address, port and credential names.
#
# One credential per client, never a shared one: the broker's own log is then
# the record of which client connected, and rotating one does not disturb the
# others. Adding a consumer means adding a credential here plus a line in the
# sops-held password file - not a refactor.
mosquitto_container_name: "mosquitto"
mosquitto_port: 1883
mosquitto_host: "{{ hostvars['containers']['ansible_host'] }}"
mosquitto_endpoint: "{{ mosquitto_host }}:{{ mosquitto_port }}"
mosquitto_bridge_username: "taptap"
mosquitto_ha_username: "homeassistant"

# TIGO telemetry freshness contract. The taptap_mqtt role runs a watchdog
# sidecar that exports the optimisers' newest report timestamp; the
# monitoring_stack role scrapes that endpoint and alerts on it. Declared here
# because the consumer is on another host, like the broker contract above.
#
# The bridge cannot report this itself: it republishes its state topic every
# 10 s whether or not the bus produced anything, and stamps it with its own
# clock, so the topic stays fresh while every value in it goes stale.
taptap_watchdog_port: 9102

# Timezone
timezone: Europe/Ljubljana

# Time sources for the Ansible-managed chrony on chrony_hosts. ntp_servers is
# the seam for a future local stratum-1 time server: add it first in the list.
# ARNES runs both servers as public stratum 1 for use in Slovenia.
ntp_servers:
  - host: ntp1.arnes.si
  - host: ntp2.arnes.si
  # SIQ and PTB run caesium national references, independent of the GPS both
  # ARNES servers use, so a fault shared by ARNES is outvoted. SIQ polls every
  # 1024-4096 s to keep the load on the national reference light.
  - host: ntp.siq.si
    options: minpoll 10 maxpoll 12
  # PTB's long round trip keeps it out of the clock average, so it only votes.
  # A 256 s poll cap lets it catch a sudden ARNES jump sooner.
  - host: ptbtime1.ptb.de
    options: maxpoll 8
# Pool members add votes so chrony can reject one bad ARNES server.
ntp_pools:
  - si.pool.ntp.org
ntp_pool_maxsources: 2

# Common packages
common_packages:
  - curl
  - wget
  - git
  - htop
  - net-tools
  - sudo
  - vim-tiny

# Ansible automation user
automation_user:
  name: ansible_user
  shell: /bin/bash
  groups:
    - sudo
  ssh_key: "{{ vault_ansible_ssh_public_key }}"

# Traefik <-> CrowdSec bridge network. Shared by the traefik and crowdsec roles,
# which both ensure the network exists, so the addressing has to agree in one
# place or the second role would fight the first.
#
# Subnet and both container addresses are pinned because CrowdSec's LAPI
# auto-creates a bouncer row named <name>@<ip> the first time a source IP
# presents an API key. Left dynamic, the subnet moves whenever the network is
# recreated (Docker takes the next free block from its pool) and the two
# containers swap .2/.3 by start order, so every recreate mints another stale
# bouncer row against the same single key. Values below are the ones already in
# use, so declaring them changes nothing at runtime.
traefik_network_subnet: "172.19.0.0/16"
traefik_network_gateway: "172.19.0.1"
traefik_network_traefik_address: "172.19.0.2"
traefik_network_crowdsec_address: "172.19.0.3"
