---
# Global variables for all hosts

# Network configuration
domain: home.local
dns_servers:
  - 193.110.81.0  # DNS0 public DNS (primary)
  - 185.253.5.0   # DNS0 public DNS (secondary)
  # Future: Will add AdGuard Home servers when deployed
  # - 192.168.30.6  # rpi2 - AdGuard Home (Primary)
  # - 192.168.30.2  # n5p - AdGuard Home (Secondary)

# Timezone
timezone: Europe/Ljubljana

# Common packages
common_packages:
  - curl
  - wget
  - git
  - htop
  - net-tools
  - sudo
  - vim-tiny

# Ansible automation user
automation_user:
  name: ansible_user
  shell: /bin/bash
  groups:
    - sudo
  ssh_key: "{{ vault_ansible_ssh_public_key }}"
