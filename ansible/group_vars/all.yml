---
# Global variables for all hosts

# Network configuration
domain: home.local
dns_servers:
  - 1.1.1.1        # Cloudflare DNS (primary)
  - 1.0.0.1        # Cloudflare DNS (secondary)
  - 2606:4700:4700::1111
  - 2606:4700:4700::1001
  # Future: Will add AdGuard Home servers when deployed
  # - 192.168.30.6  # rpi2 - AdGuard Home (Primary)
  # - 192.168.30.2  # n5p - AdGuard Home (Secondary)

# TrueNAS NFS configuration
truenas_nfs_server: "192.168.1.150"  # Temporary IP (will migrate to 192.168.30.3)
truenas_docker_volumes_share: "/mnt/tank/docker-volumes"

# Timezone
timezone: Europe/Ljubljana

# Common packages
common_packages:
  - curl
  - wget
  - git
  - htop
  - net-tools
  - sudo
  - vim-tiny

# Ansible automation user
automation_user:
  name: ansible_user
  shell: /bin/bash
  groups:
    - sudo
  ssh_key: "{{ vault_ansible_ssh_public_key }}"
