---
# Global variables for all hosts

# Network configuration
domain: home.local
dns_servers:
  - 192.168.1.145  # AdGuard Home (Primary - LXC on n5p)
  - 192.168.1.110  # AdGuard Home (Secondary - Docker on rpi4)
  # Fallback to Cloudflare if both AdGuard servers are down
  - 1.1.1.1        # Cloudflare DNS (fallback)
  - 1.0.0.1        # Cloudflare DNS (fallback)

# TrueNAS NFS configuration
truenas_nfs_server: "192.168.1.150"  # Temporary IP (will migrate to 192.168.30.3)
truenas_docker_volumes_share: "/mnt/tank/docker-volumes"
truenas_paperless_share: "/mnt/tank/paperless"
truenas_plex_apps_share: "/mnt/plex-apps"  # Separate pool
truenas_plex_bulk_share: "/mnt/plex-bulk"  # Separate pool

# NFS client mount options (shared default for all TrueNAS NFS mounts)
# - nofail + _netdev: don't block boot on unreachable NFS
# - x-systemd.automount: mount on first access; retries past the boot race
# - x-systemd.mount-timeout=60s: give NFS up to 60s to come up on first access
# - x-systemd.idle-timeout=0: never auto-unmount on idle
nfs_common_opts: "defaults,nofail,_netdev,x-systemd.automount,x-systemd.mount-timeout=60s,x-systemd.idle-timeout=0"

# Docker socket proxy contract (served by the docker_socket_proxy role on each
# docker host; consumed by autoheal + uptime_kuma). The proxy is the only
# container that mounts the raw /var/run/docker.sock; consumers reach the scoped
# Docker API over tcp on this internal-only network. Kept here so the role and
# its consumers share one source of truth for the name/port/endpoint.
docker_socket_proxy_network: "socket-proxy"
docker_socket_proxy_container_name: "docker-socket-proxy"
docker_socket_proxy_port: 2375
docker_socket_proxy_endpoint: "tcp://{{ docker_socket_proxy_container_name }}:{{ docker_socket_proxy_port }}"

# Timezone
timezone: Europe/Ljubljana

# Common packages
common_packages:
  - curl
  - wget
  - git
  - htop
  - net-tools
  - sudo
  - vim-tiny

# Ansible automation user
automation_user:
  name: ansible_user
  shell: /bin/bash
  groups:
    - sudo
  ssh_key: "{{ vault_ansible_ssh_public_key }}"
