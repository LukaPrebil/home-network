  #   vlan_id: 30
  #   ip: 192.168.30.7
  #   gateway: 192.168.30.1
  #   cores: 4
  #   memory: 4096  # 4GB
  #   disk_size: "+10G"
  #   storage: truenas-vms
  #   description: "Home Assistant OS"

# VM defaults (applied if not specified per-VM)
vm_defaults:
  cores: 2
  memory: 2048
  storage: truenas-vms
  network_bridge: vmbr0
