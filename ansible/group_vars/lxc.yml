---
# LXC container definitions for Proxmox
# Each container will be provisioned using the community.proxmox.proxmox module

# LXC Template configuration
lxc_template_storage: "local"  # Storage for LXC templates
lxc_template_ubuntu: "ubuntu-25.04-standard_25.04-1.1_amd64.tar.zst"  # Ubuntu 25.04 Plucky Proxmox template
lxc_template_url: "http://download.proxmox.com/images/system/ubuntu-25.04-standard_25.04-1.1_amd64.tar.zst"

lxc_containers:
  - name: immich
    vmid: 200
    node: n5p
    ostemplate: "local:vztmpl/{{ lxc_template_ubuntu }}"
    vlan_id: null  # No VLAN until router is deployed (flat network for now)
    ip: 192.168.1.141  # Temporary IP (will migrate to 192.168.30.8 when VLANs are active)
    gateway: 192.168.1.1  # Temporary gateway (will migrate to 192.168.30.1)
    netmask: 24
    cores: 4
    memory: 16384  # 16GB in MB
    swap: 4096  # 4GB swap
    disk: 64  # 64GB root disk (for large Docker images, especially ROCm ML)
    storage: truenas-vms
    description: "Immich Photo Management - self-hosted photos with ML features and GPU acceleration"
    unprivileged: true  # Use unprivileged container (more secure)
    features:
      - nesting=1  # Required for Docker inside LXC
      - keyctl=1   # Required for systemd
      - fuse=1     # Required for FUSE filesystems
      - mknod=1    # Required for NFS mounts
    onboot: true  # Start on Proxmox boot
    startup: "order=2"  # Boot after TrueNAS (order=1) provides NFS storage
    # GPU passthrough configuration for AMD Radeon 880M/890M iGPU
    gpu_passthrough: true  # Enable GPU passthrough for hardware transcoding
    gpu_device: /dev/dri  # AMD iGPU device (card0 + renderD128)
    # NFS storage configuration
    nfs_docker_volumes: true  # Bind mount Docker volumes from NFS

  - name: traefik
    vmid: 201
    node: n5p
    ostemplate: "local:vztmpl/{{ lxc_template_ubuntu }}"
    vlan_id: null  # No VLAN until router is deployed (flat network for now)
    ip: 192.168.1.142  # Temporary IP (will migrate to 192.168.60.2 when VLANs are active)
    gateway: 192.168.1.1  # Temporary gateway (will migrate to 192.168.60.1)
    netmask: 24
    cores: 2
    memory: 2048  # 2GB in MB
    swap: 512  # 512MB swap
    disk: 16  # 16GB root disk (lightweight reverse proxy)
    storage: truenas-vms
    description: "Traefik Reverse Proxy - automatic HTTPS and service discovery"
    unprivileged: true  # Use unprivileged container (more secure)
    features:
      - nesting=1  # Required for Docker inside LXC
      - keyctl=1   # Required for systemd
      - fuse=1     # Required for FUSE filesystems
    onboot: true  # Start on Proxmox boot
    startup: "order=2"  # Boot after TrueNAS (order=1) provides NFS storage
    # GPU passthrough not needed for reverse proxy
    gpu_passthrough: false
    # NFS storage not needed for reverse proxy (stores config locally)
    nfs_docker_volumes: false

  - name: omada
    vmid: 202
    node: n5p
    ostemplate: "local:vztmpl/{{ lxc_template_ubuntu }}"
    vlan_id: null  # No VLAN until router is deployed (flat network for now)
    ip: 192.168.1.143  # Temporary IP (will migrate to 192.168.50.2 when VLANs are active)
    gateway: 192.168.1.1  # Temporary gateway (will migrate to 192.168.50.1)
    netmask: 24
    cores: 2
    memory: 4096  # 4GB in MB (Omada + MongoDB requires more memory)
    swap: 1024  # 1GB swap
    disk: 24  # 24GB root disk (controller data + MongoDB)
    storage: truenas-vms
    description: "TP-Link Omada SDN Controller - network management"
    unprivileged: true  # Use unprivileged container (more secure)
    features:
      - keyctl=1   # Required for systemd
    onboot: true  # Start on Proxmox boot
    startup: "order=2"  # Boot after TrueNAS (order=1) provides NFS storage
    # No Docker needed (native .deb installation)
    gpu_passthrough: false
    nfs_docker_volumes: false

  - name: adguard
    vmid: 203
    node: n5p
    ostemplate: "local:vztmpl/{{ lxc_template_ubuntu }}"
    vlan_id: null  # No VLAN until router is deployed (flat network for now)
    ip: 192.168.1.145  # Temporary IP (will migrate to 192.168.30.9 when VLANs are active)
    gateway: 192.168.1.1  # Temporary gateway (will migrate to 192.168.30.1)
    netmask: 24
    cores: 2
    memory: 1024  # 1GB in MB (DNS service is lightweight)
    swap: 512  # 512MB swap
    disk: 8  # 8GB root disk (minimal storage needed)
    storage: truenas-vms
    description: "AdGuard Home - DNS filtering and ad blocking (Primary)"
    unprivileged: true  # Use unprivileged container (more secure)
    features:
      - nesting=1  # Required for systemd 257+ in unprivileged containers
      - keyctl=1   # Required for systemd
      - fuse=1     # Required for FUSE filesystems
      - mknod=1    # Required for device access
    onboot: true  # Start on Proxmox boot - critical service
    startup: "order=2"  # Boot after TrueNAS (order=1) provides NFS storage
    # No Docker needed (native binary installation)
    gpu_passthrough: false
    nfs_docker_volumes: false

  - name: monitoring
    vmid: 204
    node: n5p
    ostemplate: "local:vztmpl/{{ lxc_template_ubuntu }}"
    vlan_id: null  # No VLAN until router is deployed (flat network for now)
    ip: 192.168.1.146  # Temporary IP (will migrate to 192.168.30.10 when VLANs are active)
    gateway: 192.168.1.1  # Temporary gateway (will migrate to 192.168.30.1)
    netmask: 24
    cores: 4
    memory: 8192  # 8GB in MB (Prometheus + Grafana + Loki need memory for time-series data)
    swap: 2048  # 2GB swap
    disk: 32  # 32GB root disk (for metrics and log storage on NFS)
    storage: truenas-vms
    description: "Monitoring Stack - Prometheus, Grafana, Loki for observability"
    unprivileged: true  # Use unprivileged container (more secure)
    features:
      - nesting=1  # Required for Docker inside LXC
      - keyctl=1   # Required for systemd
      - fuse=1     # Required for FUSE filesystems
      - mknod=1    # Required for NFS mounts
    onboot: true  # Start on Proxmox boot - critical infrastructure
    startup: "order=2"  # Boot after TrueNAS (order=1) provides NFS storage
    # GPU passthrough not needed for monitoring
    gpu_passthrough: false
    # NFS storage for metrics and logs data
    nfs_docker_volumes: true

  - name: media
    vmid: 205
    node: n5p
    ostemplate: "local:vztmpl/{{ lxc_template_ubuntu }}"
    vlan_id: null  # No VLAN until router is deployed (flat network for now)
    ip: 192.168.1.147  # Temporary IP (will migrate to 192.168.30.11 when VLANs are active)
    gateway: 192.168.1.1  # Temporary gateway (will migrate to 192.168.30.1)
    netmask: 24
    cores: 4
    memory: 8192  # 8GB in MB (Jellyfin transcoding can be memory-intensive)
    swap: 2048  # 2GB swap
    disk: 32  # 32GB root disk (Jellyfin metadata cache)
    storage: truenas-vms
    description: "Jellyfin Media Server - streaming with AMD GPU hardware transcoding"
    unprivileged: true  # Use unprivileged container (more secure)
    features:
      - nesting=1  # Required for Docker inside LXC
      - keyctl=1   # Required for systemd
      - fuse=1     # Required for FUSE filesystems
      - mknod=1    # Required for NFS mounts
    onboot: true  # Start on Proxmox boot
    startup: "order=2"  # Boot after TrueNAS (order=1) provides NFS storage
    # GPU passthrough for hardware transcoding (AMD 890M)
    gpu_passthrough: true
    gpu_device: /dev/dri  # AMD iGPU device (card0 + renderD128)
    # Media server uses custom NFS mounts (not standard docker-volumes)
    nfs_docker_volumes: false
    # Custom NFS mounts for media
    nfs_plex_apps: true   # Mount plex-apps pool for config
    nfs_plex_bulk: true   # Mount plex-bulk pool for media

# LXC defaults (applied if not specified per-container)
lxc_defaults:
  cores: 2
  memory: 2048
  swap: 512
  disk: 10
  storage: truenas-vms
  network_bridge: vmbr0
  unprivileged: true
  onboot: false
