---
# LXC container definitions for Proxmox
# Each container will be provisioned using the community.proxmox.proxmox module

# LXC Template configuration
lxc_template_storage: "local"  # Storage for LXC templates
lxc_template_ubuntu: "ubuntu-25.04-standard_25.04-1.1_amd64.tar.zst"  # Ubuntu 25.04 Plucky Proxmox template
lxc_template_url: "http://download.proxmox.com/images/system/ubuntu-25.04-standard_25.04-1.1_amd64.tar.zst"

lxc_containers:
  - name: immich
    vmid: 200
    node: n5p
    ostemplate: "local:vztmpl/{{ lxc_template_ubuntu }}"
    vlan_id: null  # No VLAN until router is deployed (flat network for now)
    ip: 192.168.1.141  # Temporary IP (will migrate to 192.168.30.8 when VLANs are active)
    gateway: 192.168.1.1  # Temporary gateway (will migrate to 192.168.30.1)
    netmask: 24
    cores: 4
    memory: 16384  # 16GB in MB
    swap: 4096  # 4GB swap
    disk: 32  # 32GB root disk
    storage: truenas-vms
    description: "Immich Photo Management - self-hosted photos with ML features and GPU acceleration"
    unprivileged: true  # Use unprivileged container (more secure)
    features:
      - nesting=1  # Required for Docker inside LXC
      - keyctl=1   # Required for systemd
    onboot: true  # Start on Proxmox boot
    # GPU passthrough configuration (will be configured separately after initial setup)
    gpu_passthrough: false  # Disabled for initial setup, will configure manually
    gpu_device: /dev/dri  # AMD iGPU device

# LXC defaults (applied if not specified per-container)
lxc_defaults:
  cores: 2
  memory: 2048
  swap: 512
  disk: 10
  storage: truenas-vms
  network_bridge: vmbr0
  unprivileged: true
  onboot: false
