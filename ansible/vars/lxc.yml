---
# LXC container definitions for Proxmox
# Each container will be provisioned using the community.proxmox.proxmox module

# LXC Template configuration
# Ubuntu 26.04 LTS (25.04 Plucky is EOL). Confirm the exact build suffix on n5p
# before provisioning - `pveam available --section system | grep ubuntu-26` -
# and correct the filename below if it is not -1 (pveam download fails loudly
# if the name is not in the aplinfo index).
lxc_template_ubuntu: "ubuntu-26.04-standard_26.04-1_amd64.tar.zst"  # Ubuntu 26.04 LTS Proxmox template

# VLAN note (2026-09-14 renumber, docs/network-architecture.md section 7): n5p's
# switch port is hybrid - VLAN 30 untagged (PVID 30) + VLAN 60 tagged - so
# Servers-VLAN guests keep vlan_id: null and only DMZ guests carry a tag.
lxc_containers:
  - name: immich
    vmid: 210  # Rebuilt onto 26.04 2026-08-22; predecessor 200 kept stopped as rollback
    node: n5p
    ostemplate: "local:vztmpl/{{ lxc_template_ubuntu }}"
    vlan_id: null  # VLAN 30 via switch-port PVID (untagged)
    ip: 192.168.30.141
    gateway: 192.168.30.1
    netmask: 24
    cores: 4
    memory: 10240  # 10GB cap. Measured 2026-09-13: one ML session (upload one photo, three
    # models load) peaked at 8128 MiB, which is exactly memory.high for an 8GB cap, because
    # Proxmox sets high = max x 127/128. The old cap was clamping the burst, not meeting its
    # demand, so the container reclaimed its own NFS page cache mid-load and re-read it. The
    # host cost stays bounded because the excess is reclaimable cache: measured at 10GB, one
    # session moves the host by ~5.3 GiB, of which ~3.9 GiB is anonymous memory (the models'
    # own working set) and the rest is NFS page cache the kernel can take back.
    # NOTE: provision-lxc.yml applies memory only at creation, so editing this value does not
    # reach a running guest. The live apply is `pct set 210 --memory 10240 --swap 4096`.
    swap: 4096  # 4GB swap
    disk: 64  # 64GB root disk (for large Docker images, especially ROCm ML)
    storage: truenas-vms
    description: "Immich Photo Management - self-hosted photos with ML features and GPU acceleration"
    unprivileged: true  # Use unprivileged container (more secure)
    features:
      - nesting=1  # Required for Docker inside LXC
      - keyctl=1   # Required for systemd
      - fuse=1     # Required for FUSE filesystems
      - mknod=1    # Required for NFS mounts
    onboot: true  # Start on Proxmox boot
    startup: "order=2"  # Boot after TrueNAS (order=1) provides NFS storage
    # GPU passthrough configuration for AMD Radeon 880M/890M iGPU
    gpu_passthrough: true  # Enable GPU passthrough for hardware transcoding
    # NFS storage configuration. All three are bind mounts of host NFS mounts:
    # mp0 /srv/docker, mp1 /mnt/immich-photos, mp2 /mnt/external-data.
    nfs_docker_volumes: true  # Bind mount Docker volumes from NFS
    nfs_immich_photos: true   # The photo library itself
    nfs_external_data: true   # Read-only external library, consumed via immich_external_libraries

  - name: traefik
    vmid: 211  # Rebuilt onto 26.04 2026-08-21; predecessor 201 kept stopped as rollback
    node: n5p
    ostemplate: "local:vztmpl/{{ lxc_template_ubuntu }}"
    vlan_id: 60  # DMZ - tagged on the n5p trunk port
    ip: 192.168.60.142
    gateway: 192.168.60.1
    netmask: 24
    cores: 2
    memory: 2048  # 2GB in MB
    swap: 512  # 512MB swap
    disk: 16  # 16GB root disk (lightweight reverse proxy)
    storage: truenas-vms
    description: "Traefik Reverse Proxy - automatic HTTPS and service discovery"
    unprivileged: true  # Use unprivileged container (more secure)
    features:
      - nesting=1  # Required for Docker inside LXC
      - keyctl=1   # Required for systemd
      - fuse=1     # Required for FUSE filesystems
    onboot: true  # Start on Proxmox boot
    startup: "order=2"  # Boot after TrueNAS (order=1) provides NFS storage
    # GPU passthrough not needed for reverse proxy
    gpu_passthrough: false
    # NFS storage not needed for reverse proxy (stores config locally)
    nfs_docker_volumes: false

  - name: omada
    vmid: 212  # Rebuilt onto 26.04 2026-08-21; predecessor 202 kept stopped as rollback
    node: n5p
    ostemplate: "local:vztmpl/{{ lxc_template_ubuntu }}"
    vlan_id: null  # VLAN 30 via switch-port PVID (untagged)
    ip: 192.168.30.143
    gateway: 192.168.30.1
    netmask: 24
    cores: 2
    memory: 4096  # 4GB in MB (Omada + MongoDB requires more memory)
    swap: 1024  # 1GB swap
    disk: 24  # 24GB root disk (controller data + MongoDB)
    storage: truenas-vms
    description: "TP-Link Omada SDN Controller - network management"
    unprivileged: true  # Use unprivileged container (more secure)
    features:
      - nesting=1  # Required for systemd 257+ in unprivileged containers
      - keyctl=1   # Required for systemd
      - fuse=1     # Required for FUSE filesystems
      - mknod=1    # Required for device access
    onboot: true  # Start on Proxmox boot
    startup: "order=2"  # Boot after TrueNAS (order=1) provides NFS storage
    # No Docker needed (native .deb installation)
    gpu_passthrough: false
    nfs_docker_volumes: false

  - name: adguard
    vmid: 213  # Rebuilt onto 26.04 2026-08-21; predecessor 203 kept stopped as rollback
    node: n5p
    ostemplate: "local:vztmpl/{{ lxc_template_ubuntu }}"
    vlan_id: null  # VLAN 30 via switch-port PVID (untagged)
    ip: 192.168.30.145
    gateway: 192.168.30.1
    netmask: 24
    cores: 2
    memory: 1024  # 1GB in MB (DNS service is lightweight)
    swap: 512  # 512MB swap
    disk: 8  # 8GB root disk (minimal storage needed)
    storage: truenas-vms
    description: "AdGuard Home - DNS filtering and ad blocking (Primary)"
    unprivileged: true  # Use unprivileged container (more secure)
    features:
      - nesting=1  # Required for systemd 257+ in unprivileged containers
      - keyctl=1   # Required for systemd
      - fuse=1     # Required for FUSE filesystems
      - mknod=1    # Required for device access
    onboot: true  # Start on Proxmox boot - critical service
    startup: "order=2"  # Boot after TrueNAS (order=1) provides NFS storage
    # No Docker needed (native binary installation)
    gpu_passthrough: false
    nfs_docker_volumes: false

  - name: monitoring
    vmid: 214  # Rebuilt onto 26.04 2026-08-21; predecessor 204 kept stopped as rollback
    node: n5p
    ostemplate: "local:vztmpl/{{ lxc_template_ubuntu }}"
    vlan_id: null  # VLAN 30 via switch-port PVID (untagged)
    ip: 192.168.30.146
    gateway: 192.168.30.1
    netmask: 24
    cores: 4
    memory: 4096  # 4GB cap. Working set ~3.5GB (prom 447MB + loki 85MB + grafana 143MB +
    # cadvisor + exporters). Tight on the upper bound - if Prometheus TSDB or Loki chunks
    # grow past current footprint, bump back to 5-6GB before this OOMs.
    swap: 2048  # 2GB swap
    disk: 32  # 32GB root disk - holds the TSDB/Loki/Grafana state on local rootfs (wave 5)
    storage: truenas-vms
    description: "Monitoring Stack - Prometheus, Grafana, Loki for observability"
    unprivileged: true  # Use unprivileged container (more secure)
    features:
      - nesting=1  # Required for Docker inside LXC
      - keyctl=1   # Required for systemd
      - fuse=1     # Required for FUSE filesystems
      - mknod=1    # Required for NFS mounts
    onboot: true  # Start on Proxmox boot - critical infrastructure
    startup: "order=2"  # Boot after TrueNAS (order=1) provides NFS storage
    # GPU passthrough not needed for monitoring
    gpu_passthrough: false
    # No NFS docker-volumes bind: Prometheus TSDB / Loki chunks / Grafana state
    # moved to local rootfs in wave 5 (SQLite/TSDB-on-NFS is banned). The old
    # /srv/docker bind is vestigial and dropped. host_vars/monitoring.yml also
    # sets docker_nfs_volumes_enabled=false so the docker role skips the stub.
    nfs_docker_volumes: false

  - name: media
    vmid: 215  # Rebuilt onto 26.04 2026-08-21; predecessor 205 kept stopped as rollback
    node: n5p
    ostemplate: "local:vztmpl/{{ lxc_template_ubuntu }}"
    vlan_id: null  # VLAN 30 via switch-port PVID (untagged)
    ip: 192.168.30.147
    gateway: 192.168.30.1
    netmask: 24
    cores: 4
    memory: 4096  # 4GB cap. Jellyfin idle at ~160MB, hardware-transcoded streams don't blow
    # RAM (GPU does the work). Earlier 8GB allocation was ~25x actual usage.
    swap: 2048  # 2GB swap
    disk: 32  # 32GB root disk (Jellyfin metadata cache)
    storage: truenas-vms
    description: "Jellyfin Media Server - streaming with AMD GPU hardware transcoding"
    unprivileged: true  # Use unprivileged container (more secure)
    features:
      - nesting=1  # Required for Docker inside LXC
      - keyctl=1   # Required for systemd
      - fuse=1     # Required for FUSE filesystems
      - mknod=1    # Required for NFS mounts
    onboot: true  # Start on Proxmox boot
    startup: "order=2"  # Boot after TrueNAS (order=1) provides NFS storage
    # GPU passthrough for hardware transcoding (AMD 890M)
    gpu_passthrough: true
    # Media server uses custom NFS mounts (not standard docker-volumes)
    nfs_docker_volumes: false
    # Custom NFS mounts for media. plex-apps held the old Jellyfin config; that
    # moved to local rootfs (/opt/jellyfin/data) in wave 5, so the plex-apps bind
    # is vestigial and dropped. plex-bulk is the live media library - keep it.
    nfs_plex_apps: false   # Jellyfin config now on local rootfs (was plex-apps)
    nfs_plex_bulk: true    # Mount plex-bulk pool for media

  - name: hermes
    vmid: 206
    node: n5p
    ostemplate: "local:vztmpl/{{ lxc_template_ubuntu }}"
    vlan_id: null  # VLAN 30 via switch-port PVID (untagged)
    ip: 192.168.30.149
    gateway: 192.168.30.1
    netmask: 24
    cores: 4
    memory: 6144  # 6GB cap. Baseline 0.5-1.5GB at idle, 2-4GB during streaming
    # tool calls or parallel kanban subagents. 6GB leaves comfortable headroom
    # for the projected steady state; bump to 8GB only if code-orchestration
    # workloads start hitting the cap during multi-worker runs.
    swap: 1024  # 1GB swap
    disk: 20  # 20GB root disk: install footprint ~1GB, SQLite session DB grows
    # slowly (~50MB/month at expected use), logs rotate. 20GB is generous.
    storage: truenas-vms
    description: "Hermes Agent - autonomous AI daemon (Nous Research)"
    unprivileged: true
    features:
      - nesting=1   # Required for systemd 257+ in unprivileged containers
      - keyctl=1    # Required for systemd
      - fuse=1      # Required for FUSE filesystems
    onboot: true
    startup: "order=3"  # Boot after TrueNAS + containers VM (needs ha-mcp reachable)
    gpu_passthrough: false
    nfs_docker_volumes: false  # State stays on local rootfs - SQLite locking on NFS is banned

# LXC defaults (applied if not specified per-container)
lxc_defaults:
  cores: 2
  memory: 2048
  swap: 512
  disk: 10
  storage: truenas-vms
  network_bridge: vmbr0
  unprivileged: true
  onboot: false
