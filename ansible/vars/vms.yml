  #   gateway: 192.168.30.1
  #   cores: 4
  #   memory: 4096  # 4GB
  #   disk_size: "+10G"
  #   storage: truenas-vms
  #   description: "Home Assistant OS"

# VM defaults (applied if not specified per-VM)
vm_defaults:
  cores: 2
  memory: 2048
  # No balloon default: each VM must declare its own floor or omit balloon
  # entirely (omission = balloon = memory = no shrinking). Defaulting to a
  # numeric floor here would silently push every future VM toward an
  # under-provisioned state on its first provision.
  storage: truenas-vms
  network_bridge: vmbr0
