---
# VM definitions for cloning from cloud-init template
# Each VM is cloned from the ubuntu-cloudinit-template

vms_to_create:
  - name: containers
    vmid: 101
    vlan_id: null  # No VLAN until router is deployed (flat network for now)
    ip: 192.168.1.140  # Temporary IP (will migrate to 192.168.30.4 when VLANs are active)
    gateway: 192.168.1.1  # Temporary gateway (will migrate to 192.168.30.1)
    cores: 4
    memory: 6144  # 6GB flat cap (no balloon). Working set ~2.6GB across 17 Docker
    # containers; 6GB leaves 3.4GB headroom for paperless OCR bursts and Arr scans.
    # An earlier attempt at 6GB cap / 2GB balloon FLOOR caused OOMs because pvestatd
    # actively shrunk the live VM to ~2.6GB under host pressure and bursts then
    # exceeded the floor. A flat cap (memory==balloon, no shrinking) is the safe
    # shape - bursts go up to 6GB without pvestatd intervention.
    disk_size: "+40G"  # Increase disk by 40GB (total 50GB)
    storage: truenas-vms
    onboot: true  # Start on host boot (enforced by the vm-startup-reconcile play)
    startup: "order=2"  # Boot after TrueNAS (order=1) provides NFS storage
    description: "Docker Host VM - runs containerized services"

  - name: dev
    vmid: 148
    vlan_id: null  # Flat network until Omada router lands; will migrate to VLAN 20
    ip: 192.168.1.148
    gateway: 192.168.1.1
    cores: 6
    memory: 12288  # 12GB cap. Working set ~5GB, 2x headroom. No ballooning
    # (tried floors of 4GB and 6GB: both OOM-killed chrome/dbus/Claude workers
    # because peak working set spikes well above steady-state).
    disk_size: "+90G"  # Template ships 10GB, final disk 100GB
    storage: truenas-vms
    onboot: true  # Start on host boot (enforced by the vm-startup-reconcile play)
    startup: "order=3"  # Boot after tn-storage (order=1) and containers (order=2)
    # Per-VM DNS override - AdGuard pair only, no Cloudflare fallback.
    # The global default in group_vars/all/main.yml falls back to 1.1.1.1/1.0.0.1
    # if AdGuard hiccups, which would bypass filtering. AdGuard primary +
    # secondary already gives two-server redundancy; if both are down DNS
    # legitimately fails.
    dns_servers:
      - 192.168.1.145  # AdGuard Home (primary, LXC on n5p)
      - 192.168.1.110  # AdGuard Home (secondary, Docker on rpi4)
    snapshot_weekly: true  # Picked up by the n5p weekly snapshot cron
    description: "Development VM - Ubuntu 26.04, web-dev environment, Tailscale"

  # Example VM definitions (uncomment and customize as needed)

  # - name: nginx
