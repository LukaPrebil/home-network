---
# Example secrets file - documents every vault_* key the playbooks expect.
# Real values live SOPS-encrypted in group_vars/all/secrets.sops.yml, which the
# community.sops vars plugin decrypts automatically for every host.
#
# To create the encrypted file:
# 1. Copy this file into place: cp secrets.example.yml group_vars/all/secrets.sops.yml
# 2. Fill in real values: vim group_vars/all/secrets.sops.yml
# 3. Encrypt in place: sops --encrypt --in-place group_vars/all/secrets.sops.yml
#
# Step 3 needs no -age flag: .sops.yaml at the repo root matches that path and
# supplies the recipient. If you forget step 3, the vars plugin refuses to load
# the plaintext file rather than silently using it, so the mistake is loud.
#
# To edit later: sops group_vars/all/secrets.sops.yml
# To view: sops --decrypt group_vars/all/secrets.sops.yml
#
# The age private key stays at ~/.config/sops/age/keys.txt and is never
# committed. Only the public recipient is in .sops.yaml.

# SSH public keys for users
vault_ansible_ssh_public_key: "ssh-ed25519 AAAAC3... ansible_user@homelab"
vault_luka_ssh_public_key: "ssh-ed25519 AAAAC3... luka@macbook"

# Proxmox API credentials (root password + API token for provisioning playbooks)
vault_proxmox_api_password: "your_proxmox_root_password"
vault_proxmox_api_user: "root@pam"
vault_proxmox_api_token_name: "your_token_name"
vault_proxmox_api_token_secret: "your_api_token_secret"

# TrueNAS credentials
vault_truenas_root_password: "secure_password_here"

# LXC provisioning (provision-lxc.yml)
vault_lxc_root_password: "secure_password_here"

# AdGuard Home web UI
vault_adguard_username: "admin"
vault_adguard_password: "secure_password_here"

# Omada controller
vault_omada_controller_user: "admin"
vault_omada_controller_password: "secure_password_here"

# Traefik (Cloudflare token for the ACME DNS challenge + CrowdSec bouncer)
vault_cloudflare_dns_api_token: "your_cloudflare_dns_api_token"
vault_crowdsec_bouncer_key: "your_crowdsec_bouncer_key"

# Grafana (admin login + Telegram alerting contact point)
vault_grafana_admin_password: "secure_password_here"
vault_grafana_telegram_bot_token: "your_telegram_bot_token"
vault_grafana_telegram_chat_id: "your_telegram_chat_id"

# Home Assistant MCP server (long-lived access token)
vault_ha_mcp_token: "your_ha_long_lived_access_token"

# Immich (PostgreSQL)
vault_immich_db_password: "secure_password_here"

# Paperless-ngx
vault_paperless_admin_password: "secure_password_here"
vault_paperless_db_password: "secure_password_here"
vault_paperless_secret_key: "long_random_string_here"

# ATProto PDS - generate secrets with: openssl rand --hex 16
vault_pds_jwt_secret: "generate_with_openssl_rand_hex_16"
vault_pds_admin_password: "secure_password_here"
# The placeholder phrase below reads as high-entropy to secret scanners; a real
# value is 64 lowercase hex chars with no underscores.
vault_pds_plc_rotation_key: "64_hex_char_secp256k1_private_key"  # gitleaks:allow

# Thread Matter Stack
# Full Active Operational Dataset TLV from: sudo docker exec otbr ot-ctl dataset active -x
# SECRET (contains the Network Key + PSKc). Source of truth for the Thread network
# identity; the role auto-restores it onto an empty /var/lib/thread store.
vault_thread_active_dataset: "0e08000000000001000000030000..."

# Tailscale auth key for dev VM enrolment.
# Generate at https://login.tailscale.com/admin/settings/keys with:
#   reusable=false, ephemeral=false, preauthorized=true, tags=tag:dev, expiry=90d
# REVOKE from the admin console immediately after the VM enrols on first boot;
# the role's idempotency guard ensures subsequent runs never reference it again.
vault_tailscale_auth_key: "tskey-auth-..."

# Tailscale auth key for the rpi4 subnet router.
# Generate at https://login.tailscale.com/admin/settings/keys with:
#   reusable=false, ephemeral=false, preauthorized=true,
#   tags=tag:subnet-router, expiry=90d
# Requires `tag:subnet-router` to exist in the tailnet ACL with an
# autoApprovers.routes entry for 192.168.1.0/24 (so re-enrols approve
# the route automatically). REVOKE after first successful enrol; role
# idempotency means subsequent runs never need it.
vault_tailscale_router_auth_key: "tskey-auth-..."

# GitHub fine-grained PAT - ONE-SHOT.
# Mint at https://github.com/settings/personal-access-tokens/new with:
#   Resource owner: personal account
#   Permissions: SSH keys = Read and write (only)
#   Expiration: 7 days
# Used once during dev_vm bootstrap to register the per-host SSH key.
# After the bootstrap run completes, REVOKE the token at
# https://github.com/settings/tokens AND set this entry back to "" in
# group_vars/all/secrets.sops.yml so re-runs without re-minting fail at the
# preflight task (loud failure, never silent).
vault_github_pat: ""

# Hermes Agent - autonomous AI daemon (Nous Research).
# Reuses your Claude Max subscription via Claude Code's OAuth token, so
# inference billing flows through the Max sub (no separate API spend).
#   - To mint: install Claude Code, run `claude` to authenticate, then
#     pull the token from ~/.claude/.credentials.json (look for the
#     access_token field). Rotates periodically - re-paste when needed.
#   - Alternative: leave OAuth blank and set vault_hermes_anthropic_api_key
#     with a sk-ant-... key for pay-per-token billing.
vault_hermes_claude_code_oauth_token: ""

# Telegram bot - primary messaging surface for Hermes.
#   - Create the bot: message @BotFather, /newbot, copy the token.
#   - Allowed users: comma-separated Telegram user IDs. Look up your ID
#     via @userinfobot. Without this list, ANYONE who finds the bot can
#     drive the agent.
vault_hermes_telegram_bot_token: ""
vault_hermes_telegram_allowed_users: ""  # e.g. "12345678,87654321"

# Home Assistant long-lived access token for Hermes' HA gateway subscription
# (HA WebSocket events trigger agent reactions). Mint at HA: Profile →
# Security → "Create Token".
vault_hermes_hass_token: ""
