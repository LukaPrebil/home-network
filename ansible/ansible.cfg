[defaults]
inventory = inventory/hosts.yml
remote_user = ansible_user
retry_files_enabled = False
stdout_callback = default
result_format = yaml
callbacks_enabled = timer, profile_tasks
interpreter_python = auto_silent
# Enabling any vars plugin replaces the built-in default list, so host_group_vars
# must be named explicitly here or ordinary group_vars/host_vars stop loading.
vars_plugins_enabled = host_group_vars,community.sops.sops

[community.sops]
# SOPS defaults to the OS user-config dir for the age key, which on macOS is
# ~/Library/Application Support/sops/age/keys.txt - not the XDG path the key
# actually lives at. Without this, decryption fails with "identity did not
# match any of the recipients" despite the key being present.
age_keyfile = ~/.config/sops/age/keys.txt

[privilege_escalation]
#become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
# Pipelining batches module steps into one SSH session per task, cutting
# round-trips. Safe here: no managed host uses sudo with requiretty.
pipelining = True
