---
# Migrate containers from rpi4 to containers VM
#
# This playbook deploys containerized services (Uptime Kuma, ddns-updater,
# OctoEverywhere) to the containers VM with optional data migration from rpi4.
#
# Usage:
#   # Deploy without migration (just setup infrastructure)
#   ansible-playbook migrate-containers.yml
#
#   # Deploy with data migration from rpi4
#   ansible-playbook migrate-containers.yml -e migrate_data=true
#
#   # Deploy in stopped state (for validation later)
#   ansible-playbook migrate-containers.yml -e service_state=stopped
#
# Migration strategy:
#   - Two-stage migration: rpi4 → local backup → containers VM
#   - First run with migrate_data=true: Creates local backup from rpi4
#   - Subsequent runs: Uses local backup (no rpi4 dependency)
#   - Old services remain running on rpi4 as backup

- name: Migrate containerized services to containers VM
  hosts: containers
  become: yes
  gather_facts: yes

  vars:
    # Migration control (override with -e migrate_data=true)
    migrate_data: false

    # Service state control (override with -e service_state=stopped)
    service_state: started

  pre_tasks:
    - name: Display migration configuration
      ansible.builtin.debug:
        msg:
          - "Migration Mode: {{ 'ENABLED - Will sync from rpi4' if migrate_data else 'DISABLED - Infrastructure only' }}"
          - "Service State: {{ service_state }}"
          - "Target Host: {{ ansible_host }}"
          - ""
          - "Services to deploy:"
          - "  - Uptime Kuma (port 3001)"
          - "  - ddns-updater (port 8000)"
          - "  - OctoEverywhere (Elegoo companion)"

    - name: Ensure Docker is running
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create Traefik Docker network
      community.docker.docker_network:
        name: traefik
        state: present

  roles:
    - role: uptime-kuma
      vars:
        uptime_kuma_migrate_data: "{{ migrate_data }}"
        uptime_kuma_service_state: "{{ service_state }}"
      tags: uptime-kuma

    - role: ddns-updater
      vars:
        ddns_updater_migrate_data: "{{ migrate_data }}"
        ddns_updater_service_state: "{{ service_state }}"
      tags: ddns-updater

    - role: octoeverywhere
      vars:
        octoeverywhere_migrate_data: "{{ migrate_data }}"
        octoeverywhere_service_state: "{{ service_state }}"
      tags: octoeverywhere

  post_tasks:
    - name: Display deployment summary
      ansible.builtin.debug:
        msg:
          - "========================================="
          - "Container migration deployment complete!"
          - "========================================="
          - ""
          - "Services deployed on {{ ansible_host }}:"
          - "  - Uptime Kuma: http://{{ ansible_host }}:3001"
          - "  - ddns-updater: http://{{ ansible_host }}:8000"
          - "  - OctoEverywhere: Connected to printer {{ octoeverywhere_printer_ip }}"
          - ""
          - "Current state: {{ service_state }}"
          - ""
          - "{% if migrate_data %}Data migration completed from rpi4{% else %}Infrastructure deployed (no data migration){% endif %}"
          - ""
          - "Next steps:"
          - "  1. Validate each service using validation playbooks"
          - "  2. Update Traefik backends if services working"
          - "  3. Clean up rpi4 after validation"
