---
# Playbook to update DNS configuration on all managed hosts
#
# Usage:
#   ansible-playbook update-dns.yml
#
# This playbook:
# 1. Updates /etc/resolv.conf to use AdGuard Home DNS servers
# 2. Excludes AdGuard servers themselves to avoid circular dependency
# 3. Applies to all Linux servers in the infrastructure

- name: Update DNS configuration on all hosts
  hosts: linux_servers:!adguard_hosts
  become: true
  gather_facts: true

  tasks:
    - name: Display DNS update information
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "Updating DNS Configuration"
          - "=============================================="
          - ""
          - "Target Host: {{ inventory_hostname }}"
          - "IP Address: {{ ansible_host }}"
          - ""
          - "New DNS Servers:"
          - "  Primary:   192.168.1.145 (AdGuard Primary - n5p LXC)"
          - "  Secondary: 192.168.1.110 (AdGuard Secondary - rpi4)"
          - "  Fallback:  1.1.1.1, 1.0.0.1 (Cloudflare)"
          - ""
          - "Updating configuration..."
          - "=============================================="

    - name: Import DNS configuration tasks
      ansible.builtin.include_role:
        name: common
        tasks_from: dns

- name: Post-update verification
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "DNS Configuration Update Complete!"
          - "=============================================="
          - ""
          - "All managed hosts now use AdGuard Home for DNS"
          - ""
          - "Verify DNS resolution on a host:"
          - "  ssh <hostname> 'cat /etc/resolv.conf'"
          - "  ssh <hostname> 'nslookup homeassistant.lan'"
          - ""
          - "Note: AdGuard servers themselves were skipped to"
          - "avoid circular dependency (they use Cloudflare)."
          - ""
          - "=============================================="
