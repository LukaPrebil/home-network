---
# Main playbook for homelab infrastructure
#
# Usage:
#   ansible-playbook site.yml                            # Full convergence
#   ansible-playbook site.yml --tags traefik             # Just Traefik
#   ansible-playbook site.yml --tags monitoring          # Monitoring stack
#   ansible-playbook site.yml --tags adguard             # AdGuard on all hosts
#   ansible-playbook site.yml --tags media               # Plex + Jellyfin + Arr
#   ansible-playbook site.yml --tags thread-matter       # OTBR + Matter Server
#   ansible-playbook site.yml --tags monitoring-agents   # Node Exporter + Alloy
#   ansible-playbook site.yml --tags paperless-ngx       # Paperless-ngx document management
#   ansible-playbook site.yml --tags pds                  # ATProto PDS
#   ansible-playbook site.yml --tags ha-mcp              # Home Assistant MCP server
#   ansible-playbook site.yml --tags tigo                # MQTT broker + TIGO optimizer bridge
#   ansible-playbook site.yml --tags mosquitto           # Just the MQTT broker
#   ansible-playbook site.yml --tags taptap              # Just the TIGO optimizer bridge
#   ansible-playbook site.yml --tags crowdsec             # CrowdSec intrusion detection
#   ansible-playbook site.yml --tags containers-services # Uptime Kuma + OctoEverywhere
#   ansible-playbook site.yml --tags dev-vm              # Dev VM (apt, dotfiles, claude code, ufw)
#   ansible-playbook site.yml --tags tailscale                    # Tailscale role on dev + rpi4
#   ansible-playbook site.yml --tags tailscale-subnet-router      # Just the rpi4 subnet router
#   ansible-playbook site.yml --limit immich             # Everything for Immich host
#   ansible-playbook site.yml --limit 'all:!tn-storage'  # Skip TrueNAS (no apt)
#   ansible-playbook site.yml --tags apt-upgrade --limit '<host>'   # Opt-in OS package upgrade
#   ansible-playbook site.yml --tags dev-vm-upgrade --limit dev     # Opt-in dev-VM apt upgrade

- name: Configure all Linux servers with common settings
  hosts: linux_servers
  become: true
  tags:
    - common
  roles:
    - common

- name: Configure Proxmox hosts
  hosts: proxmox_hosts
  become: true
  tags:
    - proxmox
  vars_files:
    - vars/lxc.yml  # lxc_loadavg.yml needs lxc_containers
  roles:
    - proxmox

- name: Configure development VM
  hosts: dev_hosts
  become: true
  tags:
    - dev-vm
  pre_tasks:
    - name: Wait for SSH to come up
      ansible.builtin.wait_for_connection:
        timeout: 300
  roles:
    - common
    - docker
    - tailscale
    - dev_vm

- name: Deploy Node Exporter for metrics collection
  hosts: monitoring_agents
  become: true
  tags:
    - node-exporter
    - monitoring
    - monitoring-agents
  roles:
    - node_exporter

- name: Deploy docker-socket-proxy and Autoheal container health monitor
  hosts: docker_runtime_hosts
  become: true
  tags:
    - autoheal
  roles:
    - docker
    - docker_socket_proxy
    - autoheal

# Must run after the docker play above. The alloy role decides whether to render
# its container-log block from a runtime `which docker` probe, so on a host being
# built for the first time it would otherwise render no docker log block at all
# and ship nothing under job="docker" until the next converge.
- name: Deploy Grafana Alloy for metrics and log shipping
  hosts: monitoring_agents
  become: true
  tags:
    - alloy
    - monitoring
    - monitoring-agents
  roles:
    - alloy

- name: Deploy monitoring stack
  hosts: monitoring_hosts
  become: true
  tags:
    - monitoring
  roles:
    - docker
    - monitoring_stack

- name: Deploy CrowdSec intrusion detection
  hosts: traefik
  become: true
  tags:
    - crowdsec
  roles:
    - docker
    - crowdsec

- name: Deploy Traefik reverse proxy
  hosts: traefik
  become: true
  tags:
    - traefik
  roles:
    - common
    - docker
    - traefik

- name: Deploy Immich photo management
  hosts: immich
  become: true
  tags:
    - immich
  roles:
    - common
    - docker
    - immich

- name: Deploy Omada Controller
  hosts: omada
  become: true
  tags:
    - omada
  roles:
    - common
    - omada_controller

- name: Deploy AdGuard Home DNS
  hosts: adguard_hosts
  become: true
  serial: 1  # primary + secondary stagger so one DNS server always answers
  tags:
    - adguard
  roles:
    - adguard

- name: Deploy OpenThread Border Router (OTBR)
  hosts: containers
  become: true
  tags:
    - otbr
    - thread-matter
  roles:
    - docker
    - otbr

- name: Deploy Matter Server (matterjs-server)
  hosts: rpi4
  become: true
  tags:
    - matter-server
    - thread-matter
  roles:
    - docker
    - matter_server

- name: Configure Tailscale subnet router on rpi4
  hosts: rpi4
  become: true
  tags:
    - tailscale
    - tailscale-subnet-router
  roles:
    - tailscale

- name: Deploy Jellyfin media server
  hosts: media_hosts
  become: true
  tags:
    - jellyfin
    - media
  roles:
    - docker
    - jellyfin

- name: Deploy Arr Stack (Sonarr, Radarr, Prowlarr)
  hosts: arr_stack_hosts
  become: true
  tags:
    - arr-stack
    - media
  roles:
    - docker
    - arr_stack

- name: Deploy Paperless-ngx document management
  hosts: containers
  become: true
  tags:
    - paperless-ngx
  roles:
    - docker
    - paperless_ngx

- name: Deploy ATProto PDS (Personal Data Server)
  hosts: containers
  become: true
  tags:
    - pds
  roles:
    - docker
    - pds

- name: Deploy Home Assistant MCP server
  hosts: containers
  become: true
  tags:
    - ha-mcp
  roles:
    - docker
    - ha_mcp

# Ordered broker-then-bridge inside one play: the bridge's first action is to
# connect to MQTT, and a bridge that starts against a missing broker burns its
# whole MAX_ERROR budget and exits before the broker is up.
- name: Deploy MQTT broker and TIGO optimizer telemetry bridge
  hosts: containers
  become: true
  tags:
    - tigo
  roles:
    - docker
    - mosquitto
    - taptap_mqtt

- name: Deploy container services (Uptime Kuma, OctoEverywhere)
  hosts: containers
  become: true
  tags:
    - containers-services
  roles:
    - docker
    # Ensures the socket-proxy + network exist when this play runs standalone
    # (--tags containers-services) so uptime_kuma can join the external network.
    - docker_socket_proxy
    - uptime_kuma
    - octoeverywhere

- name: Deploy Hermes Agent
  hosts: hermes_hosts
  become: true
  tags:
    - hermes
  roles:
    - common
    - hermes

# TrueNAS (truenas_hosts) has no apt - exclude it from the group structurally
# rather than relying on a --limit at the CLI.
- name: OS-level package upgrade (opt-in)
  hosts: linux_servers:!truenas_hosts
  become: true
  tags:
    - apt-upgrade
    - never
  tasks:
    - name: Run the common role's apt-upgrade task path
      ansible.builtin.import_role:
        name: common
        tasks_from: upgrade.yml

- name: Manual apt upgrade for dev VM (opt-in, never as part of common run)
  hosts: dev_hosts
  become: true
  tags:
    - dev-vm-upgrade
    - never
  tasks:
    - name: Run the common role's apt-upgrade task path (dist mode)
      ansible.builtin.import_role:
        name: common
        tasks_from: upgrade.yml
      vars:
        common_upgrade_type: dist  # dev box tolerates dependency-driven removals
