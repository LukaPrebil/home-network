---
# Main playbook for homelab infrastructure
# This playbook applies roles to all managed hosts

- name: Configure all Linux servers with common settings
  hosts: linux_servers
  become: true
  vars_files:
    - secrets.yml
  roles:
    - common

- name: Configure Proxmox hosts
  hosts: proxmox_hosts
  become: true
  vars_files:
    - secrets.yml
  roles:
    - proxmox

- name: Deploy Node Exporter for metrics collection
  hosts: monitoring_agents
  become: true
  vars_files:
    - secrets.yml
  roles:
    - node-exporter

- name: Deploy Grafana Alloy for metrics and log shipping
  hosts: monitoring_agents
  become: true
  vars_files:
    - secrets.yml
  roles:
    - alloy

- name: Deploy Autoheal container health monitor
  hosts: docker_hosts
  become: true
  roles:
    - docker
    - autoheal

- name: Deploy monitoring stack
  hosts: monitoring_hosts
  become: true
  vars_files:
    - secrets.yml
  roles:
    - docker
    - monitoring-stack

- name: Deploy Plex Media Server
  hosts: plex_hosts
  become: true
  vars_files:
    - secrets.yml
  roles:
    - docker
    - plex
    - jellyfin

- name: Deploy Arr Stack (Sonarr, Radarr, Prowlarr, etc.)
  hosts: arr_stack_hosts
  become: true
  vars_files:
    - secrets.yml
  roles:
    - docker
    - arr-stack
