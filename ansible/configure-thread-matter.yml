---
# Playbook to deploy Thread Matter Stack (Split Architecture)
#
# This playbook deploys:
#   - OpenThread Border Router (OTBR) on containers VM - Thread network coordinator
#   - Python Matter Server on rpi4 - Matter device controller for Home Assistant
#
# Architecture: OTBR and Matter Server are deployed on separate hosts to avoid
# mDNS port 5353 conflicts. Matter Server connects to OTBR over the network.
#
# Prerequisites:
#   - containers VM is configured with common and docker roles
#   - rpi4 is configured with common and docker roles
#   - USB device (Sonoff ZB-Dongle-E) is passed through from Proxmox to containers VM
#   - NFS mount at /srv/docker is available on both hosts
#
# Usage:
#   # Standard deployment (deploys both services):
#   ansible-playbook configure-thread-matter.yml --ask-vault-pass
#
#   # Only deploy OTBR:
#   ansible-playbook configure-thread-matter.yml --tags otbr
#
#   # Only deploy Matter Server:
#   ansible-playbook configure-thread-matter.yml --tags matter-server

- name: Deploy OpenThread Border Router (OTBR)
  hosts: containers
  become: true
  vars_files:
    - secrets.yml
  tags:
    - otbr

  pre_tasks:
    - name: Verify NFS mount is available
      ansible.builtin.command: mountpoint -q /srv/docker
      register: nfs_check
      failed_when: nfs_check.rc != 0
      changed_when: false

    - name: Display OTBR deployment information
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "Deploying OpenThread Border Router (OTBR)"
          - "=============================================="
          - ""
          - "Target Host: {{ inventory_hostname }}"
          - "IP Address: {{ ansible_host }}"
          - "USB Device: {{ thread_usb_device }}"
          - ""
          - "Thread Network Configuration:"
          - "  - Channel: {{ thread_channel }}"
          - "  - Network Name: {{ thread_network_name }}"
          - "  - PAN ID: {{ thread_panid }}"
          - ""
          - "Starting deployment..."
          - "=============================================="

  roles:
    - docker
    - otbr

  post_tasks:
    - name: Display OTBR access information
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "OTBR Deployment Complete!"
          - "=============================================="
          - ""
          - "Access Points:"
          - "  - Web UI: http://{{ ansible_host }}:8086"
          - "  - REST API: http://{{ ansible_host }}:8081"
          - ""
          - "Next: Deploying Matter Server on rpi4..."
          - "=============================================="

- name: Deploy Python Matter Server
  hosts: rpi4
  become: true
  vars_files:
    - secrets.yml
  tags:
    - matter-server

  pre_tasks:
    - name: Display Matter Server deployment information
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "Deploying Python Matter Server"
          - "=============================================="
          - ""
          - "Target Host: {{ inventory_hostname }}"
          - "IP Address: {{ ansible_host }}"
          - "Matter Server Port: {{ matter_server_port | default(5580) }}"
          - ""
          - "OTBR Location:"
          - "  - Host: {{ otbr_host | default('192.168.1.140') }}"
          - "  - REST API: {{ otbr_rest_api_port | default(8081) }}"
          - ""
          - "Starting deployment..."
          - "=============================================="

  roles:
    - docker
    - matter-server

- name: Display final instructions
  hosts: localhost
  gather_facts: false
  tags:
    - always

  tasks:
    - name: Display post-deployment summary
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "Thread Matter Stack Deployment Complete!"
          - "=============================================="
          - ""
          - "Services Deployed:"
          - "  - OTBR on containers VM (192.168.1.140)"
          - "  - Matter Server on rpi4 (192.168.1.110)"
          - ""
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "CRITICAL: Update Home Assistant Configuration"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - ""
          - "The Matter Server has moved to a new host."
          - "You MUST update Home Assistant:"
          - ""
          - "1. Open Home Assistant"
          - "   → http://192.168.1.144:8123"
          - ""
          - "2. Go to Settings → Devices & Services"
          - ""
          - "3. Find 'Matter (BETA)' integration"
          - ""
          - "4. Click 3-dot menu (⋮) → Configure"
          - ""
          - "5. Update Server URL from:"
          - "   OLD: ws://192.168.1.140:5580/ws"
          - "   NEW: ws://192.168.1.110:5580/ws"
          - ""
          - "6. Submit and verify connection"
          - ""
          - "7. Check all Matter devices are visible"
          - ""
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - ""
          - "Verification Commands:"
          - "  # Check OTBR:"
          - "  curl http://192.168.1.140:8081/node/state"
          - ""
          - "  # Check Matter Server:"
          - "  nc -zv 192.168.1.110 5580"
          - ""
          - "  # Check for port conflicts:"
          - "  ssh ubuntu@192.168.1.140 'sudo ss -tulpn | grep 5353'"
          - "  ssh luka@192.168.1.110 'sudo ss -tulpn | grep 5353'"
          - ""
          - "=============================================="
