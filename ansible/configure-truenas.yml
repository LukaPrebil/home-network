---
# Playbook to configure TrueNAS using midclt (middleware client)
# This uses the TrueNAS JSON-RPC API via midclt commands over SSH

- name: Configure ZFS Storage Pool using midclt
  hosts: tn-storage
  vars_files:
    - secrets.yml
  tasks:
    - name: Get disk device names for NVMe drives
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          midclt call disk.query | jq -r '.[] | select(.name | startswith("nvme")) | .devname'
        executable: /bin/bash
      register: nvme_devnames
      changed_when: false

    - name: Display NVMe disk device names
      ansible.builtin.debug:
        msg: "NVMe disk device names: {{ nvme_devnames.stdout_lines }}"

    - name: Check if pool already exists
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          midclt call pool.query | jq -r '.[].name'
        executable: /bin/bash
      register: existing_pools
      changed_when: false

    - name: Create ZFS pool via midclt
      ansible.builtin.shell:
        cmd: |
          midclt call -j pool.create '{
            "name": "{{ zfs_pool_name }}",
            "encryption": false,
            "topology": {
              "data": [{
                "type": "{{ zfs_pool_type | upper }}",
                "disks": {{ nvme_devnames.stdout_lines | to_json }}
              }]
            }
          }'
      register: pool_create_job
      when: zfs_pool_name not in existing_pools.stdout_lines
      changed_when: pool_create_job.rc == 0

    - name: Display pool creation result
      ansible.builtin.debug:
        msg: "Pool '{{ zfs_pool_name }}' {{ 'created successfully' if pool_create_job is changed else 'already exists' }}"

    - name: Verify pool was created
      ansible.builtin.command:
        cmd: /usr/sbin/zpool status {{ zfs_pool_name }}
      register: pool_status
      changed_when: false

    - name: Display pool status
      ansible.builtin.debug:
        msg: "{{ pool_status.stdout_lines }}"

- name: Configure ZFS Datasets
  hosts: tn-storage
  vars_files:
    - secrets.yml
  tasks:
    - name: Get existing datasets
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          midclt call pool.dataset.query | jq -r '.[].name'
        executable: /bin/bash
      register: existing_datasets
      changed_when: false

    - name: Create ZFS datasets
      ansible.builtin.shell:
        cmd: |
          midclt call pool.dataset.create '{
            "name": "{{ item.name }}",
            "type": "FILESYSTEM",
            "compression": "{{ item.compression | upper }}",
            {% if item.quota != 'none' %}
            "quota": {{ (item.quota | regex_replace('G', '') | int * 1024 * 1024 * 1024) }},
            {% endif %}
            {% if item.recordsize is defined %}
            "recordsize": "{{ item.recordsize }}",
            {% endif %}
            {% if item.encryption | default(false) %}
            "encryption": true,
            "inherit_encryption": false,
            "encryption_options": {"generate_key": true},
            {% endif %}
            "comments": "{{ item.description }}"
          }'
      loop: "{{ zfs_datasets }}"
      when: item.name not in existing_datasets.stdout_lines
      register: datasets_created
      changed_when: datasets_created.rc | default(0) == 0

    - name: Display created datasets
      ansible.builtin.debug:
        msg: "Dataset '{{ item.item.name }}' {{ 'created' if item is changed else 'already exists' }}"
      loop: "{{ datasets_created.results }}"
      when: datasets_created.results is defined

    - name: List all datasets
      ansible.builtin.command:
        cmd: /usr/sbin/zfs list
      register: zfs_list
      changed_when: false

    - name: Display ZFS datasets
      ansible.builtin.debug:
        msg: "{{ zfs_list.stdout_lines }}"

- name: Configure NFS Shares
  hosts: tn-storage
  vars_files:
    - secrets.yml
  tasks:
    - name: Query NFS service enable/running state
      # jq emits exactly two tokens (enable, state) even if the service is
      # missing from the query, so the split()-based when conditions below
      # never index into an empty list.
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          midclt call service.query | jq -r '[.[] | select(.service == "nfs")][0] | "\(.enable // false) \(.state // "UNKNOWN")"'
        executable: /bin/bash
      register: nfs_service_state
      changed_when: false

    - name: Enable NFS service
      ansible.builtin.shell:
        cmd: 'midclt call service.update nfs ''{"enable": true}'''
      register: nfs_enabled
      when: nfs_service_state.stdout.split() | first != 'true'
      changed_when: nfs_enabled.rc == 0

    - name: Start NFS service
      ansible.builtin.command:
        cmd: midclt call service.start nfs
      register: nfs_started
      when: nfs_service_state.stdout.split() | last != 'RUNNING'
      changed_when: nfs_started.rc == 0

    - name: Get existing NFS shares
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          midclt call sharing.nfs.query | jq -r '.[].path'
        executable: /bin/bash
      register: existing_nfs_shares
      changed_when: false

    - name: Create NFS shares
      ansible.builtin.shell:
        cmd: |
          midclt call sharing.nfs.create '{
            "path": "{{ item.path }}",
            "comment": "{{ item.comment | default(item.name) }}",
            "networks": {{ item.allowed_networks | to_json }},
            "ro": {{ item.ro | default(false) | to_json }},
            "maproot_user": {{ item.maproot_user | default(none) | to_json }},
            "maproot_group": {{ item.maproot_group | default(none) | to_json }},
            "mapall_user": {{ item.mapall_user | default(none) | to_json }},
            "mapall_group": {{ item.mapall_group | default(none) | to_json }}
          }'
      loop: "{{ nfs_shares }}"
      when: item.path not in existing_nfs_shares.stdout_lines
      register: nfs_shares_created
      changed_when: nfs_shares_created.rc | default(0) == 0

    - name: Display NFS configuration status
      ansible.builtin.debug:
        msg: "NFS service enabled and {{ nfs_shares_created.results | selectattr('changed', 'equalto', true) | list | length }} shares created"

- name: Configure iSCSI targets for block storage
  hosts: tn-storage
  vars_files:
    - secrets.yml
  tasks:
    - name: Skip iSCSI configuration if no zvols defined
      ansible.builtin.meta: end_play
      when: iscsi_zvols is not defined or iscsi_zvols | length == 0

    - name: Query iSCSI service enable/running state
      # jq emits exactly two tokens (enable, state) even if the service is
      # missing from the query, so the split()-based when conditions below
      # never index into an empty list.
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          midclt call service.query | jq -r '[.[] | select(.service == "iscsitarget")][0] | "\(.enable // false) \(.state // "UNKNOWN")"'
        executable: /bin/bash
      register: iscsi_service_state
      changed_when: false

    - name: Enable iSCSI service
      ansible.builtin.shell:
        cmd: 'midclt call service.update iscsitarget ''{"enable": true}'''
      register: iscsi_enabled
      when: iscsi_service_state.stdout.split() | first != 'true'
      changed_when: iscsi_enabled.rc == 0

    - name: Start iSCSI service
      ansible.builtin.command:
        cmd: midclt call service.start iscsitarget
      register: iscsi_started
      when: iscsi_service_state.stdout.split() | last != 'RUNNING'
      changed_when: iscsi_started.rc == 0

    - name: Get existing datasets and zvols
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          midclt call pool.dataset.query | jq -r '.[].name'
        executable: /bin/bash
      register: existing_datasets
      changed_when: false

    - name: Create ZFS zvols for iSCSI
      ansible.builtin.shell:
        cmd: |
          midclt call pool.dataset.create '{
            "name": "{{ item.name }}",
            "type": "VOLUME",
            "volsize": {{ item.volsize }},
            "compression": "{{ item.compression | upper }}",
            "comments": "{{ item.description }}"
          }'
      loop: "{{ iscsi_zvols }}"
      when: item.name not in existing_datasets.stdout_lines
      register: zvols_created
      changed_when: zvols_created.rc | default(0) == 0

    - name: Display zvol creation results
      ansible.builtin.debug:
        msg: "zvol '{{ item.item.name }}' {{ 'created' if item is changed else 'already exists' }}"
      loop: "{{ zvols_created.results }}"
      when: zvols_created.results is defined

    - name: Check existing iSCSI portals
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          midclt call iscsi.portal.query | jq -r '.[].id'
        executable: /bin/bash
      register: existing_portals
      changed_when: false

    - name: Create iSCSI portal (listen on all interfaces)
      ansible.builtin.shell:
        cmd: |
          midclt call iscsi.portal.create '{
            "listen": [{"ip": "0.0.0.0"}],
            "comment": "Default iSCSI portal"
          }'
      register: portal_created
      when: existing_portals.stdout_lines | length == 0
      changed_when: portal_created.rc | default(0) == 0

    - name: Get iSCSI portal ID
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          midclt call iscsi.portal.query | jq -r '.[0].id'
        executable: /bin/bash
      register: portal_id
      changed_when: false

    - name: Get existing iSCSI targets
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          midclt call iscsi.target.query | jq -r '.[].name'
        executable: /bin/bash
      register: existing_targets
      changed_when: false

    - name: Get existing iSCSI initiator group comments
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          midclt call iscsi.initiator.query | jq -r '.[].comment'
        executable: /bin/bash
      register: existing_initiator_groups
      changed_when: false

    - name: Create missing iSCSI initiator groups
      # Gated on the group's own existence (not the target's): a run that
      # created the group but died before target creation must not create
      # a duplicate group on rerun.
      ansible.builtin.shell:
        cmd: |
          midclt call iscsi.initiator.create '{
            "initiators": {{ item.allowed_initiators | to_json }},
            "comment": "{{ item.target_name }} initiators"
          }'
      loop: "{{ iscsi_zvols }}"
      when: (item.target_name ~ ' initiators') not in existing_initiator_groups.stdout_lines
      changed_when: true

    - name: Get all initiator group IDs by comment
      # first(.id) keeps the lookup deterministic (a single id) even if
      # duplicate groups exist from runs predating the gating fix above.
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          midclt call iscsi.initiator.query | jq -r '[.[] | select(.comment == "{{ item.target_name }} initiators") | .id] | first'
        executable: /bin/bash
      loop: "{{ iscsi_zvols }}"
      register: initiator_ids_by_name
      changed_when: false

    - name: Create iSCSI targets
      ansible.builtin.shell:
        cmd: |
          midclt call iscsi.target.create '{
            "name": "{{ item.target_name }}",
            "groups": [{"portal": {{ portal_id.stdout }}, "initiator": {{ initiator_ids_by_name.results[idx].stdout }}}]
          }'
      loop: "{{ iscsi_zvols }}"
      loop_control:
        index_var: idx
      when: item.target_name not in existing_targets.stdout_lines
      changed_when: true

    - name: Get existing iSCSI extents
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          midclt call iscsi.extent.query | jq -r '.[].name'
        executable: /bin/bash
      register: existing_extents
      changed_when: false

    - name: Create iSCSI extents
      ansible.builtin.shell:
        cmd: |
          midclt call iscsi.extent.create '{
            "name": "{{ item.target_name }}",
            "type": "DISK",
            "disk": "zvol/{{ item.name }}",
            "comment": "{{ item.description }}"
          }'
      loop: "{{ iscsi_zvols }}"
      when: item.target_name not in existing_extents.stdout_lines
      register: extents_created
      changed_when: extents_created.rc | default(0) == 0

    - name: Get existing target-extent associations
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          midclt call iscsi.targetextent.query | jq -r '.[].target'
        executable: /bin/bash
      register: existing_associations
      changed_when: false

    - name: Get target IDs for association
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          midclt call iscsi.target.query | jq -r '.[] | select(.name == "{{ item.target_name }}") | .id'
        executable: /bin/bash
      loop: "{{ iscsi_zvols }}"
      register: target_ids
      changed_when: false

    - name: Get extent IDs for association
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          midclt call iscsi.extent.query | jq -r '.[] | select(.name == "{{ item.target_name }}") | .id'
        executable: /bin/bash
      loop: "{{ iscsi_zvols }}"
      register: extent_ids
      changed_when: false

    - name: Create target-extent associations
      ansible.builtin.shell:
        cmd: |
          midclt call iscsi.targetextent.create '{
            "target": {{ target_ids.results[idx].stdout }},
            "extent": {{ extent_ids.results[idx].stdout }},
            "lunid": 0
          }'
      loop: "{{ iscsi_zvols }}"
      loop_control:
        index_var: idx
      when: target_ids.results[idx].stdout not in existing_associations.stdout_lines
      register: associations_created
      changed_when: associations_created.rc | default(0) == 0

    - name: Display iSCSI configuration status
      ansible.builtin.debug:
        msg:
          - "iSCSI service enabled"
          - "Configured targets: {{ iscsi_zvols | map(attribute='target_name') | list }}"
          - "Portal ID: {{ portal_id.stdout }}"

- name: Ensure TrueNAS guest kernel cmdline tunables (virtio-net mitigations)
  # Why: TrueNAS Scale 25.04 + single-queue virtio_net + napi_tx=Y is
  # vulnerable to an upstream "host stalls waiting for kick" race that
  # wedges the VM's NIC under sustained TX load. Disabling napi_tx in
  # the guest closes the race window. See
  # docs/infrastructure/truenas-virtio-tuning.md for the full story.
  #
  # This play stages the change in TrueNAS's config DB. The reboot is
  # performed by provision-truenas.yml when its qm-config reconciler
  # detects drift; on a normally-converged stack a manual reboot is
  # also fine.
  hosts: tn-storage
  vars_files:
    - secrets.yml
  vars:
    truenas_kernel_extra_required:
      - virtio_net.napi_tx=0
  tasks:
    - name: Read current kernel_extra_options
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          midclt call system.advanced.config | jq -r '.kernel_extra_options // ""'
        executable: /bin/bash
      register: truenas_kernel_extra_current
      changed_when: false
      check_mode: false  # read-only probe; always run, even in --check

    - name: Compute desired kernel_extra_options as the union of current + required
      # Set-based logic so this is order-insensitive: any pre-existing
      # options stay, any required options are added. Drift is computed
      # from set membership, not string equality, so a future re-render
      # by midclt that reorders or whitespace-normalises won't trip the
      # play into a no-op apply.
      ansible.builtin.set_fact:
        truenas_kernel_extra_current_set: "{{ (truenas_kernel_extra_current.stdout | default('') | trim).split() }}"
        truenas_kernel_extra_desired_set: "{{ (truenas_kernel_extra_current.stdout | default('') | trim).split() | union(truenas_kernel_extra_required) }}"

    - name: Render desired kernel_extra_options string (sorted for stability)
      ansible.builtin.set_fact:
        truenas_kernel_extra_desired: "{{ truenas_kernel_extra_desired_set | sort | join(' ') }}"

    - name: Detect cmdline drift (missing required options)
      ansible.builtin.set_fact:
        truenas_kernel_extra_drift: "{{ truenas_kernel_extra_required | reject('in', truenas_kernel_extra_current_set) | list | length > 0 }}"

    - name: Apply kernel_extra_options if drifted
      ansible.builtin.shell:
        cmd: |
          midclt call system.advanced.update '{
            "kernel_extra_options": "{{ truenas_kernel_extra_desired }}"
          }'
        executable: /bin/bash
      register: truenas_kernel_extra_apply
      # The cmdline change is staged in TrueNAS's config DB and takes
      # effect on next TrueNAS VM reboot. provision-truenas.yml reboots
      # the VM iff its drift detector trips (qm config, runtime queues,
      # or pending cmdline). If you only changed cmdline, reboot during
      # a maintenance window with:
      #   ansible-playbook provision-truenas.yml -e truenas_allow_reboot=true
      # See docs/infrastructure/truenas-virtio-tuning.md.
      when: truenas_kernel_extra_drift
      changed_when: truenas_kernel_extra_apply.rc == 0

- name: Add TrueNAS storage to Proxmox
  hosts: n5p
  become: true
  vars_files:
    - secrets.yml
  tasks:
    - name: Check existing Proxmox storage
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pvesm status | awk '{print $1}'
        executable: /bin/bash
      register: existing_storage
      changed_when: false

    - name: Add NFS storage for VM disks
      ansible.builtin.shell:
        cmd: >
          pvesm add nfs truenas-vms
          --server {{ hostvars['tn-storage'].ansible_host }}
          --export /mnt/tank/proxmox-vms
          --content images,rootdir
      when: "'truenas-vms' not in existing_storage.stdout"
      register: storage_vms_added
      changed_when: storage_vms_added.rc | default(0) == 0

    - name: Add NFS storage for templates
      ansible.builtin.shell:
        cmd: >
          pvesm add nfs truenas-templates
          --server {{ hostvars['tn-storage'].ansible_host }}
          --export /mnt/tank/proxmox-templates
          --content iso,vztmpl
      when: "'truenas-templates' not in existing_storage.stdout"
      register: storage_templates_added
      changed_when: storage_templates_added.rc | default(0) == 0

    # Encrypted dataset backing the mattermost LXC rootfs (Postgres + uploads
    # protected at rest). Separate storage so only this LXC lands on encrypted
    # ZFS, not the shared truenas-vms.
    - name: Add encrypted NFS storage for the Mattermost LXC disk
      ansible.builtin.shell:
        cmd: >
          pvesm add nfs truenas-vms-enc
          --server {{ hostvars['tn-storage'].ansible_host }}
          --export /mnt/tank/mattermost-vm
          --content images,rootdir
      when: "'truenas-vms-enc' not in existing_storage.stdout"
      register: storage_vms_enc_added
      changed_when: storage_vms_enc_added.rc | default(0) == 0

    - name: Verify Proxmox storage configuration
      ansible.builtin.command:
        cmd: pvesm status
      register: storage_status
      changed_when: false

    - name: Display storage configuration complete
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "TrueNAS storage configured successfully!"
          - "=============================================="
          - ""
          - "ZFS Pool: {{ hostvars['tn-storage'].zfs_pool_name }}"
          - "Storage available in Proxmox:"
          - "{{ storage_status.stdout_lines }}"
          - ""
          - "Access TrueNAS: http://{{ hostvars['tn-storage'].ansible_host }}"
          - "=============================================="
