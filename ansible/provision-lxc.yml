---
# Provision Proxmox LXC containers from declarative configuration
# This playbook creates LXC containers based on definitions in vars/lxc.yml
#
# Usage:
#   ansible-playbook provision-lxc.yml
#
# Features:
#   - Idempotent: skips existing containers
#   - Downloads LXC templates if not present
#   - Configures networking (with optional VLAN tags)
#   - Supports GPU passthrough for AMD iGPU
#   - Sets up nested containers (Docker support)

- name: Download LXC templates if needed
  hosts: proxmox_hosts
  gather_facts: false
  become: true
  vars_files:
    - vars/lxc.yml

  tasks:
    - name: Check if the Ubuntu LXC template exists
      ansible.builtin.stat:
        path: "/var/lib/vz/template/cache/{{ lxc_template_ubuntu }}"
      register: lxc_template_check

    - name: Download the Ubuntu Proxmox LXC template
      ansible.builtin.get_url:
        url: "{{ lxc_template_url }}"
        dest: "/var/lib/vz/template/cache/{{ lxc_template_ubuntu }}"
        mode: '0644'
      when: not lxc_template_check.stat.exists

- name: Check existing LXC containers and provision new ones
  hosts: proxmox_hosts
  gather_facts: true
  # pct/pvesm probes shell out as the non-root ansible_user, whose PATH
  # excludes /usr/sbin; without play-level become the read tasks hit
  # "pct: command not found". The mutating tasks below already escalate.
  become: true
  vars_files:
    - vars/lxc.yml
    - group_vars/all/main.yml

  tasks:
    - name: Get list of existing containers
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pct list | awk 'NR>1 {print $1}'
        executable: /bin/bash
      register: existing_containers
      changed_when: false

    - name: Create map of existing container VMIDs
      ansible.builtin.set_fact:
        existing_vmids: "{{ existing_containers.stdout_lines | map('int') | list }}"

    # Optional scoping: pass -e lxc_provision_only=<name> (comma-separated
    # for several) to create only those containers. Without it, behavior is
    # unchanged - every declared-but-absent container is created. This exists so
    # adding one new container does not also create others that are declared but
    # intentionally not yet provisioned (e.g. hermes).
    - name: Filter containers that need to be created
      ansible.builtin.set_fact:
        containers_to_create: >-
          {{ _absent if _only | length == 0
             else _absent | selectattr('name', 'in', _only) | list }}
      vars:
        _absent: "{{ lxc_containers | rejectattr('vmid', 'in', existing_vmids | default([])) | list }}"
        _only: "{{ (lxc_provision_only | default('')).split(',') | map('trim') | select | list }}"

    - name: Display containers to be created
      ansible.builtin.debug:
        msg: "Will create {{ containers_to_create | length }} container(s): {{ containers_to_create | map(attribute='name') | join(', ') }}"

    - name: Display skipped containers
      ansible.builtin.debug:
        msg: "Skipping existing container: {{ item.name }} (VMID {{ item.vmid }})"
      loop: "{{ lxc_containers }}"
      when: item.vmid in (existing_vmids | default([]))

    - name: Create LXC containers
      community.proxmox.proxmox:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_password: "{{ vault_proxmox_api_password }}"
        node: "{{ item.node }}"
        vmid: "{{ item.vmid }}"
        hostname: "{{ item.name }}"
        ostemplate: "{{ item.ostemplate }}"
        password: "{{ vault_lxc_root_password }}"
        pubkey: "{{ vault_ansible_ssh_public_key }}"
        cores: "{{ item.cores | default(lxc_defaults.cores) }}"
        memory: "{{ item.memory | default(lxc_defaults.memory) }}"
        swap: "{{ item.swap | default(lxc_defaults.swap) }}"
        disk: "{{ item.storage | default(lxc_defaults.storage) }}:{{ item.disk | default(lxc_defaults.disk) }}"
        netif: "{{ _netif }}"
        nameserver: "{{ dns_servers | join(' ') }}"
        searchdomain: "{{ domain }}"
        onboot: "{{ item.onboot | default(lxc_defaults.onboot) }}"
        unprivileged: "{{ item.unprivileged | default(lxc_defaults.unprivileged) }}"
        features: "{{ item.features | default([]) }}"
        description: "{{ item.description | default('') }}"
        timeout: 180
        state: present
      loop: "{{ containers_to_create }}"
      vars:
        _netif: >-
          {%- if item.vlan_id is not none -%}
          {{ {'net0': 'name=eth0,bridge=' + (item.network_bridge | default(lxc_defaults.network_bridge)) + ',ip=' + item.ip + '/' + (item.netmask | string) + ',gw=' + item.gateway + ',tag=' + (item.vlan_id | string) + ',firewall=1'} }}{%- else -%}
          {{ {'net0': 'name=eth0,bridge=' + (item.network_bridge | default(lxc_defaults.network_bridge)) + ',ip=' + item.ip + '/' + (item.netmask | string) + ',gw=' + item.gateway + ',firewall=1'} }}{%- endif -%}
      register: container_creation

    - name: Wait for containers to be created
      ansible.builtin.pause:
        seconds: 5
      when: containers_to_create | length > 0

    - name: Set startup order for LXC containers
      ansible.builtin.command:
        cmd: pct set {{ item.vmid }} --startup {{ item.startup }}
      loop: "{{ containers_to_create }}"
      when:
        - containers_to_create | length > 0
        - item.startup is defined
      become: true
      changed_when: true

    - name: Start LXC containers
      community.proxmox.proxmox:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_password: "{{ vault_proxmox_api_password }}"
        vmid: "{{ item.vmid }}"
        # hostname is cosmetic for state=started (lookup is by vmid), but the
        # module does `hostname or lxc["name"]` and the cluster-resources entry
        # for a just-created container has no name key until it has run once.
        # Passing it short-circuits that lookup; without it the first start
        # after creation dies with "An error occurred: 'name'".
        hostname: "{{ item.name }}"
        state: started
      loop: "{{ containers_to_create }}"
      when: containers_to_create | length > 0

    - name: Pin host keys for newly created containers
      # A fresh container answers its IP with a fresh host key; without this,
      # the first converge after provision would fail on a changed key (or
      # TOFU-pin mid-converge). Refresh the pin now, control-node side.
      ansible.builtin.include_tasks: refresh-pinned-host-key.yml
      vars:
        pinned_host: "{{ pinned_host_entry.name }}"
      loop: "{{ containers_to_create }}"
      loop_control:
        loop_var: pinned_host_entry
        label: "{{ pinned_host_entry.name }} ({{ hostvars[pinned_host_entry.name].ansible_host }})"

    - name: Configure GPU passthrough for containers (if enabled)
      ansible.builtin.shell:
        cmd: |
          pct set {{ item.vmid }} -dev0 /dev/dri/card0,gid=44 -dev1 /dev/dri/renderD128,gid=993 -dev2 /dev/kfd,gid=993
      loop: "{{ containers_to_create }}"
      when:
        - containers_to_create | length > 0
        - item.gpu_passthrough | default(false)
      become: true
      changed_when: true

    - name: Add lxcfs loadavg bind-mount to newly created LXCs
      ansible.builtin.lineinfile:
        path: "/etc/pve/lxc/{{ item.vmid }}.conf"
        regexp: '^lxc\.mount\.entry:\s*/var/lib/lxcfs/proc/loadavg\s+'
        line: "lxc.mount.entry: /var/lib/lxcfs/proc/loadavg proc/loadavg none bind,create=file 0 0"
        state: present
      loop: "{{ containers_to_create }}"
      loop_control:
        label: "{{ item.name }} (vmid {{ item.vmid }})"
      when: containers_to_create | length > 0
      become: true

    # Host-mount reconciliation is driven by ALL declared containers, not just
    # containers_to_create - the host NFS mounts must re-apply their hardened opts
    # (x-systemd.automount, retry) on every converge, not only at first creation.
    # An NFS blip that drops a non-automount mount otherwise never gets repaired
    # and binds an empty stub into the LXC (the 2026-06-12 outage). The pct-set
    # bind-into-container tasks below stay gated on containers_to_create - those
    # binds are a one-time, container-stopped operation.
    - name: Check if any declared containers need NFS Docker volumes
      ansible.builtin.set_fact:
        need_nfs_mount: "{{ lxc_containers | selectattr('nfs_docker_volumes', 'defined') | selectattr('nfs_docker_volumes', 'equalto', true) | list | length > 0 }}"
      tags: nfs-host-mounts

    - name: Ensure NFS mount point exists on Proxmox host for Docker volumes
      ansible.builtin.file:
        path: /mnt/pve/truenas-docker
        state: directory
        mode: '0755'
      become: true
      when: need_nfs_mount | default(false)
      tags: nfs-host-mounts

    - name: Mount TrueNAS Docker volumes NFS share on Proxmox host
      ansible.posix.mount:
        path: /mnt/pve/truenas-docker
        src: "{{ truenas_nfs_server }}:{{ truenas_docker_volumes_share }}"
        fstype: nfs
        opts: "{{ nfs_common_opts }}"
        state: mounted
      become: true
      when: need_nfs_mount | default(false)
      tags: nfs-host-mounts

    - name: Configure bind mount for Docker volumes in containers
      ansible.builtin.shell:
        cmd: |
          pct set {{ item.vmid }} -mp0 /mnt/pve/truenas-docker,mp=/srv/docker
      loop: "{{ containers_to_create }}"
      when:
        - containers_to_create | length > 0
        - item.nfs_docker_volumes | default(false)
      become: true
      changed_when: true

    - name: Check if any declared containers need the Immich NFS mounts
      ansible.builtin.set_fact:
        need_immich_photos_mount: "{{ lxc_containers | selectattr('nfs_immich_photos', 'defined') | selectattr('nfs_immich_photos', 'equalto', true) | list | length > 0 }}"
        need_external_data_mount: "{{ lxc_containers | selectattr('nfs_external_data', 'defined') | selectattr('nfs_external_data', 'equalto', true) | list | length > 0 }}"
      tags: nfs-host-mounts

    - name: Ensure NFS mount point exists on Proxmox host for Immich photos
      ansible.builtin.file:
        path: /mnt/pve/truenas-immich-photos
        state: directory
        mode: '0755'
      become: true
      when: need_immich_photos_mount | default(false)
      tags: nfs-host-mounts

    - name: Mount TrueNAS Immich photos NFS share on Proxmox host
      ansible.posix.mount:
        path: /mnt/pve/truenas-immich-photos
        src: "{{ truenas_nfs_server }}:{{ truenas_immich_photos_share }}"
        fstype: nfs
        opts: "{{ nfs_common_opts }}"
        state: mounted
      become: true
      when: need_immich_photos_mount | default(false)
      tags: nfs-host-mounts

    # 0770 rather than the 0755 used by the mount points above, because this path
    # is normally an active NFS mount and the external-data dataset root is 0770.
    # Declaring 0755 here would chmod the TrueNAS dataset instead of a local
    # directory. Once mounted the local mode is covered by the mount anyway.
    - name: Ensure NFS mount point exists on Proxmox host for external data
      ansible.builtin.file:
        path: /mnt/pve/truenas-external-data
        state: directory
        mode: '0770'
      become: true
      when: need_external_data_mount | default(false)
      tags: nfs-host-mounts

    - name: Mount TrueNAS external data NFS share on Proxmox host
      ansible.posix.mount:
        path: /mnt/pve/truenas-external-data
        src: "{{ truenas_nfs_server }}:{{ truenas_external_data_share }}"
        fstype: nfs
        opts: "{{ nfs_common_opts }}"
        state: mounted
      become: true
      when: need_external_data_mount | default(false)
      tags: nfs-host-mounts

    - name: Configure bind mount for Immich photos in containers
      ansible.builtin.shell:
        cmd: |
          pct set {{ item.vmid }} -mp1 /mnt/pve/truenas-immich-photos,mp=/mnt/immich-photos
      loop: "{{ containers_to_create }}"
      when:
        - containers_to_create | length > 0
        - item.nfs_immich_photos | default(false)
      become: true
      changed_when: true

    - name: Configure bind mount for external data in containers
      ansible.builtin.shell:
        cmd: |
          pct set {{ item.vmid }} -mp2 /mnt/pve/truenas-external-data,mp=/mnt/external-data
      loop: "{{ containers_to_create }}"
      when:
        - containers_to_create | length > 0
        - item.nfs_external_data | default(false)
      become: true
      changed_when: true

    - name: Check if any declared containers need Plex NFS mounts
      ansible.builtin.set_fact:
        need_plex_apps_mount: "{{ lxc_containers | selectattr('nfs_plex_apps', 'defined') | selectattr('nfs_plex_apps', 'equalto', true) | list | length > 0 }}"
        need_plex_bulk_mount: "{{ lxc_containers | selectattr('nfs_plex_bulk', 'defined') | selectattr('nfs_plex_bulk', 'equalto', true) | list | length > 0 }}"
      tags: nfs-host-mounts

    - name: Ensure NFS mount point exists on Proxmox host for plex-apps
      ansible.builtin.file:
        path: /mnt/pve/plex-apps
        state: directory
        mode: '0755'
      become: true
      when: need_plex_apps_mount | default(false)
      tags: nfs-host-mounts

    - name: Mount TrueNAS plex-apps NFS share on Proxmox host
      ansible.posix.mount:
        path: /mnt/pve/plex-apps
        src: "{{ truenas_nfs_server }}:{{ truenas_plex_apps_share }}"
        fstype: nfs
        opts: "{{ nfs_common_opts }}"
        state: mounted
      become: true
      when: need_plex_apps_mount | default(false)
      tags: nfs-host-mounts

    - name: Ensure NFS mount point exists on Proxmox host for plex-bulk
      ansible.builtin.file:
        path: /mnt/pve/plex-bulk
        state: directory
        mode: '0755'
      become: true
      when: need_plex_bulk_mount | default(false)
      tags: nfs-host-mounts

    - name: Mount TrueNAS plex-bulk NFS share on Proxmox host
      ansible.posix.mount:
        path: /mnt/pve/plex-bulk
        src: "{{ truenas_nfs_server }}:{{ truenas_plex_bulk_share }}"
        fstype: nfs
        opts: "{{ nfs_common_opts }}"
        state: mounted
      become: true
      when: need_plex_bulk_mount | default(false)
      tags: nfs-host-mounts

    - name: Configure bind mount for plex-apps in containers
      ansible.builtin.shell:
        cmd: |
          pct set {{ item.vmid }} -mp0 /mnt/pve/plex-apps,mp=/mnt/plex-apps
      loop: "{{ containers_to_create }}"
      when:
        - containers_to_create | length > 0
        - item.nfs_plex_apps | default(false)
      become: true
      changed_when: true

    - name: Configure bind mount for plex-bulk in containers
      ansible.builtin.shell:
        cmd: |
          pct set {{ item.vmid }} -mp1 /mnt/pve/plex-bulk,mp=/mnt/plex-bulk
      loop: "{{ containers_to_create }}"
      when:
        - containers_to_create | length > 0
        - item.nfs_plex_bulk | default(false)
      become: true
      changed_when: true

- name: Reconcile memory caps on existing LXC containers
  # The create-step above only applies `memory:` at first provision.
  # Editing memory in vars/lxc.yml does not retroactively change
  # the running container's cgroup cap. This play closes that drift
  # idempotently for every container declared in lxc_containers.
  #
  # Cores/swap/disk are intentionally NOT reconciled here - each has
  # its own gotchas (cores: hot-add fine, disk: never shrink, swap:
  # may require reboot). Memory is the most common drift target.
  #
  # Tagged `lxc-memory-reconcile` so it can be run in isolation when the
  # create-flow is not needed: ansible-playbook provision-lxc.yml --tags lxc-memory-reconcile
  hosts: proxmox_hosts
  gather_facts: false
  become: true
  tags:
    - lxc-memory-reconcile
  vars_files:
    - vars/lxc.yml

  tasks:
    - name: Read current memory cap for each declared LXC
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          if pct status {{ item.vmid }} >/dev/null 2>&1; then
            pct config {{ item.vmid }} | awk '/^memory:/ {print $2}'
          else
            echo "MISSING"
          fi
        executable: /bin/bash
      loop: "{{ lxc_containers }}"
      loop_control:
        label: "{{ item.name }} (vmid {{ item.vmid }})"
      register: lxc_current_memory
      changed_when: false

    - name: Apply memory cap drift correction
      ansible.builtin.command:
        cmd: pct set {{ item.item.vmid }} --memory {{ item.item.memory }}
      loop: "{{ lxc_current_memory.results }}"
      loop_control:
        label: "{{ item.item.name }}: {{ item.stdout }} → {{ item.item.memory }}"
      when:
        - item.stdout is defined
        - item.stdout != 'MISSING'
        - item.stdout != ''
        - (item.stdout | int) != (item.item.memory | int)
      changed_when: true

- name: Reconcile onboot and startup order on existing LXC containers
  # The create-step applies onboot/startup only at first provision; this play
  # converges both knobs for every declared container that actually exists.
  # hermes (206) is declared but intentionally unprovisioned - the probe
  # answers MISSING for absent vmids and the apply tasks skip them. Live
  # state already matches the declarations, so this is an expected no-op.
  #
  # Tagged `lxc-startup-reconcile` so it can be run in isolation without
  # triggering the create-flow: ansible-playbook provision-lxc.yml --tags lxc-startup-reconcile
  hosts: proxmox_hosts
  gather_facts: false
  become: true
  tags:
    - lxc-startup-reconcile
  vars_files:
    - vars/lxc.yml

  tasks:
    - name: Read current onboot flag for each declared LXC
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          if pct status {{ item.vmid }} >/dev/null 2>&1; then
            pct config {{ item.vmid }} | awk '/^onboot:/ { print $2; exit }'
          else
            echo "MISSING"
          fi
        executable: /bin/bash
      loop: "{{ lxc_containers }}"
      loop_control:
        label: "{{ item.name }} (vmid {{ item.vmid }})"
      register: lxc_current_onboot
      changed_when: false
      check_mode: false

    - name: Apply onboot flag drift correction
      # pct config omits the onboot line entirely when it was never set (PVE
      # default 0), so an empty probe result counts as '0'.
      ansible.builtin.command:
        cmd: pct set {{ item.item.vmid }} --onboot {{ 1 if (item.item.onboot | default(lxc_defaults.onboot) | bool) else 0 }}
      loop: "{{ lxc_current_onboot.results }}"
      loop_control:
        label: "{{ item.item.name }}: {{ item.stdout | default('unset') | trim }} -> {{ item.item.onboot | default(lxc_defaults.onboot) }}"
      when:
        - item.stdout is defined
        - item.stdout != 'MISSING'
        - ((item.stdout | trim) or '0') != ('1' if (item.item.onboot | default(lxc_defaults.onboot) | bool) else '0')
      changed_when: true

    - name: Read current startup order for each declared LXC
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          if pct status {{ item.vmid }} >/dev/null 2>&1; then
            pct config {{ item.vmid }} | awk '/^startup:/ { print $2; exit }'
          else
            echo "MISSING"
          fi
        executable: /bin/bash
      loop: "{{ lxc_containers }}"
      loop_control:
        label: "{{ item.name }} (vmid {{ item.vmid }})"
      register: lxc_current_startup
      changed_when: false
      check_mode: false

    - name: Apply startup order drift correction
      ansible.builtin.command:
        cmd: pct set {{ item.item.vmid }} --startup {{ item.item.startup }}
      loop: "{{ lxc_current_startup.results }}"
      loop_control:
        label: "{{ item.item.name }}: {{ item.stdout | default('unset') | trim }} -> {{ item.item.startup | default('skip') }}"
      when:
        - item.item.startup is defined
        - item.stdout is defined
        - item.stdout != 'MISSING'
        - (item.stdout | trim) != item.item.startup
      changed_when: true

- name: Add new containers to in-memory inventory
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/lxc.yml

  tasks:
    - name: Add newly created containers to inventory
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: just_created_lxc
        ansible_host: "{{ item.ip }}"
        ansible_port: 22
        ansible_user: root
        ansible_ssh_private_key_file: ~/.ssh/homelab_ansible
      loop: "{{ lxc_containers }}"
      when: item.vmid in (hostvars[groups['proxmox_hosts'][0]]['containers_to_create'] | default([]) | map(attribute='vmid') | list)

- name: Wait for containers to be ready
  hosts: just_created_lxc
  gather_facts: false

  tasks:
    - name: Wait for SSH to become available
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 10

    - name: Test SSH connection
      ansible.builtin.ping:

- name: Initial container configuration
  hosts: just_created_lxc
  gather_facts: true
  become: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install essential packages
      ansible.builtin.apt:
        name:
          - sudo
          - curl
          - wget
          - vim
          - htop
        state: present

    - name: Display container info
      ansible.builtin.debug:
        msg: "LXC container {{ inventory_hostname }} is ready at {{ ansible_host }}"
