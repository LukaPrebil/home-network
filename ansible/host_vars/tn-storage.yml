---
# TrueNAS Storage VM configuration

# Network
ansible_host: 192.168.1.150  # Temporary DHCP IP
truenas_ip_final: 192.168.30.3  # Final IP after VLAN migration
truenas_web_user: truenas_admin  # TrueNAS 25.04 uses admin user for web UI
truenas_web_password: "{{ vault_truenas_root_password }}"  # Using vault password
# For SSH access (if needed later)
ansible_user: root
ansible_ssh_private_key_file: ~/.ssh/homelab_ansible

# VM Details
truenas_vmid: 100
truenas_hostname: tn-storage

# ZFS Pool Configuration
zfs_pool_name: tank
# Device names (verified via lsblk)
zfs_pool_devices:
  - /dev/nvme0n1  # 1TB WD Red SN700
  - /dev/nvme1n1  # 1TB WD Red SN700
  - /dev/nvme2n1  # 1TB WD Red SN700
zfs_pool_type: raidz1  # RAIDZ1 with 3 disks = ~2TB usable

# ZFS Datasets with quotas (can be increased later)
zfs_datasets:
  - name: "{{ zfs_pool_name }}/proxmox-vms"
    quota: 200G
    description: "VM disk images for Proxmox"
    compression: lz4

  - name: "{{ zfs_pool_name }}/proxmox-templates"
    quota: 20G
    description: "VM templates and ISOs"
    compression: lz4

  - name: "{{ zfs_pool_name }}/docker-volumes"
    quota: 100G
    description: "Docker persistent volumes"
    compression: lz4

  - name: "{{ zfs_pool_name }}/media"
    quota: none
    description: "Media files (Plex/Jellyfin)"
    compression: lz4
    recordsize: 1M  # Better for large files

  - name: "{{ zfs_pool_name }}/backups"
    quota: none
    description: "System and data backups"
    compression: zstd  # Better compression for backups

  - name: "{{ zfs_pool_name }}/immich-photos"
    quota: none
    description: "Immich photo library and metadata"
    compression: lz4
    recordsize: 1M  # Optimized for photo/video files

  - name: "{{ zfs_pool_name }}/paperless"
    quota: 50G
    description: "Paperless-ngx document storage"
    compression: zstd  # Documents compress well

# NFS Share Configuration
nfs_shares:
  - path: "/mnt/{{ zfs_pool_name }}/proxmox-vms"
    name: proxmox-vms
    allowed_networks:
      - 192.168.1.0/24  # Current network
      - 192.168.30.0/24  # Future VLAN
    options:
      - rw
      - sync
      - no_subtree_check
      - no_root_squash

  - path: "/mnt/{{ zfs_pool_name }}/proxmox-templates"
    name: proxmox-templates
    allowed_networks:
      - 192.168.1.0/24
      - 192.168.30.0/24
    options:
      - rw
      - sync
      - no_subtree_check
      - no_root_squash

  - path: "/mnt/{{ zfs_pool_name }}/docker-volumes"
    name: docker-volumes
    allowed_networks:
      - 192.168.1.0/24
      - 192.168.30.0/24
    options:
      - rw
      - sync
      - no_subtree_check
      - no_root_squash

  - path: "/mnt/{{ zfs_pool_name }}/media"
    name: media
    allowed_networks:
      - 192.168.1.0/24
      - 192.168.30.0/24
    options:
      - rw
      - async  # Better performance for media
      - no_subtree_check

  - path: "/mnt/{{ zfs_pool_name }}/backups"
    name: backups
    allowed_networks:
      - 192.168.1.0/24
      - 192.168.30.0/24
    options:
      - rw
      - sync
      - no_subtree_check

  - path: "/mnt/{{ zfs_pool_name }}/immich-photos"
    name: immich-photos
    allowed_networks:
      - 192.168.1.0/24
      - 192.168.30.0/24
    options:
      - rw
      - async  # Better performance for photo library
      - no_subtree_check
      - no_root_squash  # Immich container needs root access

  - path: "/mnt/{{ zfs_pool_name }}/paperless"
    name: paperless
    allowed_networks:
      - 192.168.1.0/24
      - 192.168.30.0/24
    options:
      - rw
      - sync
      - no_subtree_check
      - no_root_squash  # Paperless container needs root access

  # Separate pool for Plex and arr stack application configs
  - path: "/mnt/plex-apps"
    name: plex-apps
    allowed_networks:
      - 192.168.1.0/24
      - 192.168.30.0/24
    options:
      - rw
      - sync
      - no_subtree_check
      - no_root_squash  # Docker containers need root access

  # Separate pool for Plex media library (movies, TV shows, downloads)
  - path: "/mnt/plex-bulk"
    name: plex-bulk
    allowed_networks:
      - 192.168.1.0/24
      - 192.168.30.0/24
    options:
      - rw
      - async  # Better performance for media streaming
      - no_subtree_check
      - no_root_squash  # Plex and arr containers need root access

# iSCSI Configuration
# Used for services that require POSIX file locking (e.g., SQLite)
# where NFS is not suitable
iscsi_zvols:
  - name: "{{ zfs_pool_name }}/pds"
    volsize: 21474836480  # 20 GiB in bytes
    description: "ATProto PDS data (SQLite + blobs)"
    compression: lz4
    target_name: "pds"
    # TrueNAS initiators field requires iSCSI Qualified Names (IQNs), not IP addresses
    allowed_initiators:
      - "iqn.2004-10.com.ubuntu:01:8297a10ca"  # containers VM
  - name: "{{ zfs_pool_name }}/uptime-kuma"
    volsize: 5368709120  # 5 GiB in bytes
    description: "Uptime Kuma data (SQLite)"
    compression: lz4
    target_name: "uptime-kuma"
    allowed_initiators:
      - "iqn.2004-10.com.ubuntu:01:8297a10ca"  # containers VM
