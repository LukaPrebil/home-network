---
# Host-specific variables for containers VM
#
# Hardware: Proxmox VM (4 cores, 8GB RAM)
# Role: Docker host for containerized services
# IP: 192.168.30.140 (VLAN 30, Servers)

# iSCSI initiator identity for the pds / uptime_kuma / rustfs zvol mounts.
# Declarative so a VM rebuild keeps matching allowed_initiators in
# host_vars/tn-storage.yml instead of regenerating a random IQN that silently
# fails the allowlist.
iscsi_initiator_iqn: "iqn.2004-10.com.ubuntu:01:8297a10ca"

# RustFS object store endpoint. The S3 API binds to this address only, so the
# buckets answer on VLAN 30 (and anything routed to it, such as the rpi4
# tailnet subnet route) and never on the WAN. Declared here because the
# OpenTofu root in iac/object-store pins the same address literally: the CI
# path reaches it over the subnet route and must not depend on AdGuard.
rustfs_bind_address: "192.168.30.140"

# OTBR Configuration (containers VM hosts the USB dongle and OTBR)
otbr_thread_usb_device: "/dev/serial/by-id/usb-ITEAD_SONOFF_Zigbee_3.0_USB_Dongle_Plus_V2_20221029081826-if00"
otbr_backbone_interface: "eth0"

# Thread Network Configuration (actual running values)
# IMPORTANT: These values are descriptive only and match the existing,
# operational Thread network. The source of truth and recovery artifact is the
# full Active Operational Dataset TLV, vaulted as vault_thread_active_dataset
# (see secrets.example.yml) - the role auto-restores it onto an empty store.
otbr_thread_channel: 15
otbr_thread_network_name: "OpenThreadHA"
otbr_thread_panid: "0x1234"
otbr_thread_extpanid: "1111111122222222"

# Data paths bind-mounted into containers here. All three are iSCSI zvols from
# tn-storage, and all three must be mounted before Docker starts: a missing one
# leaves the container writing into a stub directory on the VM disk, which is how
# PDS ran from 2026-10-31 to 2026-11-03 without anyone noticing. Consumed by
# roles/docker, which renders one docker.service drop-in from this list.
docker_required_mounts:
  - /mnt/pds
  - /mnt/uptime-kuma
  - /mnt/rustfs
