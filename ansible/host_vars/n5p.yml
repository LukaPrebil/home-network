---
# Host-specific variables for n5p (Minisforum N5 Pro)

# Physical uplink the Proxmox bridge attaches to (roles/proxmox/tasks/network.yml).
primary_interface: enp197s0

# Additional user for management
admin_users:
  - name: luka
    shell: /bin/bash
    groups:
      - sudo
    ssh_key: "{{ vault_luka_ssh_public_key }}"
