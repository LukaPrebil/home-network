---
# Traefik LXC configuration

# Network
ansible_host: 192.168.1.142  # Temporary IP (will migrate to 192.168.60.2)
ansible_user: root
ansible_ssh_private_key_file: ~/.ssh/homelab_ansible

# Traefik keeps its config/state on local rootfs (/opt/traefik); it has no
# docker-volumes NFS bind, so skip the /srv/docker mount + stub creation.
docker_nfs_volumes_enabled: false

# Docker provider stays off: it serves zero routes (all twelve routers live in
# the file provider) and the socket mount is pure risk on the WAN edge. Both
# the provider block and the socket mount key off this one flag.
traefik_docker_provider_enabled: false

# ACME/Let's Encrypt configuration
traefik_acme_enabled: true
traefik_acme_email: "luka.prebil.grintal@proton.me"  # Email for Let's Encrypt notifications
traefik_acme_challenge_type: "dns"  # Use DNS-01 challenge instead of HTTP-01
traefik_acme_use_wildcard: true  # Use wildcard certificate for all subdomains

# Cloudflare DNS challenge configuration
traefik_cloudflare_dns_api_token: "{{ vault_cloudflare_dns_api_token }}"

# Domain configuration
traefik_domain: "lukapg.dev"  # Used in dynamic.yml.j2 for all subdomains

# Cloudflare real IP extraction (ha.lukapg.dev is Cloudflare-proxied)
traefik_cloudflare_real_ip_enabled: true

# Pinned Cloudflare edge ranges (published at https://www.cloudflare.com/ips-v4
# and /ips-v6, pinned 2026-09-05). tasks/config.yml drift-checks these against
# the official lists on every converge: a confirmed mismatch fails the run.
# They feed the websecure forwardedHeaders trust list and the CrowdSec
# bouncer's trusted-proxy list.
traefik_cloudflare_ipv4_ranges:
  - "173.245.48.0/20"
  - "103.21.244.0/22"
  - "103.22.200.0/22"
  - "103.31.4.0/22"
  - "141.101.64.0/18"
  - "108.162.192.0/18"
  - "190.93.240.0/20"
  - "188.114.96.0/20"
  - "197.234.240.0/22"
  - "198.41.128.0/17"
  - "162.158.0.0/15"
  - "104.16.0.0/13"
  - "104.24.0.0/14"
  - "172.64.0.0/13"
  - "131.0.72.0/22"
traefik_cloudflare_ipv6_ranges:
  - "2400:cb00::/32"
  - "2606:4700::/32"
  - "2803:f800::/32"
  - "2405:b500::/32"
  - "2405:8100::/32"
  - "2a06:98c0::/29"
  - "2c0f:f248::/32"

# Router-level Prometheus labels: required to tell the HA routers apart in the
# 429 alerts (ha-secure@file must stay unlimited, ha-login-secure@file is the
# only HA router allowed to emit 429).
traefik_metrics_add_routers_labels: true

# Desired final state: only HA login-flow POSTs are rate-limited. Stage the
# rollout with `-e traefik_ha_login_rate_limit_enabled=false` and verify the
# trust chain before converging without the override.
traefik_ha_login_rate_limit_enabled: true

# CrowdSec bouncer integration
traefik_crowdsec_enabled: true
traefik_crowdsec_bouncer_key: "{{ vault_crowdsec_bouncer_key }}"

# CrowdSec engine (same bouncer key for pre-registration)
crowdsec_bouncer_key: "{{ vault_crowdsec_bouncer_key }}"
