---
# Host-specific variables for rpi4 (Raspberry Pi 4)
#
# Hardware: Raspberry Pi 4 Model B
# Role: Secondary DNS server and IoT services
# IP: 192.168.1.110

# AdGuard Home configuration for rpi4 (Secondary DNS)
adguard_deployment_method: "docker"  # Use Docker instead of native binary
adguard_data_dir: "/srv/docker/adguard/data"
adguard_config_dir: "/srv/docker/adguard/config"

# Matter Server Configuration (rpi4 hosts Matter Server)
matter_server_port: 5580
matter_server_log_level: "info"

# OTBR Connection (Matter Server connects to OTBR on containers VM)
otbr_host: "192.168.1.140"  # containers VM
otbr_rest_api_port: 8081
