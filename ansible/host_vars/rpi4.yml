---
# Host-specific variables for rpi4 (Raspberry Pi 4)
#
# Hardware: Raspberry Pi 4 Model B
# Role: Secondary DNS server and IoT services
# IP: 192.168.1.110

# AdGuard Home configuration for rpi4 (Secondary DNS).
# Native binary with state on the local SD card (defaults: /opt/adguardhome +
# /var/lib/adguardhome), which removes Docker and the NFS mount from the
# secondary-DNS failure chain - rpi4 boots slower than TrueNAS, so an NFS-backed
# secondary could come up with empty state during the boot race. arm64 binary is
# selected automatically via adguard_arch_map.
adguard_deployment_method: "native"
adguard_migrate_from_docker: true  # one-time teardown of the old adguard container

# Shorter retention than the 90d/30d defaults to limit SD-card write wear.
adguard_querylog_interval: "168h"    # 7 days
adguard_statistics_interval: "168h"  # 7 days

# Matter Server Configuration (rpi4 hosts Matter Server)
matter_server_port: 5580
matter_server_log_level: "info"

# Tailscale (consumed by the standalone tailscale role).
# rpi4 acts as the tailnet subnet router for the home LAN - peers
# joining the tailnet from off-LAN can reach 192.168.1.0/24 IPs through
# this host. Coupling note: rpi4 also runs Matter Server + AdGuard
# secondary; if it goes offline, all three of those (plus off-LAN
# tailnet access) become unreachable until it's back.
tailscale_hostname: rpi4
tailscale_advertise_tags: "tag:subnet-router"
tailscale_accept_dns: false        # rpi4 is on the LAN; AdGuard is direct
tailscale_accept_routes: false     # don't accept tailnet-pushed routes (no self-loop)
tailscale_advertise_routes:
  - "192.168.1.0/24"
tailscale_authkey: "{{ vault_tailscale_router_auth_key }}"
