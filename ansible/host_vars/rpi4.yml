---
# Host-specific variables for rpi4 (Raspberry Pi 4)
#
# Hardware: Raspberry Pi 4 Model B
# Role: Secondary DNS server and IoT services
# IP: 192.168.30.110 (VLAN 30, Servers)

# AdGuard Home configuration for rpi4 (Secondary DNS).
# Native binary with state on the local SD card (defaults: /opt/adguardhome +
# /var/lib/adguardhome), which removes Docker and the NFS mount from the
# secondary-DNS failure chain - rpi4 boots slower than TrueNAS, so an NFS-backed
# secondary could come up with empty state during the boot race. arm64 binary is
# selected automatically via adguard_arch_map.
adguard_deployment_method: "native"
adguard_migrate_from_docker: true  # one-time teardown of the old adguard container

# Shorter retention than the 90d/30d defaults to limit SD-card write wear.
adguard_querylog_interval: "7d"
adguard_statistics_interval: "7d"

# Matter Server Configuration (rpi4 hosts Matter Server)
matter_server_port: 5580
matter_server_log_level: "info"

# Tailscale (consumed by the standalone tailscale role).
# rpi4 acts as the tailnet subnet router for the Servers VLAN - peers
# joining the tailnet from off-LAN can reach 192.168.30.0/24 through
# this host (advertise or drop other VLANs deliberately). Traefik lives in
# the DMZ, so only its single address is advertised, not all of VLAN 60;
# rpi4 SNATs the traffic, which keeps it inside Traefik's lan-only
# allowlist. Coupling note:
# rpi4 also runs Matter Server + AdGuard secondary; if it goes offline,
# all three of those (plus off-LAN tailnet access) become unreachable
# until it's back.
tailscale_hostname: rpi4
tailscale_advertise_tags: "tag:subnet-router"
tailscale_accept_dns: false        # rpi4 is on the LAN; AdGuard is direct
tailscale_accept_routes: false     # don't accept tailnet-pushed routes (no self-loop)
tailscale_subnet_router: true
tailscale_advertise_routes:
  - "192.168.30.0/24"
  - "192.168.60.142/32"  # Traefik LXC (DMZ)
# Shell access from the phone during an outage: rpi4 is the only always-on node,
# so it is the one host that must accept a tailnet SSH login. Access is granted
# by the ssh rule in the tailnet policy file, not by a key on the phone.
tailscale_ssh: true

# Hosts this box can wake over the LAN, rendered by the wake_page role. Probe
# target is n5p's pveproxy: when it answers, the hypervisor is back, which is
# the only claim the page makes.
wake_page_hosts:
  - name: n5p
    mac: "38:05:25:32:36:c8"  # enp197s0, the NIC wol-arm.service keeps armed
    probe_host: 192.168.30.128
    probe_port: 8006
tailscale_authkey: "{{ vault_tailscale_router_auth_key }}"
