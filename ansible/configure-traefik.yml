---
# Configure and deploy Traefik reverse proxy
#
# This playbook:
# - Applies common role for base system configuration
# - Applies docker role to install Docker and Docker Compose
# - Applies traefik role to deploy Traefik reverse proxy
#
# Usage:
#   ansible-playbook configure-traefik.yml

- name: Configure Traefik reverse proxy
  hosts: traefik
  become: true
  vars_files:
    - secrets.yml

  roles:
    - role: common
      tags:
        - common
        - base

    - role: docker
      tags:
        - docker

    - role: traefik
      tags:
        - traefik
