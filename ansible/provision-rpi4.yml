---
# Playbook to provision Raspberry Pi 4 as a service host
#
# Usage:
#   ansible-playbook provision-rpi4.yml
#
# Prerequisites:
# - Fresh Raspberry Pi OS installed on rpi4
# - SSH access configured
# - rpi4 added to inventory
#
# This playbook:
# 1. Refreshes the repo-tracked pinned host key for rpi4 (a re-flashed SD card
#    ships a new host key; converging against the stale pin would fail hard)
# 2. Applies common role (users, SSH hardening, timezone)
# 3. Installs Docker and Docker Compose
# 4. Prepares directory structure for services
# 5. Does NOT start services (use configure-rpi4-services.yml for that)

- name: Refresh the pinned host key for rpi4
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:
    - name: Pin host key for rpi4
      ansible.builtin.include_tasks: refresh-pinned-host-key.yml
      vars:
        pinned_host: rpi4

- name: Provision Raspberry Pi 4 platform
  hosts: rpi4
  become: true
  gather_facts: true

  tasks:
    - name: Display provisioning information
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "Provisioning Raspberry Pi 4"
          - "=============================================="
          - ""
          - "Target: {{ inventory_hostname }} ({{ ansible_host }})"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Architecture: {{ ansible_architecture }}"
          - ""
          - "This will:"
          - "  1. Configure users and SSH hardening"
          - "  2. Install Docker and Docker Compose"
          - "  3. Set up directory structure"
          - "  4. Configure system settings"
          - ""
          - "Services will be deployed separately with:"
          - "  ansible-playbook configure-rpi4-services.yml"
          - ""
          - "Starting provisioning..."
          - "=============================================="

- name: Apply common role
  hosts: rpi4
  become: true
  gather_facts: true
  roles:
    - common

- name: Install Docker
  hosts: rpi4
  become: true
  gather_facts: true
  roles:
    - docker

- name: Prepare service directories
  hosts: rpi4
  become: true
  gather_facts: true

  vars:
    # rpi4 stores matter-server state under this base (NFS-backed). AdGuard is
    # now a native binary with state on the local SD card - no /srv/docker/adguard
    # entry - and the planned Mosquitto broker was decommissioned, so there are no
    # per-service subdirectories to pre-create here.
    rpi4_services_dir: "/srv/docker"

  tasks:
    - name: Create base services directory
      ansible.builtin.file:
        path: "{{ rpi4_services_dir }}"
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "Raspberry Pi 4 Provisioning Complete!"
          - "=============================================="
          - ""
          - "Platform Setup:"
          - "  ✅ Common configuration applied"
          - "  ✅ Users and SSH configured"
          - "  ✅ Docker installed"
          - "  ✅ Base services directory created"
          - ""
          - "Next Steps:"
          - "1. Deploy Matter Server:"
          - "   ansible-playbook site.yml --tags matter-server --limit rpi4"
          - ""
          - "2. Verify Docker:"
          - "   ssh {{ ansible_user }}@{{ ansible_host }} docker ps"
          - "=============================================="
