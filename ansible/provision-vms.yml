---
# Playbook to provision VMs from cloud-init template
# VMs are defined in vars/vms.yml
#
# Usage:
#   ansible-playbook provision-vms.yml
#
# This will create VMs that don't already exist (idempotent)

- name: Validate VM definitions
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/vms.yml
  tasks:
    - name: Check if any VMs are defined
      ansible.builtin.fail:
        msg: |
          ERROR: No VMs defined in vars/vms.yml
          Please add VMs to the 'vms_to_create' list before running this playbook.
      when: vms_to_create | length == 0

    - name: Validate each VM definition
      ansible.builtin.assert:
        that:
          - item.name is defined
          - item.vmid is defined
          - item.vlan_id is defined
          - item.ip is defined
          - item.gateway is defined
          - (item.vlan_id is none) or (item.vlan_id | string in ['10', '20', '30', '40', '50', '60', '99'])
        fail_msg: |
          Invalid VM definition: {{ item }}
          Required fields: name, vmid, vlan_id, ip, gateway
          Valid VLANs: null (no VLAN), 10, 20, 30, 40, 50, 60, 99
      loop: "{{ vms_to_create }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Display VMs to be processed
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "VMs defined: {{ vms_to_create | length }}"
          - "=============================================="
          - "{% for vm in vms_to_create %}{{ loop.index }}. {{ vm.name }} (VLAN {{ vm.vlan_id }}, IP {{ vm.ip }}){% endfor %}"
          - "=============================================="

- name: Clone VMs from template
  hosts: n5p
  become: true
  vars_files:
    - vars/cloudinit_template.yml
    - vars/vms.yml
  vars:
    # VLAN network mapping for display purposes
    vlan_networks:
      "10": "192.168.10.0/24 (Management)"
      "20": "192.168.20.0/24 (Trusted)"
      "30": "192.168.30.0/24 (Servers)"
      "40": "192.168.40.0/24 (IoT)"
      "50": "192.168.50.0/24 (Cameras)"
      "60": "192.168.60.0/24 (Public Services)"
      "99": "192.168.99.0/24 (Guest)"
  tasks:
    - name: Check if template exists
      ansible.builtin.command:
        cmd: "qm status {{ template_vmid }}"
      register: template_exists
      failed_when: false
      changed_when: false

    - name: Fail if template does not exist
      ansible.builtin.fail:
        msg: |
          ERROR: Template VM {{ template_vmid }} ({{ template_name }}) does not exist.
          Please run 'ansible-playbook create-cloudinit-template.yml' first.
      when: template_exists.rc != 0
    - name: Check which VMs already exist
      # Matched on vmid, not name, the way provision-lxc.yml does. A
      # side-by-side rebuild leaves the predecessor running the same name, so a
      # name match reports the replacement as already existing and silently
      # skips creating it.
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          qm list | awk '$1 == "{{ item.vmid }}" { print }' || true
        executable: /bin/bash
      register: existing_vms_check
      changed_when: false
      loop: "{{ vms_to_create }}"
      loop_control:
        label: "{{ item.name }} (vmid {{ item.vmid }})"

    - name: Build list of VMs to create (filter out existing ones)
      ansible.builtin.set_fact:
        vms_to_provision: "{{ vms_to_provision | default([]) + [item.item] }}"
      when: item.stdout == ""
      loop: "{{ existing_vms_check.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Display VMs that already exist (skipped)
      ansible.builtin.debug:
        msg:
          - "Skipping existing VMs:"
          - "{% for item in existing_vms_check.results %}{% if item.stdout != '' %}  - {{ item.item.name }} (already exists){% endif %}{% endfor %}"
      when: existing_vms_check.results | selectattr('stdout', 'ne', '') | list | length > 0

    - name: Display VMs to be created
      ansible.builtin.debug:
        msg:
          - "Creating {{ vms_to_provision | default([]) | length }} new VM(s):"
          - "{% for vm in vms_to_provision | default([]) %}  - {{ vm.name }}{% endfor %}"
      when: vms_to_provision is defined and vms_to_provision | length > 0

    - name: End play if no VMs need to be created
      ansible.builtin.meta: end_play
      when: vms_to_provision is not defined or vms_to_provision | length == 0

    - name: Clone VMs from template
      ansible.builtin.shell:
        cmd: >
          qm clone {{ template_vmid }} {{ item.vmid | default(omit) }}
          --name {{ item.name }}
          --full
          --storage {{ item.storage | default(vm_defaults.storage) }}
          --description "{{ item.description | default('VM cloned from ' + template_name) }}"
      loop: "{{ vms_to_provision }}"
      loop_control:
        label: "{{ item.name }}"
      register: clone_results
      changed_when: clone_results.rc | default(0) == 0

    - name: Build VM VMID mapping
      # Straight from the declaration: qm clone is handed item.vmid as the new
      # id, so the mapping is already known. Deriving it with
      # `qm list | grep -w <name>` returned two ids during a side-by-side
      # rebuild, where the predecessor still carries the same name, and every
      # later `qm set` was then handed a two-line vmid.
      ansible.builtin.set_fact:
        vm_vmid_map: "{{ vm_vmid_map | default({}) | combine({item.name: item.vmid | string}) }}"
      loop: "{{ vms_to_provision }}"
      loop_control:
        label: "{{ item.name }}: {{ item.vmid }}"

    - name: Configure network with VLAN tag
      ansible.builtin.shell:
        cmd: >
          qm set {{ vm_vmid_map[item.name] }}
          --net0 virtio,bridge={{ item.network_bridge | default(vm_defaults.network_bridge) }},tag={{ item.vlan_id }},firewall=1
      when: item.vlan_id is not none
      loop: "{{ vms_to_provision }}"
      loop_control:
        label: "{{ item.name }} - VLAN {{ item.vlan_id }}"
      changed_when: true

    - name: Configure network without VLAN tag (flat network)
      ansible.builtin.shell:
        cmd: >
          qm set {{ vm_vmid_map[item.name] }}
          --net0 virtio,bridge={{ item.network_bridge | default(vm_defaults.network_bridge) }},firewall=1
      when: item.vlan_id is none
      loop: "{{ vms_to_provision }}"
      loop_control:
        label: "{{ item.name }} - No VLAN (flat network)"
      changed_when: true

    - name: Configure static IP addresses
      ansible.builtin.shell:
        cmd: >
          qm set {{ vm_vmid_map[item.name] }}
          --ipconfig0 ip={{ item.ip }}/24,gw={{ item.gateway }}
      loop: "{{ vms_to_provision }}"
      loop_control:
        label: "{{ item.name }} - {{ item.ip }}"
      changed_when: true

    - name: Set hostname via cloud-init
      ansible.builtin.shell:
        cmd: >
          qm set {{ vm_vmid_map[item.name] }}
          --searchdomain {{ domain }}
      loop: "{{ vms_to_provision }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: true

    - name: Update CPU cores if specified
      ansible.builtin.command:
        cmd: qm set {{ vm_vmid_map[item.name] }} --cores {{ item.cores }}
      when: item.cores is defined
      loop: "{{ vms_to_provision }}"
      loop_control:
        label: "{{ item.name }} - {{ item.cores | default('default') }} cores"
      changed_when: true

    - name: Update memory if specified
      ansible.builtin.command:
        cmd: qm set {{ vm_vmid_map[item.name] }} --memory {{ item.memory }}
      when: item.memory is defined
      loop: "{{ vms_to_provision }}"
      loop_control:
        label: "{{ item.name }} - {{ item.memory | default('default') }}MB RAM"
      changed_when: true

    - name: Set balloon floor if specified
      # PVE auto-balloon shrinks the VM toward `balloon` when host RAM
      # crosses 80% pressure, inflates back toward `memory` when slack
      # returns. With no balloon set, PVE defaults balloon=memory (no
      # shrinking) and the host carries the full allocation forever.
      ansible.builtin.command:
        cmd: qm set {{ vm_vmid_map[item.name] }} --balloon {{ item.balloon }}
      when: item.balloon is defined
      loop: "{{ vms_to_provision }}"
      loop_control:
        label: "{{ item.name }} - balloon floor {{ item.balloon | default('unset') }}MB"
      changed_when: true

    - name: Resize disk if specified
      ansible.builtin.command:
        cmd: qm resize {{ vm_vmid_map[item.name] }} scsi0 {{ item.disk_size }}
      when: item.disk_size is defined
      loop: "{{ vms_to_provision }}"
      loop_control:
        label: "{{ item.name }} - {{ item.disk_size | default('no resize') }}"
      changed_when: true

    - name: Override cloud-init nameservers for VMs that opt out of the global list
      ansible.builtin.command:
        cmd: qm set {{ vm_vmid_map[item.name] }} --nameserver "{{ item.dns_servers | join(' ') }}"
      when: item.dns_servers is defined
      loop: "{{ vms_to_provision }}"
      loop_control:
        label: "{{ item.name }} - DNS {{ item.dns_servers | default('default') }}"
      changed_when: true

    - name: Enable start-on-boot for VMs
      # The clone flow historically never set --onboot, leaving new VMs at the
      # PVE default (0) - which kept the containers and dev VMs down after the
      # 2026-07-22 power-loss outage.
      ansible.builtin.command:
        cmd: qm set {{ vm_vmid_map[item.name] }} --onboot {{ 1 if (item.onboot | bool) else 0 }}
      when: item.onboot is defined
      loop: "{{ vms_to_provision }}"
      loop_control:
        label: "{{ item.name }} - onboot {{ item.onboot | default('unset') }}"
      changed_when: true

    - name: Attach declared USB devices to VMs
      # Clone-flow only, matching disk_size and dns_servers above: this applies
      # at create time, not on every converge. A guest that already holds the
      # device keeps it.
      ansible.builtin.command:
        cmd: qm set {{ vm_vmid_map[item.0.name] }} --{{ item.1.slot }} host={{ item.1.host }}
      loop: "{{ vms_to_provision | subelements('usb_devices', skip_missing=true) }}"
      loop_control:
        label: "{{ item.0.name }} - {{ item.1.slot }} host={{ item.1.host }}"
      changed_when: true

    - name: Set startup order for VMs
      ansible.builtin.command:
        cmd: qm set {{ vm_vmid_map[item.name] }} --startup {{ item.startup }}
      when: item.startup is defined
      loop: "{{ vms_to_provision }}"
      loop_control:
        label: "{{ item.name }} - {{ item.startup | default('no startup order') }}"
      changed_when: true

    - name: Start all new VMs
      ansible.builtin.command:
        cmd: qm start {{ vm_vmid_map[item.name] }}
      loop: "{{ vms_to_provision }}"
      loop_control:
        label: "{{ item.name }}"
      register: vm_starts
      changed_when: vm_starts.rc | default(0) == 0

    - name: Display provisioning summary
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "VM Provisioning Complete!"
          - "=============================================="
          - ""
          - "Created {{ vms_to_provision | length }} new VM(s):"
          - "{% for vm in vms_to_provision %}  {{ loop.index }}. {{ vm.name }} (VMID: {{ vm_vmid_map[vm.name] }}, VLAN: {{ vm.vlan_id }}, IP: {{ vm.ip }}){% endfor %}"
          - ""
          - "All VMs are starting with cloud-init configuration..."
          - ""
          - "Next Steps:"
          - "1. Wait ~60 seconds for all VMs to complete cloud-init"
          - "2. Verify VMs are accessible:"
          - "{% for vm in vms_to_provision %}   ssh ubuntu@{{ vm.ip }}{% endfor %}"
          - ""
          - "3. Add VMs to Ansible inventory (inventory/hosts.yml)"
          - "4. Run common role to provision ansible_user on each VM"
          - ""
          - "VM Details:"
          - "{% for vm in vms_to_provision %}  - {{ vm.name }}: {{ vm.ip }} on {{ vlan_networks[vm.vlan_id | string] if vm.vlan_id is not none else 'flat network (no VLAN)' }}{% endfor %}"
          - "=============================================="

- name: Wait for new VMs to be ready
  hosts: n5p
  become: true
  vars_files:
    - vars/vms.yml
  tasks:
    - name: Check if any VMs were provisioned
      ansible.builtin.set_fact:
        has_new_vms: "{{ vms_to_provision is defined and vms_to_provision | length > 0 }}"

    - name: End play if no new VMs were created
      ansible.builtin.meta: end_play
      when: not has_new_vms

    - name: Wait for new VMs to be accessible via SSH
      ansible.builtin.wait_for:
        host: "{{ item.ip }}"
        port: 22
        delay: 10
        timeout: 300
        state: started
      loop: "{{ vms_to_provision }}"
      loop_control:
        label: "{{ item.name }} ({{ item.ip }})"
      when: has_new_vms

    - name: Display readiness status
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "All new VMs are now accessible via SSH!"
          - "=============================================="
          - ""
          - "You can now SSH to your VMs:"
          - "{% for vm in vms_to_provision %}  ssh ubuntu@{{ vm.ip }}{% endfor %}"
          - ""
          - "Cloud-init logs can be checked with:"
          - "  cloud-init status --wait"
          - "  cloud-init status --long"
          - "=============================================="
      when: has_new_vms

# Reconcile memory caps on every run, not just first-provision.
# The create-flow above only touches VMs in `vms_to_provision` (new VMs);
# editing `memory:` in vars/vms.yml does not retroactively change the
# running VM's max. This play closes that drift.
#
# qm set --memory N updates the PENDING config - the cap takes effect at
# next boot. A running VM keeps its current allocation until it restarts
# (LXCs are different: pct set --memory is enforced live by cgroups).
#
# We set --balloon together with --memory so flat-cap VMs (balloon=memory)
# stay flat after a shrink. The balloon-reconcile play below then refines
# balloon for VMs that declare an explicit lower floor.
- name: Reconcile VM memory caps
  # Tagged `vm-memory-reconcile` so it can be run in isolation when the
  # create-flow is not needed: ansible-playbook provision-vms.yml --tags vm-memory-reconcile
  hosts: n5p
  become: true
  gather_facts: false
  tags:
    - vm-memory-reconcile
  vars_files:
    - vars/vms.yml
  tasks:
    - name: Read each managed VM's current memory cap
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          qm config {{ item.vmid }} | awk '/^memory:/ { print $2; exit }'
        executable: /bin/bash
      register: vm_memory_read
      changed_when: false
      check_mode: false
      loop: "{{ vms_to_create }}"
      loop_control:
        label: "{{ item.name }} ({{ item.vmid }})"

    - name: Apply memory cap where on-disk drifted from desired
      # Set --balloon alongside --memory so the flat-cap shape (no auto-balloon)
      # is preserved when shrinking. PVE rejects balloon > memory, so changing
      # both atomically avoids the transient invalid state.
      ansible.builtin.command:
        cmd: qm set {{ item.item.vmid }} --memory {{ item.item.memory }} --balloon {{ item.item.memory }}
      when:
        - item.item.memory is defined
        - (item.stdout | default('') | trim | int) != (item.item.memory | int)
      loop: "{{ vm_memory_read.results }}"
      loop_control:
        label: "{{ item.item.name }}: {{ item.stdout | default('?') | trim }} -> {{ item.item.memory }}"
      changed_when: true

# Reconcile balloon floors on every run, not just first-provision.
# The create-flow above only touches VMs in `vms_to_provision` (new VMs).
# For existing VMs, PVE keeps whatever `balloon:` was set last, so a change
# in vars/vms.yml would silently never apply without this block.
- name: Reconcile VM balloon floors
  hosts: n5p
  become: true
  gather_facts: false
  vars_files:
    - vars/vms.yml
  tasks:
    - name: Read each managed VM's current balloon value
      # qm config emits `balloon: N` when set, or omits the line when PVE
      # defaults balloon to memory. awk emits the raw value or empty.
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          qm config {{ item.vmid }} | awk '/^balloon:/ { print $2; exit }'
        executable: /bin/bash
      register: vm_balloon_read
      changed_when: false
      check_mode: false
      loop: "{{ vms_to_create }}"
      loop_control:
        label: "{{ item.name }} ({{ item.vmid }})"

    - name: Apply balloon floor where on-disk drifted from desired
      # Treat unset == max (PVE default). Compare as integers to handle
      # the unset-vs-explicit-equal-memory case uniformly.
      ansible.builtin.command:
        cmd: qm set {{ item.item.vmid }} --balloon {{ item.item.balloon }}
      when:
        - item.item.balloon is defined
        - (item.stdout | default('') | trim | int) != (item.item.balloon | int)
      loop: "{{ vm_balloon_read.results }}"
      loop_control:
        label: "{{ item.item.name }}: {{ item.stdout | default('unset') | trim }} -> {{ item.item.balloon | default('skip') }}"
      changed_when: true

# Reconcile onboot + startup order on every run, not just first-provision.
# The create-flow above only touches new VMs, and before 2026-07-22 it never
# set --onboot at all - which is why the containers and dev VMs stayed
# powered off after the power-loss outage. This play converges both knobs
# for every VM declared in vms_to_create (and only those - never the
# cloud-init template 9001, never undeclared vmids).
- name: Reconcile VM onboot and startup order
  # Tagged `vm-startup-reconcile` so it can be run in isolation when the
  # create-flow is not needed: ansible-playbook provision-vms.yml --tags vm-startup-reconcile
  hosts: n5p
  become: true
  gather_facts: false
  tags:
    - vm-startup-reconcile
  vars_files:
    - vars/vms.yml
  tasks:
    - name: Read each managed VM's current onboot flag
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          qm config {{ item.vmid }} | awk '/^onboot:/ { print $2; exit }'
        executable: /bin/bash
      register: vm_onboot_read
      changed_when: false
      check_mode: false
      loop: "{{ vms_to_create }}"
      loop_control:
        label: "{{ item.name }} ({{ item.vmid }})"

    - name: Apply onboot flag where on-disk drifted from desired
      # qm config omits the onboot line entirely when it was never set (PVE
      # default 0), so an empty probe result counts as '0'.
      ansible.builtin.command:
        cmd: qm set {{ item.item.vmid }} --onboot {{ 1 if (item.item.onboot | bool) else 0 }}
      when:
        - item.item.onboot is defined
        - ((item.stdout | default('') | trim) or '0') != ('1' if (item.item.onboot | bool) else '0')
      loop: "{{ vm_onboot_read.results }}"
      loop_control:
        label: "{{ item.item.name }}: {{ item.stdout | default('unset') | trim }} -> {{ item.item.onboot | default('skip') }}"
      changed_when: true

    - name: Read each managed VM's current startup order
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          qm config {{ item.vmid }} | awk '/^startup:/ { print $2; exit }'
        executable: /bin/bash
      register: vm_startup_read
      changed_when: false
      check_mode: false
      loop: "{{ vms_to_create }}"
      loop_control:
        label: "{{ item.name }} ({{ item.vmid }})"

    - name: Apply startup order where on-disk drifted from desired
      ansible.builtin.command:
        cmd: qm set {{ item.item.vmid }} --startup {{ item.item.startup }}
      when:
        - item.item.startup is defined
        - (item.stdout | default('') | trim) != item.item.startup
      loop: "{{ vm_startup_read.results }}"
      loop_control:
        label: "{{ item.item.name }}: {{ item.stdout | default('unset') | trim }} -> {{ item.item.startup | default('skip') }}"
      changed_when: true
