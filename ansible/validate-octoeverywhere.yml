---
# Validate OctoEverywhere migration
#
# This playbook starts OctoEverywhere on containers VM and validates printer
# connectivity before switching production traffic.
#
# Usage:
#   ansible-playbook validate-octoeverywhere.yml

- name: Validate OctoEverywhere on containers VM
  hosts: containers
  become: yes
  gather_facts: yes

  vars:
    octoeverywhere_base_dir: "/srv/docker/octoeverywhere"
    octoeverywhere_container_name: "octoeverywhere"
    octoeverywhere_printer_ip: "192.168.1.100"

  tasks:
    - name: Start OctoEverywhere service
      community.docker.docker_compose_v2:
        project_src: "{{ octoeverywhere_base_dir }}"
        state: present
      register: service_start

    - name: Wait for OctoEverywhere container to be running
      community.docker.docker_container_info:
        name: "{{ octoeverywhere_container_name }}"
      register: container_info
      until: container_info.container.State.Status == "running"
      retries: 12
      delay: 5

    - name: Check OctoEverywhere logs for connection status
      ansible.builtin.shell:
        cmd: "docker logs {{ octoeverywhere_container_name }} --tail 50 2>&1 | grep -i 'connected\\|error\\|printer' || echo 'No specific connection status found'"
      register: logs_check
      changed_when: false

    - name: Test printer connectivity (ping)
      ansible.builtin.shell:
        cmd: "ping -c 3 {{ octoeverywhere_printer_ip }}"
      register: ping_test
      changed_when: false
      ignore_errors: yes

    - name: Display validation results
      ansible.builtin.debug:
        msg:
          - "✅ OctoEverywhere validation PASSED"
          - ""
          - "Container Status: {{ container_info.container.State.Status }}"
          - "Printer IP: {{ octoeverywhere_printer_ip }}"
          - "Printer Reachable: {{ 'YES' if ping_test.rc == 0 else 'NO - Check printer network' }}"
          - ""
          - "Recent logs:"
          - "{{ logs_check.stdout_lines | join('\n') }}"
          - ""
          - "Next steps:"
          - "  1. Check OctoEverywhere cloud portal for connection status"
          - "  2. Verify printer is accessible and responding"
          - "  3. Compare with old instance running on rpi4"
          - "  4. Test a print job if possible"
          - ""
          - "Old instance on rpi4 still running as backup"

  post_tasks:
    - name: Validation summary
      ansible.builtin.set_fact:
        validation_status: "PASSED"
      when: container_info.container.State.Status == "running"

    - name: Fail if validation did not pass
      ansible.builtin.fail:
        msg: "OctoEverywhere validation FAILED - do not proceed"
      when: container_info.container.State.Status != "running"
