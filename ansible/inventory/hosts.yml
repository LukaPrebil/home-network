---
all:
  children:
    # Hypervisor hosts running Proxmox
    proxmox_hosts:
      hosts:
        n5p:
          ansible_host: 192.168.1.128
          ansible_port: 22
          ansible_user: root  # Proxmox default, will create ansible_user via common role
          proxmox_api_host: 192.168.1.128
          proxmox_api_port: 8006

    # Group all Linux servers (for common role)
    linux_servers:
      children:
        proxmox_hosts:
