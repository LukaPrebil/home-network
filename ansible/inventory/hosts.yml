---
all:
  children:
    # Hypervisor hosts running Proxmox
    proxmox_hosts:
      hosts:
        n5p:
          ansible_host: 192.168.1.128
          ansible_port: 22
          ansible_user: ansible_user
          ansible_ssh_private_key_file: ~/.ssh/homelab_ansible
          proxmox_api_host: 192.168.1.128
          proxmox_api_port: 8006
          proxmox_api_user: root@pam

    # Virtual Machines
    truenas_hosts:
      hosts:
        tn-storage:
          # See host_vars/tn-storage.yml for detailed configuration

    docker_hosts:
      hosts:
        containers:
          ansible_host: 192.168.1.140  # Temporary (will migrate to 192.168.30.4)
          ansible_port: 22
          ansible_user: ubuntu  # Will provision ansible_user via common role
          ansible_ssh_private_key_file: ~/.ssh/homelab_ansible

        rpi4:
          ansible_host: 192.168.1.110  # Raspberry Pi 4 - Docker services + Secondary DNS
          ansible_port: 22
          ansible_user: luka  # Primary user on rpi4
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519  # Personal SSH key

    # Development VMs
    dev_hosts:
      hosts:
        dev:
          ansible_host: 192.168.1.148  # Temporary (will migrate to VLAN 20 once Omada router lands)
          ansible_port: 22
          ansible_user: ubuntu  # Cloud-init default user; common role provisions ansible_user + luka in parallel
          ansible_ssh_private_key_file: ~/.ssh/homelab_ansible

    # Home Assistant OS VM
    haos_hosts:
      hosts:
        haos:
          ansible_host: 192.168.1.144  # Temporary (will migrate to 192.168.30.7)
          # Note: HAOS does not have SSH enabled by default
          # SSH can be enabled via the "SSH & Web Terminal" add-on
          # For now, manage via web UI at http://192.168.1.144:8123

    # LXC Containers
    lxc_containers:
      hosts:
        immich:
          ansible_host: 192.168.1.141  # Temporary (will migrate to 192.168.30.8)
          ansible_port: 22
          ansible_user: root  # LXC containers use root initially
          ansible_ssh_private_key_file: ~/.ssh/homelab_ansible

        traefik:
          ansible_host: 192.168.1.142  # Temporary (will migrate to 192.168.60.2)
          ansible_port: 22
          ansible_user: root  # LXC containers use root initially
          ansible_ssh_private_key_file: ~/.ssh/homelab_ansible

        omada:
          ansible_host: 192.168.1.143  # Temporary (will migrate to 192.168.50.2)
          ansible_port: 22
          ansible_user: root  # LXC containers use root initially
          ansible_ssh_private_key_file: ~/.ssh/homelab_ansible

        adguard:
          ansible_host: 192.168.1.145  # Temporary (will migrate to 192.168.30.9)
          ansible_port: 22
          ansible_user: root  # LXC containers use root initially
          ansible_ssh_private_key_file: ~/.ssh/homelab_ansible

        monitoring:
          ansible_host: 192.168.1.146  # Temporary (will migrate to 192.168.30.10)
          ansible_port: 22
          ansible_user: root  # LXC containers use root initially
          ansible_ssh_private_key_file: ~/.ssh/homelab_ansible

        media:
          ansible_host: 192.168.1.147  # Temporary (will migrate to 192.168.30.11)
          ansible_port: 22
          ansible_user: root  # LXC containers use root initially
          ansible_ssh_private_key_file: ~/.ssh/homelab_ansible

        hermes:
          ansible_host: 192.168.1.149  # Temporary (will migrate to 192.168.30.12)
          ansible_port: 22
          ansible_user: root  # LXC containers use root initially
          ansible_ssh_private_key_file: ~/.ssh/homelab_ansible

        mattermost:
          ansible_host: 192.168.1.151  # Temporary (migrates to a Servers-VLAN IP later); .150 is TrueNAS
          ansible_port: 22
          ansible_user: root  # LXC containers use root initially
          ansible_ssh_private_key_file: ~/.ssh/homelab_ansible

    # Service-specific groups (hosts defined above, no connection vars repeated)
    hermes_hosts:
      hosts:
        hermes:

    media_hosts:
      hosts:
        media:

    arr_stack_hosts:
      hosts:
        containers:

    monitoring_hosts:
      hosts:
        monitoring:

    adguard_hosts:
      hosts:
        adguard:
        rpi4:

    # Group all Linux servers (for common role)
    linux_servers:
      children:
        proxmox_hosts:
        truenas_hosts:
        docker_hosts:
        lxc_containers:
        adguard_hosts:
        dev_hosts:

    # Hosts that can run monitoring agents (excludes appliances like TrueNAS/HAOS)
    monitoring_agents:
      children:
        proxmox_hosts:
        docker_hosts:
        lxc_containers:
        dev_hosts:

    # Hosts running a Docker engine that get the docker-socket-proxy + autoheal
    # (containers VM + rpi4, plus the Docker-based LXCs). Excludes omada (native
    # .deb), adguard (native binary), and hermes (local rootfs, no autoheal).
    docker_runtime_hosts:
      children:
        docker_hosts:  # containers, rpi4
      hosts:
        immich:
        monitoring:
        traefik:
        media:
        mattermost:
