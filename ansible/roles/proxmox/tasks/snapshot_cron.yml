---
# Weekly pre-upgrade VM snapshot cron.
#
# Snapshots every VM in group_vars/vms.yml that has snapshot_weekly: true.
# Retains the last 4 snapshots per VM (rolling window). Lives on the Proxmox
# host so it can call qm directly without SSH.
#
# group_vars/vms.yml isn't auto-loaded for proxmox_hosts (it's not a group
# var file that matches any group), so we include it explicitly here.

- name: Load VM declarations for the snapshot script template
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/group_vars/vms.yml"

- name: Deploy weekly snapshot script
  ansible.builtin.template:
    src: snapshot-vms.sh.j2
    dest: /usr/local/sbin/snapshot-vms.sh
    mode: '0755'
    owner: root
    group: root

- name: Schedule weekly snapshot cron (Sundays 02:00)
  ansible.builtin.cron:
    name: "Weekly Proxmox VM snapshots"
    user: root
    weekday: "0"
    hour: "2"
    minute: "0"
    job: "/usr/local/sbin/snapshot-vms.sh >> /var/log/snapshot-vms.log 2>&1"
    state: present
