---
# Proxmox system configuration tasks

- name: Enable 8021q module for VLAN support
  community.general.modprobe:
    name: 8021q
    state: present

- name: Ensure 8021q module loads on boot
  ansible.builtin.lineinfile:
    path: /etc/modules
    line: '8021q'
    create: true
    mode: '0644'

- name: Configure Proxmox subscription notice (remove nag for community)
  ansible.builtin.replace:
    path: /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
    regexp: "if \\(data\\.status !== 'Active'\\) \\{"
    replace: "if (false) {"
  notify: Restart pveproxy
  when: ansible_facts['distribution'] == 'Debian'
  failed_when: false  # file may be absent after PVE upgrades; nag-removal is best-effort
