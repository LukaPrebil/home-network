---
# Main tasks for proxmox role
# This role configures Proxmox network bridges, storage, and prepares for VM creation

- name: Import network configuration tasks
  ansible.builtin.import_tasks: network.yml
  tags: network

- name: Import storage configuration tasks
  ansible.builtin.import_tasks: storage.yml
  tags: storage

- name: Import system configuration tasks
  ansible.builtin.import_tasks: system.yml
  tags: system

- name: Include LXC loadavg bind-mount tasks
  ansible.builtin.include_tasks:
    file: lxc_loadavg.yml
    apply:
      tags:
        - lxc-loadavg
        - proxmox
  tags:
    - lxc-loadavg
    - proxmox

- name: Include weekly VM snapshot cron tasks
  ansible.builtin.include_tasks:
    file: snapshot_cron.yml
    apply:
      tags:
        - snapshot-cron
        - proxmox
  tags:
    - snapshot-cron
    - proxmox

- name: Include Wake-on-LAN arming tasks
  ansible.builtin.include_tasks:
    file: wol.yml
    apply:
      tags:
        - wol
        - proxmox
  tags:
    - wol
    - proxmox

- name: Include guest autostart reconciler tasks
  ansible.builtin.include_tasks:
    file: autostart_reconcile.yml
    apply:
      tags:
        - autostart-reconcile
        - proxmox
  tags:
    - autostart-reconcile
    - proxmox

- name: Include monitoring API token ACL tasks
  ansible.builtin.include_tasks:
    file: monitoring_acl.yml
    apply:
      tags:
        - monitoring-acl
        - proxmox
  tags:
    - monitoring-acl
    - proxmox
