---
# Handlers for proxmox role

- name: Restart networking
  ansible.builtin.debug:
    msg: |
      Network configuration changed. Manual restart required.
      Run: systemctl restart networking
      Or reboot the system for safety.

- name: Test DNS resolution
  ansible.builtin.command: host download.truenas.com
  register: proxmox_dns_test
  changed_when: false
  failed_when: false

- name: Restart pveproxy
  ansible.builtin.systemd:
    name: pveproxy
    state: restarted
