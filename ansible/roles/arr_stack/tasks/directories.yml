---
# Create directories for Arr Stack

- name: Create arr-stack compose directory
  ansible.builtin.file:
    path: "{{ arr_stack_compose_dir }}"
    state: directory
    mode: '0755'
  tags:
    - arr-stack
    - setup

- name: Create arr stack config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ arr_stack_prowlarr_config_dir }}"
    - "{{ arr_stack_sonarr_config_dir }}"
    - "{{ arr_stack_radarr_config_dir }}"
    - "{{ arr_stack_bazarr_config_dir }}"
    - "{{ arr_stack_qbittorrent_config_dir }}"
    - "{{ arr_stack_seerr_config_dir }}"
  tags:
    - arr-stack
    - setup

- name: Ensure media library directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ arr_stack_media_movies_dir }}"
    - "{{ arr_stack_media_tv_dir }}"
    - "{{ arr_stack_media_downloads_dir }}"
    - "{{ arr_stack_media_downloads_dir }}/movies"
    - "{{ arr_stack_media_downloads_dir }}/tv"
  tags:
    - arr-stack
    - setup
