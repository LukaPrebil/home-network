---
# Deploy Arr Stack

- name: Assert plex-bulk media path is an NFS mount
  ansible.builtin.include_role:
    name: common
    tasks_from: assert_nfs_mount
  vars:
    common_nfs_mount_path: "{{ arr_stack_media_dir }}"
  tags:
    - arr-stack
    - deploy

- name: Deploy arr-stack docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ arr_stack_compose_file }}"
    mode: '0644'
  tags:
    - arr-stack
    - deploy

- name: Start Arr Stack services
  community.docker.docker_compose_v2:
    project_src: "{{ arr_stack_compose_dir }}"
    state: present
  register: arr_stack_deploy
  tags:
    - arr-stack
    - deploy

- name: Wait for Arr Stack services to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ item.port }}{{ item.path }}"
    method: GET
    status_code: "{{ item.status }}"
  register: arr_stack_health
  until: arr_stack_health.status == item.status
  retries: 30
  delay: 5
  changed_when: false
  loop:
    - { name: prowlarr, port: "{{ arr_stack_prowlarr_port }}", path: /ping, status: 200 }
    - { name: sonarr, port: "{{ arr_stack_sonarr_port }}", path: /ping, status: 200 }
    - { name: radarr, port: "{{ arr_stack_radarr_port }}", path: /ping, status: 200 }
    - { name: bazarr, port: "{{ arr_stack_bazarr_port }}", path: /, status: 200 }
    - { name: qbittorrent, port: "{{ arr_stack_qbittorrent_port_web }}", path: /, status: 200 }
    - { name: flaresolverr, port: "{{ arr_stack_flaresolverr_port }}", path: /, status: 200 }
    - { name: seerr, port: "{{ arr_stack_seerr_port }}", path: /api/v1/status, status: 200 }
  loop_control:
    label: "{{ item.name }}"
  tags:
    - arr-stack
    - deploy

- name: Display Arr Stack deployment status
  ansible.builtin.debug:
    msg: |
      Arr Stack services {{ 'deployed' if arr_stack_deploy.changed else 'already running' }}:
      - Prowlarr: http://{{ ansible_host }}:{{ arr_stack_prowlarr_port }}
      - Sonarr: http://{{ ansible_host }}:{{ arr_stack_sonarr_port }}
      - Radarr: http://{{ ansible_host }}:{{ arr_stack_radarr_port }}
      - Bazarr: http://{{ ansible_host }}:{{ arr_stack_bazarr_port }}
      - qBittorrent: http://{{ ansible_host }}:{{ arr_stack_qbittorrent_port_web }}
      - Seerr: http://{{ ansible_host }}:{{ arr_stack_seerr_port }}
  tags:
    - arr-stack
    - deploy
