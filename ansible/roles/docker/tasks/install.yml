---
# Docker installation tasks

- name: Install prerequisites for Docker
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: Set Docker repository URL based on OS
  ansible.builtin.set_fact:
    docker_repo_url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}"
    docker_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

- name: Create directory for Docker GPG key
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

# apt reads the ASCII-armored key directly via signed-by, so there is no dearmor
# step and nothing lands in /tmp. The previous version downloaded to /tmp and
# deleted it again on every run, which made every converge of every Docker host
# report changed and hid real drift. Fetching straight to the final path also
# means a rotated upstream key is actually picked up - the dearmor it replaced
# was guarded by `creates` and would have kept serving the stale key forever.
- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: "{{ docker_repo_url }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

# apt_repository appends a new line rather than rewriting the matching one, so on
# a host provisioned before the .asc move the pre-existing docker.gpg line has to
# be retired explicitly. Leaving both means apt sees two Signed-By values for one
# source, refuses to read the source list at all, and every later apt task fails.
- name: Remove the superseded Docker repository entry
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.gpg] {{ docker_repo_url }} {{ ansible_distribution_release }} stable"
    filename: docker
    state: absent

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc] {{ docker_repo_url }} {{ ansible_distribution_release }} stable"
    filename: docker
    state: present

# Orphaned by the move to the .asc key above. Deleted only after the source list
# has stopped referring to it.
- name: Remove the superseded dearmored Docker GPG key
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.gpg
    state: absent

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  notify: Restart Docker

- name: Ensure Docker service is started and enabled
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Install Python Docker SDK and dependencies for Ansible modules
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-docker  # Docker SDK for Python (from Ubuntu repos)
      - python3-requests  # Required by community.docker modules
    state: present
    update_cache: true
