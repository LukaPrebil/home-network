---
# NFS mount configuration for Docker volumes
#
# For LXC containers: NFS is mounted on the Proxmox host and bind-mounted into the container
# For VMs/bare metal: NFS is mounted directly

- name: Check if running in LXC container
  ansible.builtin.stat:
    path: /proc/1/environ
  register: docker_proc_environ

- name: Detect LXC environment
  ansible.builtin.command: grep -q container=lxc /proc/1/environ
  register: docker_is_lxc
  failed_when: false
  changed_when: false
  when: docker_proc_environ.stat.exists

- name: Install NFS client packages (not needed for LXC with bind mounts)
  ansible.builtin.apt:
    name:
      - nfs-common
    state: present
  when: docker_is_lxc.rc | default(1) != 0

- name: Ensure Docker base directory exists
  ansible.builtin.file:
    path: "{{ docker_nfs_mount_point }}"
    state: directory
    mode: '0755'

- name: Mount TrueNAS NFS share for Docker volumes (VMs/bare metal only)
  ansible.posix.mount:
    path: "{{ docker_nfs_mount_point }}"
    src: "{{ truenas_nfs_server }}:{{ truenas_docker_volumes_share }}"
    fstype: nfs
    opts: "{{ docker_nfs_opts }}"
    state: mounted
  when: docker_is_lxc.rc | default(1) != 0  # Skip for LXC containers

- name: Assert Docker volumes path is an NFS mount
  ansible.builtin.include_role:
    name: common
    tasks_from: assert_nfs_mount
  vars:
    common_nfs_mount_path: "{{ docker_nfs_mount_point }}"
  when: docker_is_lxc.rc | default(1) != 0

- name: Verify storage is accessible
  ansible.builtin.command: df -h {{ docker_nfs_mount_point }}
  register: docker_nfs_df
  changed_when: false

- name: Display storage mount info
  ansible.builtin.debug:
    msg: "{{ docker_nfs_df.stdout_lines }}"

- name: Ensure docker.service drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: docker_is_lxc.rc | default(1) != 0

- name: Configure docker.service to wait for NFS mount and retry
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/wait-for-nfs.conf
    content: |
      # Managed by Ansible — ensure docker.service waits for the NFS mount
      # so containers never start against an empty local stub directory.
      #
      # We intentionally do NOT use RequiresMountsFor={{ docker_nfs_mount_point }}. That
      # forces a synchronous mount and — if the network isn't routable yet
      # after a power event — turns a transient mount failure into an
      # un-retryable "dependency failed", leaving Docker down until manual
      # intervention. Instead, ExecStartPre polls for the real NFS mount
      # (triggering the x-systemd.automount on each pass), and
      # Restart=on-failure retries when the poll window runs out.
      [Unit]
      After=network-online.target
      Wants=network-online.target

      [Service]
      ExecStartPre=/bin/sh -c 'for i in $(seq 1 24); do ls {{ docker_nfs_mount_point }} >/dev/null 2>&1 || true; findmnt -t nfs,nfs4 {{ docker_nfs_mount_point }} >/dev/null 2>&1 && exit 0; sleep 5; done; exit 1'
      Restart=on-failure
      RestartSec=30s
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd daemon
  when: docker_is_lxc.rc | default(1) != 0
