---
# NFS mount configuration for Docker volumes
#
# For LXC containers: NFS is mounted on the Proxmox host and bind-mounted into the container
# For VMs/bare metal: NFS is mounted directly

- name: Check if running in LXC container
  ansible.builtin.stat:
    path: /proc/1/environ
  register: docker_proc_environ

- name: Detect LXC environment
  ansible.builtin.command: grep -q container=lxc /proc/1/environ
  register: docker_is_lxc
  failed_when: false
  changed_when: false
  when: docker_proc_environ.stat.exists

- name: Install NFS client packages (not needed for LXC with bind mounts)
  ansible.builtin.apt:
    name:
      - nfs-common
    state: present
  when: docker_is_lxc.rc | default(1) != 0

- name: Ensure Docker base directory exists
  ansible.builtin.file:
    path: "{{ docker_nfs_mount_point }}"
    state: directory
    mode: '0755'

- name: Check if storage is already mounted
  ansible.builtin.command: mountpoint -q {{ docker_nfs_mount_point }}
  register: docker_nfs_mounted
  failed_when: false
  changed_when: false

- name: Mount TrueNAS NFS share for Docker volumes (VMs/bare metal only)
  ansible.posix.mount:
    path: "{{ docker_nfs_mount_point }}"
    src: "{{ truenas_nfs_server }}:{{ truenas_docker_volumes_share }}"
    fstype: nfs
    opts: defaults,nofail,_netdev
    state: mounted
  when:
    - docker_nfs_mounted.rc != 0
    - docker_is_lxc.rc | default(1) != 0  # Skip for LXC containers

- name: Verify storage is accessible
  ansible.builtin.command: df -h {{ docker_nfs_mount_point }}
  register: docker_nfs_df
  changed_when: false

- name: Display storage mount info
  ansible.builtin.debug:
    msg: "{{ docker_nfs_df.stdout_lines }}"
