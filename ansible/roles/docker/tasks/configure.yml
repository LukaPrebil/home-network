---
# Docker configuration tasks

- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  when: docker_users is defined and docker_users | length > 0

- name: Check if running in LXC container
  ansible.builtin.stat:
    path: /proc/1/environ
  register: docker_proc_environ

- name: Detect LXC environment
  ansible.builtin.command: grep -q container=lxc /proc/1/environ
  register: docker_is_lxc
  failed_when: false
  changed_when: false
  when: docker_proc_environ.stat.exists

# group root, not docker, and the distinction matters because this path is a
# shared NFS export. NFS carries ownership as raw numbers and each client resolves
# them through its own /etc/group, so `group: docker` wrote 986 from containers and
# 985 from rpi4, each reverting the other on every converge - and the same directory
# read back as libvirt-qemu on the storage server. GID 0 is root everywhere, so
# there is nothing left to disagree about. Nothing is lost: at 0755 the group bits
# already match other, every subdirectory here is owned root or 1000, and Docker
# runs as root regardless.
- name: Create Docker base directory (with ownership for VMs)
  ansible.builtin.file:
    path: "{{ docker_base_dir }}"
    state: directory
    mode: '0755'
    owner: root
    group: root
  when:
    - docker_nfs_volumes_enabled | bool
    - docker_is_lxc.rc | default(1) != 0

# Unprivileged LXCs cannot chown across their ID map - this path reads as
# nobody:nogroup inside them - so they assert the directory exists and nothing more.
- name: Ensure Docker base directory exists (without ownership for LXCs)
  ansible.builtin.file:
    path: "{{ docker_base_dir }}"
    state: directory
    mode: '0755'
  when:
    - docker_nfs_volumes_enabled | bool
    - docker_is_lxc.rc | default(1) == 0

- name: Configure Docker daemon
  ansible.builtin.copy:
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "data-root": "/var/lib/docker",
        "dns": {{ dns_servers | to_json }},
        "mtu": {{ docker_mtu }},
        "live-restore": {{ docker_live_restore | to_json }}
      }
    dest: /etc/docker/daemon.json
    mode: '0644'
  notify: Restart Docker

- name: Verify Docker installation
  ansible.builtin.command: docker --version
  register: docker_version
  changed_when: false

- name: Display Docker version
  ansible.builtin.debug:
    msg: "Docker installed: {{ docker_version.stdout }}"

# A host that stops backing /srv/docker with NFS (dev VM, traefik/media LXCs) sets
# docker_nfs_volumes_enabled=false, which skips nfs.yml entirely - so the drop-in
# nfs.yml installed earlier stays behind. It is not harmless: its ExecStartPre wants
# /srv/docker to be an nfs/nfs4 mount, and with Restart=on-failure and no start limit
# the unit retries forever, so doker sits in "activating (start-pre)" and any
# `systemctl restart docker` hangs instead of failing. That is what wedged the dev VM
# on 2026-10-22: docker-ce.postinst ran deb-systemd-invoke restart docker.service,
# systemd waited on a start that could never finish, and dpkg held the apt lock for
# 50 minutes with the package half-configured.
- name: Remove the wait-for-NFS drop-in on hosts without an NFS-backed docker volume
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d/wait-for-nfs.conf
    state: absent
  register: docker_wait_for_nfs_dropin
  when: not (docker_nfs_volumes_enabled | bool)

- name: Start Docker once the stale drop-in is gone
  ansible.builtin.systemd:
    name: docker
    state: restarted
    daemon_reload: true
  when:
    - not (docker_nfs_volumes_enabled | bool)
    - docker_wait_for_nfs_dropin is changed
