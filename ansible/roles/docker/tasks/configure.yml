---
# Docker configuration tasks

- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: yes
  loop: "{{ docker_users }}"
  when: docker_users is defined and docker_users | length > 0

- name: Check if running in LXC container
  ansible.builtin.stat:
    path: /proc/1/environ
  register: proc_environ

- name: Detect LXC environment
  ansible.builtin.shell: grep -q container=lxc /proc/1/environ
  register: is_lxc
  failed_when: false
  changed_when: false
  when: proc_environ.stat.exists

- name: Create Docker base directory (with ownership for VMs)
  ansible.builtin.file:
    path: "{{ docker_base_dir }}"
    state: directory
    mode: '0755'
    owner: root
    group: docker
  when: is_lxc.rc | default(1) != 0

- name: Ensure Docker base directory exists (without ownership for LXCs)
  ansible.builtin.file:
    path: "{{ docker_base_dir }}"
    state: directory
    mode: '0755'
  when: is_lxc.rc | default(1) == 0

- name: Configure Docker daemon
  ansible.builtin.copy:
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "data-root": "/var/lib/docker",
        "dns": {{ dns_servers | to_json }},
        "mtu": {{ docker_mtu }}
      }
    dest: /etc/docker/daemon.json
    mode: '0644'
  notify: Restart Docker

- name: Verify Docker installation
  ansible.builtin.command: docker --version
  register: docker_version
  changed_when: false

- name: Display Docker version
  ansible.builtin.debug:
    msg: "Docker installed: {{ docker_version.stdout }}"
