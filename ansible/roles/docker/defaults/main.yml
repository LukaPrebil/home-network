---
# Default variables for Docker role

# Docker installation
docker_apt_key_url: "https://download.docker.com/linux/ubuntu/gpg"
docker_apt_repository: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"

# Docker Compose
docker_compose_version: "v2.39.4"  # Latest as of Oct 2025
docker_compose_install_path: "/usr/local/bin/docker-compose"

# Docker service configuration
docker_users:
  - "{{ ansible_user }}"

# Directory structure
docker_base_dir: "/srv/docker"

# TrueNAS NFS mount for Docker volumes
truenas_nfs_server: "192.168.1.150"  # Temporary (will be 192.168.30.3)
truenas_docker_volumes_share: "/mnt/tank/docker-volumes"
docker_nfs_mount_point: "{{ docker_base_dir }}"
docker_nfs_mount_opts: "nfs defaults,nofail,_netdev 0 0"
