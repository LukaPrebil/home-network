---
# Default variables for Docker role

# Docker installation
docker_apt_key_url: "https://download.docker.com/linux/ubuntu/gpg"

# Docker service configuration
docker_users:
  - "{{ ansible_user }}"

# Directory structure
docker_base_dir: "/srv/docker"

# Network configuration
docker_mtu: 1492  # PPPoE max MTU - prevents fragmentation on 1Gb fiber

# Keep containers running across a dockerd restart/upgrade. Without this, any
# daemon.json change bounces every container - including OTBR, whose in-place
# restart triggers a D-Bus EMERG crash loop. The first restart that enables it
# still bounces (live-restore is not yet active during that restart), which is
# why activation is a maintenance-window event. Set false (-e docker_live_restore=false)
# to roll back.
docker_live_restore: true

docker_nfs_mount_point: "{{ docker_base_dir }}"
docker_nfs_opts: "{{ nfs_common_opts }}"

# Whether this host backs /srv/docker with the TrueNAS docker-volumes NFS share.
# True for the containers VM, rpi4, and the immich LXC (host-bind), which keep
# compose/service state there. Set false per-host for boxes whose state lives on
# local rootfs (dev VM, traefik/media LXCs) so the role neither mounts the prod
# share nor leaves an empty /srv/docker stub that would mask a missing mount.
docker_nfs_volumes_enabled: true

# Bind-mounted data paths that must be mounted before Docker starts.
#
# A container whose data path is an unmounted stub keeps running and writes to the
# VM disk: PDS did exactly that for three and a half days after a 2026-10-31 boot,
# health checks and all. Listing the path here renders a docker.service drop-in with
# RequiresMountsFor, so a failed mount stops Docker instead of letting the container
# start against the stub. It is a systemd dependency, not a retry loop, so it fails
# fast. Empty list = no drop-in.
docker_required_mounts: []
