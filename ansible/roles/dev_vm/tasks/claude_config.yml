---
# Clone the operator's Claude config repo into ~/code/<owner>/claude and
# recreate the symlink set under ~/.claude/ that mirrors the macOS workstation
# layout. The owner segment comes from dev_vm_claude_remote so that no
# particular GitHub account is baked into the role.

- name: Assert the Claude config repo owner is set
  ansible.builtin.assert:
    that:
      - dev_vm_claude_remote is defined
      - dev_vm_claude_remote | trim | length > 0
      - dev_vm_claude_remote != 'your-github-user'
      - "'/' not in dev_vm_claude_remote"
    fail_msg: >-
      dev_vm_claude_remote must name a single GitHub owner you control, and has
      no working default on purpose. The role symlinks hooks/, commands/ and
      settings.json out of that repo into ~/.claude, so whoever owns it can
      execute code on this box. Set it in host_vars/dev.yml.
    quiet: true

# dirname keeps the parent in lockstep with the clone destination; deriving it
# from dev_vm_user.home a second time lets the two drift apart silently.
- name: Ensure the Claude config repo parent directory exists
  ansible.builtin.file:
    path: "{{ dev_vm_claude_path | dirname }}"
    state: directory
    owner: "{{ dev_vm_user.name }}"
    group: "{{ dev_vm_user.name }}"
    mode: '0755'

- name: Clone the Claude config repo
  ansible.builtin.git:
    repo: "{{ dev_vm_claude_repo }}"
    dest: "{{ dev_vm_claude_path }}"
    version: "{{ dev_vm_claude_ref }}"
    update: true
    # NO accept_newhostkey - github.com is pinned in known_hosts via
    # ssh_key_github.yml. If that task hasn't run, this fails closed
    # rather than TOFU-accepting a possibly MITM'd key.
  become: true
  become_user: "{{ dev_vm_user.name }}"

- name: Ensure ~/.claude directory exists
  ansible.builtin.file:
    path: "{{ dev_vm_user.home }}/.claude"
    state: directory
    owner: "{{ dev_vm_user.name }}"
    group: "{{ dev_vm_user.name }}"
    mode: '0755'

- name: Validate every symlink source exists in the cloned repo
  ansible.builtin.stat:
    path: "{{ dev_vm_claude_path }}/{{ item.src }}"
  register: dev_vm_claude_symlink_src_stat
  loop: "{{ dev_vm_claude_symlinks }}"
  loop_control:
    label: "{{ item.name }}"

- name: Fail loudly if any expected symlink source is missing
  ansible.builtin.fail:
    msg: |
      Claude config symlink source missing in {{ dev_vm_claude_path }}:
      {{ item.item.src }} (referenced as {{ item.item.name }} in dev_vm_claude_symlinks).
      The upstream repo has likely restructured. Update host_vars/dev.yml.
  loop: "{{ dev_vm_claude_symlink_src_stat.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not item.stat.exists

- name: Create Claude config symlinks
  ansible.builtin.file:
    src: "{{ dev_vm_claude_path }}/{{ item.src }}"
    dest: "{{ dev_vm_user.home }}/.claude/{{ item.name }}"
    state: link
    force: true
    owner: "{{ dev_vm_user.name }}"
    group: "{{ dev_vm_user.name }}"
  loop: "{{ dev_vm_claude_symlinks }}"
  loop_control:
    label: "{{ item.name }}"
