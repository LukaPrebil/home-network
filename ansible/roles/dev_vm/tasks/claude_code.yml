---
# Claude Code via the official native installer. dev_vm_claude_code_version is
# a floor, not a freeze: the installer auto-updates in the background, and a
# version newer than the pin must survive convergence. Only a missing install,
# an unreadable version, or a version older than the pin re-installs.

- name: Check installed claude version
  ansible.builtin.command:
    cmd: "{{ dev_vm_user.home }}/.local/bin/claude --version"
  register: dev_vm_claude_installed
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ dev_vm_user.name }}"

- name: Record the installed claude version
  ansible.builtin.set_fact:
    dev_vm_claude_current: >-
      {{ dev_vm_claude_installed.stdout | default('')
         | regex_search('[0-9]+\.[0-9]+\.[0-9]+') | default('', true) }}

- name: Install Claude Code (floor {{ dev_vm_claude_code_version }})
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL https://claude.ai/install.sh | bash -s {{ dev_vm_claude_code_version }}
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ dev_vm_user.name }}"
  when: >
    dev_vm_claude_installed.rc != 0
    or dev_vm_claude_current | length == 0
    or dev_vm_claude_current is version(dev_vm_claude_code_version, '<')
  changed_when: true
