---
# Deploy Plex Media Server

- name: Create Docker network (if not using host mode)
  community.docker.docker_network:
    name: "{{ plex_docker_network }}"
    state: present
  when: plex_network != 'host'
  tags:
    - plex
    - deploy

- name: Deploy Plex docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ plex_compose_file }}"
    mode: '0644'
  notify: Restart Plex
  tags:
    - plex
    - deploy

- name: Start Plex Media Server
  community.docker.docker_compose_v2:
    project_src: "{{ plex_compose_dir }}"
    state: present
  register: plex_deploy
  tags:
    - plex
    - deploy

- name: Display Plex deployment status
  ansible.builtin.debug:
    msg: "Plex Media Server is {{ 'running' if plex_deploy.changed else 'already running' }} at http://{{ ansible_host }}:{{ plex_port }}/web"
  tags:
    - plex
    - deploy
