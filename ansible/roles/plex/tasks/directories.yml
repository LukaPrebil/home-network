---
# Create directories for Plex Media Server

- name: Create Plex compose directory
  ansible.builtin.file:
    path: "{{ plex_compose_dir }}"
    state: directory
    mode: '0755'
  tags:
    - plex
    - setup

- name: Create Plex config directory on Proxmox host (for unprivileged LXC)
  ansible.builtin.file:
    path: "/mnt/pve/plex-apps/plex"
    state: directory
    mode: '0777'
  delegate_to: "{{ groups['proxmox_hosts'][0] }}"
  when: inventory_hostname in groups.get('lxc_containers', [])
  tags:
    - plex
    - setup

- name: Create Plex media library directories on Proxmox host (for unprivileged LXC)
  ansible.builtin.file:
    path: "/mnt/pve/plex-bulk/{{ item }}"
    state: directory
    mode: '0777'
  loop:
    - movies
    - tv
    - downloads
    - downloads/movies
    - downloads/tv
  delegate_to: "{{ groups['proxmox_hosts'][0] }}"
  when: inventory_hostname in groups.get('lxc_containers', [])
  tags:
    - plex
    - setup

- name: Create Plex config directory locally (for VMs)
  ansible.builtin.file:
    path: "{{ plex_config_dir }}"
    state: directory
    mode: '0755'
  when: inventory_hostname not in groups.get('lxc_containers', [])
  tags:
    - plex
    - setup

- name: Create Plex media library directories locally (for VMs)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ plex_movies_dir }}"
    - "{{ plex_tv_dir }}"
    - "{{ plex_downloads_dir }}"
    - "{{ plex_downloads_dir }}/movies"
    - "{{ plex_downloads_dir }}/tv"
  when: inventory_hostname not in groups.get('lxc_containers', [])
  tags:
    - plex
    - setup
