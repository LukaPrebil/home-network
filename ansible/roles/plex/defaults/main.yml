---
# Plex Media Server role default variables

# Plex version
plex_version: "latest"  # Can pin to specific version if needed

# Base directories
plex_base_dir: "/mnt/plex-apps"  # NFS mount point for app configs
plex_media_dir: "/mnt/plex-bulk"  # NFS mount point for media library
plex_config_dir: "{{ plex_base_dir }}/plex"

# Docker Compose configuration
plex_compose_dir: "/opt/plex"
plex_compose_file: "{{ plex_compose_dir }}/docker-compose.yml"

# Plex configuration
plex_port: 32400  # Main Plex port
plex_network: "host"  # Use host networking for best compatibility

# Media library structure on plex-bulk
plex_movies_dir: "{{ plex_media_dir }}/movies"
plex_tv_dir: "{{ plex_media_dir }}/tv"
plex_downloads_dir: "{{ plex_media_dir }}/downloads"

# Docker network (if not using host mode)
plex_docker_network: "plex"

# GPU configuration
plex_gpu_vendor: "amd"  # amd, nvidia, or intel
plex_enable_gpu: true

# Timezone
plex_timezone: "{{ timezone | default('UTC') }}"

# Plex claim token (optional - for initial server claim)
# Get from: https://www.plex.tv/claim/
# plex_claim_token: "{{ vault_plex_claim_token | default('') }}"
