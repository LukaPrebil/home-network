---
# Main tasks file for Grafana Alloy role

- name: Create Alloy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ alloy_config_dir }}"
    - "{{ alloy_data_dir }}"
  tags:
    - alloy
    - monitoring
    - logging

- name: Install required packages
  ansible.builtin.apt:
    name:
      - unzip
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - alloy
    - monitoring
    - logging

- name: Check if Docker is installed
  ansible.builtin.command: which docker
  register: alloy_docker_check
  changed_when: false
  failed_when: false
  # Read-only probe: without this it is skipped during a dry run, rc defaults
  # truthy, and the config renders Docker log scraping on hosts with no Docker.
  check_mode: false
  tags:
    - alloy
    - monitoring
    - logging

- name: Set Docker installed fact
  ansible.builtin.set_fact:
    alloy_docker_installed: "{{ alloy_docker_check.rc == 0 }}"
  tags:
    - alloy
    - monitoring
    - logging

- name: Detect system architecture
  ansible.builtin.set_fact:
    alloy_arch: "{{ alloy_arch_map[ansible_architecture] | default('amd64') }}"
    alloy_binary_name: "alloy-linux-{{ alloy_arch_map[ansible_architecture] | default('amd64') }}"
  tags:
    - alloy
    - monitoring
    - logging

- name: Set Alloy binary URL
  ansible.builtin.set_fact:
    alloy_binary_url: "https://github.com/grafana/alloy/releases/download/v{{ alloy_version }}/{{ alloy_binary_name }}.zip"
  tags:
    - alloy
    - monitoring
    - logging

- name: Check installed Alloy version
  ansible.builtin.command: "{{ alloy_install_dir }}/alloy --version"
  register: alloy_installed_version
  changed_when: false
  failed_when: false
  # Read-only probe: run it under --check too, otherwise alloy_needs_upgrade is
  # spuriously true (skipped command -> empty rc) and the staging/download tasks
  # fire against a dir check mode never created, failing the whole --check run.
  check_mode: false
  tags:
    - alloy
    - monitoring
    - logging

- name: Determine if Alloy upgrade is needed
  ansible.builtin.set_fact:
    alloy_needs_upgrade: "{{ alloy_installed_version.rc != 0 or ('v' + alloy_version) not in (alloy_installed_version.stdout | default('')) }}"
  tags:
    - alloy
    - monitoring
    - logging

# Download the new binary into a version-scoped staging dir while the current
# Alloy keeps running. Only after it is on disk do we stop + swap, so a failed
# or partial download can never leave the host with no Alloy binary.
- name: Create Alloy upgrade staging directory
  ansible.builtin.file:
    path: "{{ alloy_stage_dir }}"
    state: directory
    mode: '0755'
  when: alloy_needs_upgrade | bool
  tags:
    - alloy
    - monitoring
    - logging

- name: Download new Alloy binary to staging
  ansible.builtin.unarchive:
    src: "{{ alloy_binary_url }}"
    dest: "{{ alloy_stage_dir }}"
    remote_src: true
    creates: "{{ alloy_stage_dir }}/{{ alloy_binary_name }}"
  # Check mode never creates the staging dir above, so the download and the
  # swap that reads from it cannot be dry-run - they fail on a version bump.
  when:
    - alloy_needs_upgrade | bool
    - not ansible_check_mode
  tags:
    - alloy
    - monitoring
    - logging

- name: Stop Alloy service before swapping the binary
  ansible.builtin.systemd:
    name: alloy
    state: stopped
  when: alloy_needs_upgrade | bool
  failed_when: false
  tags:
    - alloy
    - monitoring
    - logging

- name: Swap the staged Alloy binary into place
  ansible.builtin.copy:
    src: "{{ alloy_stage_dir }}/{{ alloy_binary_name }}"
    dest: "{{ alloy_install_dir }}/{{ alloy_binary_name }}"
    remote_src: true
    mode: '0755'
  when:
    - alloy_needs_upgrade | bool
    - not ansible_check_mode
  notify: Restart Alloy
  tags:
    - alloy
    - monitoring
    - logging

- name: Remove the Alloy upgrade staging directory
  ansible.builtin.file:
    path: "{{ alloy_stage_dir }}"
    state: absent
  when: alloy_needs_upgrade | bool
  tags:
    - alloy
    - monitoring
    - logging

- name: Create Alloy symlink
  ansible.builtin.file:
    src: "{{ alloy_install_dir }}/{{ alloy_binary_name }}"
    dest: "{{ alloy_install_dir }}/alloy"
    state: link
  tags:
    - alloy
    - monitoring
    - logging

- name: Deploy Alloy configuration
  ansible.builtin.template:
    src: config.alloy.j2
    dest: "{{ alloy_config_dir }}/config.alloy"
    owner: root
    group: root
    mode: '0644'
  notify: Restart Alloy
  tags:
    - alloy
    - monitoring
    - logging
    - config

- name: Deploy Alloy systemd service
  ansible.builtin.template:
    src: alloy.service.j2
    dest: /etc/systemd/system/alloy.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart Alloy
  tags:
    - alloy
    - monitoring
    - logging

- name: Enable and start Alloy service
  ansible.builtin.systemd:
    name: alloy
    enabled: true
    state: started
    daemon_reload: true
  tags:
    - alloy
    - monitoring
    - logging

# Both checks below have to run against the process the new config produced, and
# the config task notifies a restart handler that would otherwise fire at end of play.
- name: Flush handlers so a config change restarts Alloy before the checks below
  ansible.builtin.meta: flush_handlers

- name: Check Alloy is responding
  ansible.builtin.uri:
    url: "http://localhost:{{ alloy_listen_port }}/ready"
    method: GET
    status_code: 200
  register: alloy_health
  until: alloy_health.status == 200
  retries: 5
  delay: 2
  changed_when: false
  tags:
    - alloy
    - monitoring
    - logging
    - healthcheck

# /ready answers 200 while a source ships nothing: an empty target list is a valid
# config, so the component reports healthy and the alerts reading its stream just
# stay quiet. That is how n5p and rpi4 went a full retention window unnoticed.
# Assert on throughput instead of liveness - the counter must exist and be non-zero.
- name: Verify Alloy is actually shipping host logs from the journal
  ansible.builtin.uri:
    url: "http://localhost:{{ alloy_listen_port }}/metrics"
    method: GET
    return_content: true
  register: alloy_journal_metrics
  until: alloy_journal_metrics.content is search('loki_source_journal_target_lines_total\S*\s+[1-9]')
  retries: 12
  delay: 5
  changed_when: false
  tags:
    - alloy
    - monitoring
    - logging
    - healthcheck
