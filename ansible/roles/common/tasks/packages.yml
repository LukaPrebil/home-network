---
# Package installation tasks

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  when: ansible_os_family == "Debian"

- name: Check if zsh is installed
  ansible.builtin.command: which zsh
  register: common_zsh_installed
  changed_when: false
  failed_when: false
  when:
    - admin_users is defined
    - "'proxmox_hosts' not in group_names"

- name: Install zsh
  ansible.builtin.apt:
    name: zsh
    state: present
  when:
    - ansible_os_family == "Debian"
    - common_zsh_installed is defined
    - common_zsh_installed.rc is defined
    - common_zsh_installed.rc != 0
    - admin_users is defined
    - "'proxmox_hosts' not in group_names"

- name: Check if oh-my-zsh is installed for users with zsh
  ansible.builtin.stat:
    path: "/home/{{ item.name }}/.oh-my-zsh"
  register: common_ohmyzsh_stat
  loop: "{{ admin_users | default([]) }}"
  when:
    - common_install_oh_my_zsh | bool
    - admin_users is defined
    - item.shell == "/usr/bin/zsh"
    - "'proxmox_hosts' not in group_names"

- name: Install oh-my-zsh for users with zsh shell
  ansible.builtin.shell: |
    su - {{ item.item.name }} -c 'sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended'
  when:
    - common_install_oh_my_zsh | bool
    - admin_users is defined
    - item.item.shell == "/usr/bin/zsh"
    - not item.stat.exists
    - "'proxmox_hosts' not in group_names"
  loop: "{{ common_ohmyzsh_stat.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  changed_when: true
