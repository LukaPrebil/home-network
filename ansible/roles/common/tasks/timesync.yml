---
# Managed NTP via chrony on chrony_hosts (n5p, containers, rpi4, dev).
#
# matter-server on rpi4 pushes the host clock to Matter devices unguarded, so
# clock discipline there must be asserted in IaC. chrony combines several
# sources and can outvote a bad one, which systemd-timesyncd cannot.
#
# Guarded by group membership only: narrow --tags runs gather no facts, so an
# ansible_os_family condition would hit an undefined variable.

- name: Install chrony
  ansible.builtin.apt:
    name: chrony
    state: present
  when:
    - "'chrony_hosts' in group_names"

- name: Remove systemd-timesyncd
  ansible.builtin.apt:
    name: systemd-timesyncd
    state: absent
  when:
    - "'chrony_hosts' in group_names"

- name: Remove the stale timesyncd drop-in
  ansible.builtin.file:
    path: /etc/systemd/timesyncd.conf.d/10-ansible.conf
    state: absent
  when:
    - "'chrony_hosts' in group_names"

# In check mode chrony is not installed yet on hosts that ran timesyncd, so
# the config and service tasks below would fail against a missing /etc/chrony.
- name: Check for the chrony config directory
  ansible.builtin.stat:
    path: /etc/chrony
  register: common_chrony_dir
  check_mode: false
  changed_when: false
  when:
    - "'chrony_hosts' in group_names"

- name: Configure chrony time sources
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    mode: '0644'
    backup: true
  notify: Restart chrony
  when:
    - "'chrony_hosts' in group_names"
    - not ansible_check_mode or common_chrony_dir.stat.exists

- name: Enable and start chrony
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started
  when:
    - "'chrony_hosts' in group_names"
    - not ansible_check_mode or common_chrony_dir.stat.exists

- name: Apply the chrony restart before verifying sync
  ansible.builtin.meta: flush_handlers

- name: Verify NTP synchronization is active
  ansible.builtin.command: timedatectl show -p NTPSynchronized --value
  register: common_ntp_sync_check
  until: common_ntp_sync_check.stdout == "yes"
  retries: 24
  delay: 5
  changed_when: false
  check_mode: false
  when:
    - "'chrony_hosts' in group_names"
