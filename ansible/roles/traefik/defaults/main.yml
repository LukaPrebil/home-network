---
# Traefik role default variables

# Traefik version
traefik_version: "v3.7.11"

# Traefik directories
traefik_base_dir: "/opt/traefik"
traefik_config_dir: "{{ traefik_base_dir }}/config"
# traefik_acme_dir: "{{ traefik_base_dir }}/acme"  # Deprecated - no longer needed

# Docker Compose configuration
traefik_compose_file: "{{ traefik_base_dir }}/docker-compose.yml"

# Traefik configuration
traefik_log_level: "INFO"  # DEBUG, INFO, WARN, ERROR, FATAL, PANIC
traefik_access_logs: true

# Entry points
traefik_http_port: 80
traefik_https_port: 443
traefik_dashboard_port: 8080
traefik_metrics_port: 8082  # Prometheus metrics endpoint

# Dashboard configuration
traefik_dashboard_enabled: true
traefik_dashboard_insecure: true  # Safe for homelab on private network

# ACME/Let's Encrypt configuration
traefik_acme_enabled: false  # Enable in host_vars when ready for production
traefik_acme_email: ""  # MUST be set in host_vars when acme_enabled is true
traefik_acme_ca_server: "https://acme-v02.api.letsencrypt.org/directory"
traefik_acme_storage: "{{ traefik_base_dir }}/acme.json"

# Docker provider configuration
traefik_docker_provider_enabled: true
traefik_docker_exposed_by_default: false  # Require explicit labels
traefik_docker_network: "traefik"

# File provider for static configuration
traefik_file_provider_enabled: true
traefik_file_provider_directory: "{{ traefik_config_dir }}/dynamic"
traefik_file_provider_watch: true

# HTTP/3 (QUIC) configuration
traefik_http3_enabled: true
traefik_http3_advertised_port: 443

# Metrics configuration
traefik_metrics_enabled: true
traefik_metrics_prometheus: true
traefik_metrics_add_entrypoints_labels: true
traefik_metrics_add_routers_labels: false  # Can be verbose, enable if needed
traefik_metrics_add_services_labels: true

# Cloudflare real IP plugin (traefik-warp)
traefik_cloudflare_real_ip_enabled: false  # Enable in host_vars for Cloudflare-proxied setups
traefik_warp_version: "v1.1.5"

# Pinned Cloudflare edge ranges (https://www.cloudflare.com/ips-v4 and /ips-v6).
# Empty by default: a host enabling traefik_cloudflare_real_ip_enabled must pin
# the current ranges in host_vars - the drift check in tasks/config.yml fails
# the converge when a reachable official list differs from the pinned one.
# Never set these from a fetched response; they are repository variables.
traefik_cloudflare_ipv4_ranges: []
traefik_cloudflare_ipv6_ranges: []

# Home Assistant login-flow rate limit. Defaults to disabled: a normal HA
# browser load consumes nearly the whole 100/minute shared limiter, so HA has
# NO route-wide limiter and only login-flow POSTs may be limited. The limiter
# keys on X-Real-Ip, which is the verified visitor IP on the Cloudflare path
# and the direct socket address everywhere else.
traefik_ha_login_rate_limit_enabled: false
traefik_ha_login_rate_limit_average: 10
traefik_ha_login_rate_limit_period: "1m"
traefik_ha_login_rate_limit_burst: 30

# CrowdSec bouncer plugin
traefik_crowdsec_enabled: false  # Enable in host_vars alongside CrowdSec role
traefik_crowdsec_bouncer_version: "v1.7.1"
traefik_crowdsec_bouncer_key: ""  # Set in host_vars, vault-encrypted

# Logs directory (used when CrowdSec is enabled for shared access log volume)
traefik_logs_dir: "{{ traefik_base_dir }}/logs"
