---
# Deploy configuration files for monitoring stack

- name: Deploy Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    mode: '0644'
  notify: Restart Monitoring Stack
  tags:
    - monitoring-stack
    - config
    - prometheus

- name: Deploy Loki configuration
  ansible.builtin.template:
    src: loki-config.yml.j2
    dest: "{{ loki_config_dir }}/loki-config.yml"
    mode: '0644'
  notify: Restart Monitoring Stack
  tags:
    - monitoring-stack
    - config
    - loki

- name: Deploy Grafana datasource provisioning
  ansible.builtin.template:
    src: grafana-datasources.yml.j2
    dest: "{{ grafana_data_dir }}/provisioning/datasources/datasources.yml"
    mode: '0644'
  notify: Restart Monitoring Stack
  tags:
    - monitoring-stack
    - config
    - grafana

- name: Deploy Grafana dashboard provisioning
  ansible.builtin.template:
    src: grafana-dashboards.yml.j2
    dest: "{{ grafana_data_dir }}/provisioning/dashboards/dashboards.yml"
    mode: '0644'
  notify: Restart Monitoring Stack
  tags:
    - monitoring-stack
    - config
    - grafana

- name: Deploy Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ monitoring_compose_file }}"
    mode: '0644'
  notify: Restart Monitoring Stack
  tags:
    - monitoring-stack
    - config
