---
# AdGuard Home role defaults

# Installation
adguard_version: "v0.107.74"
adguard_install_dir: "/opt/adguardhome"
adguard_work_dir: "/var/lib/adguardhome"
adguard_config_dir: "/etc/adguardhome"

# Maps Ansible's reported CPU architecture to the AdGuard release asset suffix.
# The native install runs on both amd64 (adguard LXC) and arm64 (rpi4 secondary);
# an unmapped arch fails loudly in native.yml rather than fetching the wrong binary.
adguard_arch_map:
  x86_64: amd64
  aarch64: arm64
  armv7l: armv7
  armv6l: armv6

# One-time teardown of a pre-existing AdGuard Docker deployment before the native
# service binds port 53. Set true only on a host migrating Docker -> native (rpi4).
adguard_migrate_from_docker: false

# Network configuration
adguard_bind_host: "0.0.0.0"
adguard_bind_port: 3000  # Web UI port
adguard_dns_port: 53  # DNS port

# Upstream DNS servers (encrypted)
adguard_upstream_dns:
  - "https://dns.cloudflare.com/dns-query"
  - "https://dns10.quad9.net/dns-query"

# Bootstrap DNS (plain DNS used to resolve DoH/DoT hostnames)
adguard_bootstrap_dns:
  - "1.1.1.1"
  - "1.0.0.1"

# Fallback DNS (encrypted, used if primary upstreams fail)
adguard_fallback_dns:
  - "https://dns10.quad9.net/dns-query"
  - "tls://1.1.1.1"
  - "tls://1.0.0.1"

# HTTP session
adguard_session_ttl: "720h"

# Query log
adguard_querylog_enabled: true
adguard_querylog_interval: "2160h"  # 90 days
adguard_querylog_anonymize_client_ip: false

# Statistics
adguard_statistics_interval: "720h"  # 30 days

# DNS settings
adguard_dnssec_enabled: true
adguard_cache_optimistic: true
adguard_use_private_ptr_resolvers: true

# Filtering
adguard_filtering_enabled: true
adguard_safebrowsing_enabled: true
adguard_parental_enabled: false
adguard_safesearch_enabled: false

# Filter lists
adguard_filters:
  - enabled: true
    url: "https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt"
    name: "AdGuard DNS filter"
    id: 1
  - enabled: true
    url: "https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt"
    name: "AdAway Default Blocklist"
    id: 2
  - enabled: true
    url: "https://adguardteam.github.io/HostlistsRegistry/assets/filter_59.txt"
    name: "AdGuard DNS Popup Hosts filter"
    id: 1767521884

# User-defined filtering rules
adguard_user_rules:
  - "@@||stats.grafana.org^$important"

# DHCP (disabled - router handles DHCP)
adguard_dhcp_enabled: false

# Rate limiting
adguard_ratelimit: 20  # requests per second per client

# Service management
adguard_service_enabled: true
adguard_service_state: started

# Deployment method: 'native' or 'docker'
adguard_deployment_method: "native"

# Docker-specific configuration (when deployment_method is 'docker')
adguard_docker_dir: "/srv/docker/adguard"
adguard_docker_image: "adguard/adguardhome"
adguard_docker_image_tag: "{{ adguard_version }}"
adguard_docker_container_name: "adguard"
adguard_docker_network: "adguard"
adguard_docker_hostname: "adguard"

# DNS Rewrites - Local hostname to IP mappings
# These provide convenient hostnames for all devices on the network
adguard_dns_rewrites:
  # Infrastructure. IPs derive from inventory hostvars so a host's address is
  # declared in exactly one place (the inventory). gateway.lan is the only
  # literal - the router is not an inventory-managed host.
  - domain: "n5p.lan"
    answer: "{{ hostvars['n5p']['ansible_host'] }}"
  - domain: "gateway.lan"
    answer: "192.168.1.1"

  # Storage & VMs
  - domain: "truenas.lan"
    answer: "{{ hostvars['tn-storage']['ansible_host'] }}"
  - domain: "tn-storage.lan"
    answer: "{{ hostvars['tn-storage']['ansible_host'] }}"
  - domain: "containers.lan"
    answer: "{{ hostvars['containers']['ansible_host'] }}"

  # Services
  - domain: "haos.lan"
    answer: "{{ hostvars['haos']['ansible_host'] }}"
  - domain: "homeassistant.lan"
    answer: "{{ hostvars['haos']['ansible_host'] }}"
  - domain: "immich.lan"
    answer: "{{ hostvars['immich']['ansible_host'] }}"
  - domain: "photos.lan"
    answer: "{{ hostvars['immich']['ansible_host'] }}"
  - domain: "traefik.lan"
    answer: "{{ hostvars['traefik']['ansible_host'] }}"
  - domain: "omada.lan"
    answer: "{{ hostvars['omada']['ansible_host'] }}"

  # DNS Servers
  - domain: "adguard.lan"
    answer: "{{ hostvars['adguard']['ansible_host'] }}"
  - domain: "adguard-primary.lan"
    answer: "{{ hostvars['adguard']['ansible_host'] }}"
  - domain: "adguard-secondary.lan"
    answer: "{{ hostvars['rpi4']['ansible_host'] }}"
  - domain: "dns1.lan"
    answer: "{{ hostvars['adguard']['ansible_host'] }}"
  - domain: "dns2.lan"
    answer: "{{ hostvars['rpi4']['ansible_host'] }}"

  # Raspberry Pis
  - domain: "rpi4.lan"
    answer: "{{ hostvars['rpi4']['ansible_host'] }}"

  # Public domain local overrides (split-DNS for internal access).
  # All *.lukapg.dev names answer with Traefik's LAN IP (192.168.1.142):
  # Traefik terminates TLS with the wildcard cert, then reverse-proxies to
  # the right backend by Host header. Pointing rewrites directly at backend
  # IPs (HAOS, Plex, etc.) only worked when those backends speak HTTPS on
  # 443 with a cert that matches the SNI - none of ours do, so LAN-direct
  # access broke. This routes LAN clients through the same Traefik that
  # serves WAN clients (via Cloudflare port-forward), so cert + auth + auth
  # middleware are uniform on both paths.
  #
  # Two flavours coexist here:
  #   - Public *.lukapg.dev (Cloudflare A record exists, WAN-reachable
  #     via CF proxy):  ha, photos, grafana, jellyfin, kuma, status, documents.
  #   - Internal-only *.lukapg.dev (no Cloudflare A record, NXDOMAIN
  #     externally; Traefik enforces a LAN+tailnet ipAllowList on the
  #     route): n5p, tn, omada, adguard.
  # Every entry answers with Traefik's LAN IP (derived from inventory hostvars).
  - domain: "jellyfin.lukapg.dev"
    answer: "{{ hostvars['traefik']['ansible_host'] }}"
  - domain: "ha.lukapg.dev"
    answer: "{{ hostvars['traefik']['ansible_host'] }}"
  - domain: "photos.lukapg.dev"
    answer: "{{ hostvars['traefik']['ansible_host'] }}"
  - domain: "grafana.lukapg.dev"
    answer: "{{ hostvars['traefik']['ansible_host'] }}"
  - domain: "kuma.lukapg.dev"
    answer: "{{ hostvars['traefik']['ansible_host'] }}"
  - domain: "status.lukapg.dev"
    answer: "{{ hostvars['traefik']['ansible_host'] }}"
  - domain: "documents.lukapg.dev"
    answer: "{{ hostvars['traefik']['ansible_host'] }}"

  # Internal-only services (no public Cloudflare DNS, lan-only middleware
  # at Traefik). See ansible/roles/traefik/templates/dynamic.yml.j2 for
  # the matching routers.
  - domain: "n5p.lukapg.dev"
    answer: "{{ hostvars['traefik']['ansible_host'] }}"
  - domain: "tn.lukapg.dev"
    answer: "{{ hostvars['traefik']['ansible_host'] }}"
  - domain: "omada.lukapg.dev"
    answer: "{{ hostvars['traefik']['ansible_host'] }}"
  - domain: "adguard.lukapg.dev"
    answer: "{{ hostvars['traefik']['ansible_host'] }}"
