---
# AdGuard Home Docker deployment (for rpi4 and other Docker hosts)

- name: Install apache2-utils for htpasswd
  ansible.builtin.apt:
    name: apache2-utils
    state: present
    update_cache: yes
  when: vault_adguard_username is defined and vault_adguard_password is defined

- name: Generate bcrypt hash for AdGuard password using htpasswd
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      htpasswd -nbB -C 10 '{{ vault_adguard_username }}' '{{ vault_adguard_password }}' | cut -d: -f2
    executable: /bin/bash
  register: adguard_password_hash
  changed_when: false
  no_log: true
  when: vault_adguard_username is defined and vault_adguard_password is defined

- name: Create AdGuard Docker directory
  ansible.builtin.file:
    path: "{{ adguard_docker_dir }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - work
    - conf

- name: Create AdGuard docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ adguard_docker_dir }}/docker-compose.yml"
    mode: '0644'

- name: Check if AdGuard container is running
  community.docker.docker_container_info:
    name: "{{ adguard_docker_container_name }}"
  register: adguard_container_info
  ignore_errors: true

- name: Stop AdGuard Home container if running (to update config)
  community.docker.docker_compose_v2:
    project_src: "{{ adguard_docker_dir }}"
    state: stopped
  when: adguard_container_info.exists | default(false)

- name: Create AdGuard configuration file
  ansible.builtin.template:
    src: AdGuardHome.yaml.j2
    dest: "{{ adguard_docker_dir }}/conf/AdGuardHome.yaml"
    mode: '0644'

- name: Start AdGuard Home container
  community.docker.docker_compose_v2:
    project_src: "{{ adguard_docker_dir }}"
    state: present

- name: Wait for AdGuard Home to be ready
  ansible.builtin.wait_for:
    port: "{{ adguard_bind_port }}"
    delay: 5
    timeout: 60
