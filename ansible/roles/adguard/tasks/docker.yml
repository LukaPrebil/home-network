---
# AdGuard Home Docker deployment (for rpi4 and other Docker hosts)

- name: Create AdGuard Docker directory
  ansible.builtin.file:
    path: "{{ adguard_docker_dir }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - work
    - conf

- name: Create AdGuard docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ adguard_docker_dir }}/docker-compose.yml"
    mode: '0644'

- name: Create AdGuard configuration file
  ansible.builtin.template:
    src: AdGuardHome.yaml.j2
    dest: "{{ adguard_docker_dir }}/conf/AdGuardHome.yaml"
    mode: '0644'

- name: Create Docker network
  community.docker.docker_network:
    name: "{{ adguard_docker_network }}"
    state: present

- name: Start AdGuard Home container
  community.docker.docker_compose_v2:
    project_src: "{{ adguard_docker_dir }}"
    state: present

- name: Wait for AdGuard Home to be ready
  ansible.builtin.wait_for:
    port: "{{ adguard_bind_port }}"
    delay: 5
    timeout: 60
