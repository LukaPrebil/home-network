---
# AdGuard Home native installation (for LXC/bare metal)

- name: Assert AdGuard admin credentials are present in vault
  ansible.builtin.assert:
    that:
      - vault_adguard_username is defined
      - vault_adguard_username | length > 0
      - vault_adguard_password is defined
      - vault_adguard_password | length > 0
    fail_msg: >-
      vault_adguard_username and vault_adguard_password must be defined and
      non-empty in group_vars/all/secrets.sops.yml. Refusing to deploy: without
      them the AdGuard config would render with no admin users
      (unauthenticated admin UI).
    quiet: true

- name: Resolve AdGuard release architecture from the host CPU
  ansible.builtin.set_fact:
    adguard_arch: "{{ adguard_arch_map[ansible_architecture] | default('') }}"

- name: Fail fast on an unmapped CPU architecture
  ansible.builtin.assert:
    that:
      - adguard_arch | length > 0
    fail_msg: >-
      ansible_architecture '{{ ansible_architecture }}' has no entry in
      adguard_arch_map. Add it before deploying, or the wrong binary would be
      downloaded.
    quiet: true

- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
    state: present
    update_cache: true

# systemd-resolved owns :53 on the adguard LXC (Ubuntu) but is absent on rpi4
# (Raspberry Pi OS), where the Docker container held the port instead. Guard the
# stop+mask on the unit actually existing so the native path works on both.
- name: Gather installed service units
  ansible.builtin.service_facts:

- name: Stop and mask systemd-resolved where it exists (frees port 53)
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    masked: true
  when: "'systemd-resolved.service' in ansible_facts.services"

# NetworkManager owns /etc/resolv.conf on rpi4 (Debian trixie) and rewrites it
# with the router's address on every reboot, which points this resolver at a
# router that forwards straight back to AdGuard. dns=none makes NM leave the
# file alone so the static copy below survives a reboot. Skipped where
# NetworkManager is not installed (the adguard LXC).
- name: Stop NetworkManager from managing resolv.conf
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/99-adguard-dns.conf
    content: |
      # Managed by Ansible - do not edit manually
      [main]
      dns=none
    mode: '0644'
  when: "'NetworkManager.service' in ansible_facts.services"
  notify: Reload NetworkManager

# The reload has to land before resolv.conf is written, so the converge that
# first adds the drop-in cannot race NM into rewriting the file it just placed.
- name: Flush handlers so NetworkManager releases resolv.conf before it is written
  ansible.builtin.meta: flush_handlers

- name: Check whether resolv.conf is a symlink
  ansible.builtin.stat:
    path: /etc/resolv.conf
  register: adguard_resolv_conf_stat

# Remove only a symlink (e.g. systemd-resolved's stub link) so the copy below
# writes a real file. A regular file is left in place so the copy is idempotent
# instead of delete-and-recreate bouncing 'changed' on every converge.
- name: Remove the resolv.conf symlink if present
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent
  when: adguard_resolv_conf_stat.stat.islnk | default(false)

- name: Create static resolv.conf for AdGuard
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      # Static DNS configuration for AdGuard Home
      nameserver 1.1.1.1
      nameserver 1.0.0.1
    mode: '0644'

- name: Create AdGuard directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ adguard_install_dir }}"
    - "{{ adguard_work_dir }}"
    - "{{ adguard_config_dir }}"

- name: Check if AdGuard Home is already installed
  ansible.builtin.stat:
    path: "{{ adguard_install_dir }}/AdGuardHome"
  register: adguard_binary

- name: Check installed AdGuard Home version
  ansible.builtin.command:
    cmd: "{{ adguard_install_dir }}/AdGuardHome --version"
  register: adguard_installed_version
  changed_when: false
  # Read-only probe: run under --check too, otherwise adguard_needs_install is
  # spuriously true (skipped command) and the download/extract tasks fire against
  # a /tmp tarball check mode never fetched, failing the --check run.
  check_mode: false
  when: adguard_binary.stat.exists

- name: Determine if install or upgrade is needed
  ansible.builtin.set_fact:
    adguard_needs_install: "{{ not adguard_binary.stat.exists or adguard_version not in (adguard_installed_version.stdout | default('')) }}"

# Download + extract to /tmp while the current binary keeps answering DNS, then
# swap it in with an atomic copy (a running binary is replaced by rename, not
# truncated) and let the restart handler do the cutover. We deliberately do NOT
# stop the service before downloading: a failed download would otherwise leave
# this DNS instance down until the next successful run.
- name: Download AdGuard Home
  ansible.builtin.get_url:
    url: "https://github.com/AdguardTeam/AdGuardHome/releases/download/{{ adguard_version }}/AdGuardHome_linux_{{ adguard_arch }}.tar.gz"
    dest: "/tmp/adguardhome.tar.gz"
    mode: '0644'
  when: adguard_needs_install

- name: Extract AdGuard Home
  ansible.builtin.unarchive:
    src: "/tmp/adguardhome.tar.gz"
    dest: "/tmp"
    remote_src: true
  when: adguard_needs_install

- name: Move AdGuard Home binary to install directory
  ansible.builtin.copy:
    src: "/tmp/AdGuardHome/AdGuardHome"
    dest: "{{ adguard_install_dir }}/AdGuardHome"
    mode: '0755'
    remote_src: true
  when: adguard_needs_install
  notify: Restart AdGuard Home

- name: Clean up downloaded files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/adguardhome.tar.gz"
    - "/tmp/AdGuardHome"
  when: adguard_needs_install

- name: Install apache2-utils for htpasswd
  ansible.builtin.apt:
    name: apache2-utils
    state: present
    update_cache: true

- name: Check for a previously deployed AdGuard configuration
  ansible.builtin.stat:
    path: "{{ adguard_work_dir }}/AdGuardHome.yaml"
  register: adguard_deployed_config_stat

- name: Read deployed AdGuard configuration
  ansible.builtin.slurp:
    src: "{{ adguard_work_dir }}/AdGuardHome.yaml"
  register: adguard_deployed_config
  no_log: true
  when: adguard_deployed_config_stat.stat.exists

- name: Extract existing admin password hash from deployed configuration
  ansible.builtin.set_fact:
    adguard_existing_hash: >-
      {{ ((adguard_deployed_config.content | b64decode | from_yaml).users | default([], true))
         | selectattr('name', 'equalto', vault_adguard_username)
         | map(attribute='password') | list | first | default('')
         if adguard_deployed_config_stat.stat.exists else '' }}
  no_log: true

# htpasswd -v only reads hashes from a file; secrets travel via environment so
# they never appear in the templated command string
- name: Verify vault password against the deployed hash
  ansible.builtin.shell:
    cmd: |
      tmpfile=$(mktemp)
      trap 'rm -f "$tmpfile"' EXIT
      printf '%s:%s\n' "$ADGUARD_USER" "$ADGUARD_HASH" > "$tmpfile"
      htpasswd -vbB "$tmpfile" "$ADGUARD_USER" "$ADGUARD_PASS"
    executable: /bin/bash
  environment:
    ADGUARD_USER: "{{ vault_adguard_username }}"
    ADGUARD_HASH: "{{ adguard_existing_hash }}"
    ADGUARD_PASS: "{{ vault_adguard_password }}"
  register: adguard_hash_verify
  changed_when: false
  failed_when: false
  no_log: true
  # Read-only verify: run under --check too, else adguard_hash_stale defaults true
  # (skipped shell -> rc default 1) and the config re-renders a fresh bcrypt salt,
  # showing a spurious "changed" on every --check run.
  check_mode: false
  when: adguard_existing_hash | length > 0

# bcrypt salts differ per run: regenerating unconditionally would change the
# rendered config (and restart DNS) on every converge with zero real changes
- name: Determine whether a new password hash is needed
  ansible.builtin.set_fact:
    adguard_hash_stale: "{{ adguard_existing_hash | length == 0 or (adguard_hash_verify.rc | default(1)) != 0 }}"
  no_log: true

- name: Generate bcrypt hash for AdGuard password using htpasswd
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      htpasswd -nbB -C 10 "$ADGUARD_USER" "$ADGUARD_PASS" | cut -d: -f2
    executable: /bin/bash
  environment:
    ADGUARD_USER: "{{ vault_adguard_username }}"
    ADGUARD_PASS: "{{ vault_adguard_password }}"
  register: adguard_new_hash
  changed_when: false
  no_log: true
  when: adguard_hash_stale

- name: Select admin password hash for the rendered configuration
  ansible.builtin.set_fact:
    adguard_password_hash: "{{ adguard_new_hash.stdout if (adguard_hash_stale | bool) else adguard_existing_hash }}"
  no_log: true

# no_log: the rendered file (and its diff) embeds the admin bcrypt hash
- name: Create AdGuard Home configuration
  ansible.builtin.template:
    src: AdGuardHome.yaml.j2
    dest: "{{ adguard_work_dir }}/AdGuardHome.yaml"
    # 0600 matches what the AdGuard binary chmods the file to at runtime;
    # 0644 here makes the template task report changed on every converge
    mode: '0600'
  no_log: true
  notify: Restart AdGuard Home

- name: Install AdGuard Home systemd service
  ansible.builtin.command:
    cmd: "{{ adguard_install_dir }}/AdGuardHome -s install -w {{ adguard_work_dir }} -c {{ adguard_work_dir }}/AdGuardHome.yaml"
    creates: /etc/systemd/system/AdGuardHome.service

# Docker->native migration (rpi4): the old container still answers DNS on :53.
# Tear ONLY it down here - immediately before the native service starts - so the
# secondary-DNS blip is as short as possible. docker.service, matter-server and
# the NFS-gate drop-in are left untouched. Idempotent: a no-op once the project
# is gone, and skipped entirely on hosts that were always native.
- name: Stat the pre-existing AdGuard Docker compose project
  ansible.builtin.stat:
    path: "{{ adguard_docker_dir }}/docker-compose.yml"
  register: adguard_docker_compose_stat
  when: adguard_migrate_from_docker | bool

- name: Tear down the old AdGuard Docker container before binding port 53
  community.docker.docker_compose_v2:
    project_src: "{{ adguard_docker_dir }}"
    state: absent
  when:
    - adguard_migrate_from_docker | bool
    - adguard_docker_compose_stat.stat.exists | default(false)

- name: Ensure AdGuard Home service is enabled and started
  ansible.builtin.systemd:
    name: AdGuardHome
    enabled: "{{ adguard_service_enabled }}"
    state: "{{ adguard_service_state }}"
    daemon_reload: true

- name: Flush handlers so a config change restarts AdGuard before the readiness check
  ansible.builtin.meta: flush_handlers

- name: Wait for AdGuard Home web UI to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ adguard_bind_port }}/"
    method: GET
    status_code: [200, 302]
  register: adguard_web_ready
  until: adguard_web_ready.status in [200, 302]
  retries: 30
  delay: 5
  changed_when: false
