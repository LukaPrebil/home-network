---
# AdGuard Home native installation (for LXC/bare metal)

- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
    state: present
    update_cache: yes

- name: Stop systemd-resolved (conflicts with AdGuard on port 53)
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped

- name: Mask systemd-resolved to prevent it from starting
  ansible.builtin.systemd:
    name: systemd-resolved
    masked: true

- name: Remove systemd-resolved resolv.conf symlink
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent

- name: Create static resolv.conf for AdGuard
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      # Static DNS configuration for AdGuard Home
      nameserver 1.1.1.1
      nameserver 1.0.0.1
    mode: '0644'

- name: Create AdGuard directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ adguard_install_dir }}"
    - "{{ adguard_work_dir }}"
    - "{{ adguard_config_dir }}"

- name: Check if AdGuard Home is already installed
  ansible.builtin.stat:
    path: "{{ adguard_install_dir }}/AdGuardHome"
  register: adguard_binary

- name: Check installed AdGuard Home version
  ansible.builtin.command:
    cmd: "{{ adguard_install_dir }}/AdGuardHome --version"
  register: adguard_installed_version
  changed_when: false
  when: adguard_binary.stat.exists

- name: Determine if install or upgrade is needed
  ansible.builtin.set_fact:
    adguard_needs_install: "{{ not adguard_binary.stat.exists or adguard_version not in (adguard_installed_version.stdout | default('')) }}"

- name: Stop AdGuard Home service before upgrade
  ansible.builtin.systemd:
    name: AdGuardHome
    state: stopped
  when:
    - adguard_needs_install
    - adguard_binary.stat.exists

- name: Download AdGuard Home
  ansible.builtin.get_url:
    url: "https://github.com/AdguardTeam/AdGuardHome/releases/download/{{ adguard_version }}/AdGuardHome_linux_amd64.tar.gz"
    dest: "/tmp/adguardhome.tar.gz"
    mode: '0644'
  when: adguard_needs_install

- name: Extract AdGuard Home
  ansible.builtin.unarchive:
    src: "/tmp/adguardhome.tar.gz"
    dest: "/tmp"
    remote_src: yes
  when: adguard_needs_install

- name: Move AdGuard Home binary to install directory
  ansible.builtin.copy:
    src: "/tmp/AdGuardHome/AdGuardHome"
    dest: "{{ adguard_install_dir }}/AdGuardHome"
    mode: '0755'
    remote_src: yes
  when: adguard_needs_install
  notify: Restart AdGuard Home

- name: Clean up downloaded files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/adguardhome.tar.gz"
    - "/tmp/AdGuardHome"
  when: adguard_needs_install

- name: Install apache2-utils for htpasswd
  ansible.builtin.apt:
    name: apache2-utils
    state: present
    update_cache: yes
  when: vault_adguard_username is defined and vault_adguard_password is defined

- name: Generate bcrypt hash for AdGuard password using htpasswd
  ansible.builtin.shell:
    cmd: "htpasswd -nbB -C 10 '{{ vault_adguard_username }}' '{{ vault_adguard_password }}' | cut -d: -f2"
  register: adguard_password_hash
  changed_when: false
  no_log: true
  when: vault_adguard_username is defined and vault_adguard_password is defined

- name: Create AdGuard Home configuration
  ansible.builtin.template:
    src: AdGuardHome.yaml.j2
    dest: "{{ adguard_work_dir }}/AdGuardHome.yaml"
    mode: '0644'
  notify: Restart AdGuard Home

- name: Install AdGuard Home systemd service
  ansible.builtin.shell:
    cmd: "{{ adguard_install_dir }}/AdGuardHome -s install -w {{ adguard_work_dir }} -c {{ adguard_work_dir}}/AdGuardHome.yaml"
  args:
    creates: /etc/systemd/system/AdGuardHome.service

- name: Ensure AdGuard Home service is enabled and started
  ansible.builtin.systemd:
    name: AdGuardHome
    enabled: "{{ adguard_service_enabled }}"
    state: "{{ adguard_service_state }}"
    daemon_reload: yes
