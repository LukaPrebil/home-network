---
# Prerequisites for OTBR
# Ensures kernel modules, sysctl settings, and USB device are available

# Ubuntu 26.04 has no linux-modules-extra package for any kernel, and the USB
# serial drivers it used to carry are in the base kernel modules there instead:
# on the 26.04 containers VM cdc_acm, ch341, cp210x and ftdi_sio are all
# loadable without it, and the Thread dongle binds to cdc_acm on its own.
# Older hosts still need the package, so install it only where apt actually has
# a candidate rather than failing the play where it simply does not exist.
- name: Check whether linux-modules-extra exists for the running kernel
  ansible.builtin.command:
    cmd: apt-cache policy linux-modules-extra-{{ ansible_kernel }}
  register: otbr_modules_extra_policy
  changed_when: false
  check_mode: false

- name: Install linux-modules-extra for USB serial support
  ansible.builtin.apt:
    name: "linux-modules-extra-{{ ansible_kernel }}"
    state: present
    update_cache: true
  register: otbr_modules_install
  when: "otbr_modules_extra_policy.stdout is search('Candidate: [^(]')"

- name: Enable IPv4 forwarding (required for Thread border routing)
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: true
    state: present
    reload: true

- name: Enable IPv6 (required for Thread)
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.disable_ipv6
    value: '0'
    sysctl_set: true
    state: present
    reload: true

- name: Enable IPv6 forwarding (required for Thread border routing)
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: '1'
    sysctl_set: true
    state: present
    reload: true

- name: Ensure required kernel modules load on boot
  ansible.builtin.copy:
    content: |
      # CDC ACM driver for USB serial devices (OpenThread dongle)
      cdc_acm
      # IPv6 tables for OTBR firewall
      ip6_tables
      ip6table_filter
      ip6table_nat
    dest: /etc/modules-load.d/otbr.conf
    owner: root
    group: root
    mode: '0644'

- name: Load cdc_acm module now
  community.general.modprobe:
    name: cdc_acm
    state: present

- name: Load ip6_tables module now
  community.general.modprobe:
    name: ip6_tables
    state: present

- name: Load ip6table_filter module now
  community.general.modprobe:
    name: ip6table_filter
    state: present

- name: Load ip6table_nat module now
  community.general.modprobe:
    name: ip6table_nat
    state: present

- name: Wait for USB device to appear
  ansible.builtin.wait_for:
    path: "{{ otbr_thread_usb_device }}"
    timeout: 30
  register: otbr_usb_wait

- name: Verify USB device exists
  ansible.builtin.stat:
    path: "{{ otbr_thread_usb_device }}"
  register: otbr_usb_device_stat

- name: Fail if USB device not found
  ansible.builtin.fail:
    msg: |
      USB device {{ otbr_thread_usb_device }} not found!
      Please verify:
        1. Sonoff ZB-Dongle-E is connected and passed through from Proxmox
        2. Device path is correct (check: ls -la /dev/serial/by-id/)
        3. Override otbr_thread_usb_device variable if needed
  when: not otbr_usb_device_stat.stat.exists

- name: Display USB device info
  ansible.builtin.debug:
    msg: "USB device found: {{ otbr_thread_usb_device }} -> {{ otbr_usb_device_stat.stat.lnk_source | default('direct device') }}"
