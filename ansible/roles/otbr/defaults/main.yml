---
# OpenThread Border Router (OTBR) Role - Default Configuration

# Docker images. Pinned to a digest: otbr_version is the tag the digest was
# captured from (kept for readability in `docker ps`), otbr_image_digest is the
# immutable pin actually pulled. Upgrade = re-capture the running digest and bump
# both deliberately. Dropping the digest falls back to the tag.
otbr_image: "openthread/otbr"
otbr_version: "latest"
otbr_image_digest: "sha256:e91620a133100c7852251b509853d1224d549ad5129c0c325e75aae25c6cf922"
otbr_image_ref: "{{ otbr_image }}:{{ otbr_version }}{{ ('@' + otbr_image_digest) if otbr_image_digest else '' }}"

# Container names
otbr_container_name: "otbr"

# Base directories (using existing /srv/docker NFS mount)
otbr_base_dir: "/srv/docker/otbr"
otbr_compose_dir: "/opt/otbr"

# Data directories
otbr_data_dir: "{{ otbr_base_dir }}/data"

# USB Device Configuration (Sonoff ZB-Dongle-E with OpenThread firmware)
# Use persistent by-id path to avoid issues with device enumeration order
otbr_thread_usb_device: "/dev/serial/by-id/usb-ITEAD_SONOFF_Zigbee_3.0_USB_Dongle_Plus_V2_20221029081826-if00"

# Thread Network Configuration
#
# The full Active Operational Dataset TLV (otbr_thread_active_dataset, captured
# with `ot-ctl dataset active -x`) is the source of truth and the recovery
# artifact. The individual channel/network_name/panid/extpanid/network_key vars
# below are descriptive only - rebuilding a dataset from them would randomize
# PSKc + the Mesh-Local Prefix and orphan every commissioned Matter device, so
# they must NOT be used to reconstruct the network.
otbr_thread_active_dataset: "{{ vault_thread_active_dataset | default('') }}"
otbr_thread_channel: 15                          # Thread channel (default 15, avoids Zigbee channel 20)
otbr_thread_network_name: "OpenThreadHA"         # Thread network name
otbr_thread_panid: "0x1234"                      # PAN ID (16-bit hex)
otbr_thread_extpanid: "1111111122222222"         # Extended PAN ID (64-bit hex)
otbr_thread_network_key: "{{ vault_thread_network_key }}"  # 128-bit network key (from vault)

# OTBR Configuration
otbr_port_web: 8086                         # OTBR Web UI port
otbr_port_rest: 8081                        # OTBR REST API port
otbr_backbone_interface: "eth0"             # Host network interface for Thread backbone

# Timezone (inherit from global or default to UTC)
otbr_timezone: "{{ timezone | default('UTC') }}"

# Home Assistant integration info (for documentation in output)
otbr_home_assistant_host: "{{ hostvars['haos']['ansible_host'] }}"

# Auto-recovery watchdog (systemd timer)
# Safety net for the failure mode where a power event re-enumerates the USB
# Thread radio, otbr-agent dies on an HDLC I/O error, the container exits, and
# nothing brings it back: Docker abandons restart attempts while the device is
# absent, and `unless-stopped` skips the already-exited container on the next
# boot. The watchdog restarts the container as soon as the radio is present.
otbr_watchdog_check_interval: "60s"   # how often the timer fires
otbr_watchdog_boot_delay: "90s"       # first run after boot (let docker + USB settle)
otbr_watchdog_startup_grace_seconds: 120  # don't judge functional health until container has been up this long
otbr_watchdog_remove: false           # set true to remove the watchdog (rollback)
