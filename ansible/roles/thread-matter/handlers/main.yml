---
# Handlers for Thread Matter role

- name: Restart thread-matter stack
  community.docker.docker_compose_v2:
    project_src: "{{ thread_matter_compose_dir }}"
    state: restarted

- name: Restart otbr
  community.docker.docker_container:
    name: "{{ otbr_container_name }}"
    state: started
    restart: true

- name: Restart matter-server
  community.docker.docker_container:
    name: "{{ matter_server_container_name }}"
    state: started
    restart: true
