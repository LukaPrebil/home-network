---
# Deploy Thread Matter Stack containers

- name: Deploy thread-matter docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ thread_matter_compose_dir }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  notify: Restart thread-matter stack

- name: Pull Docker images
  community.docker.docker_compose_v2:
    project_src: "{{ thread_matter_compose_dir }}"
    pull: always
  register: thread_matter_pull

- name: Start Thread Matter Stack services
  community.docker.docker_compose_v2:
    project_src: "{{ thread_matter_compose_dir }}"
    state: present
  register: thread_matter_deploy

- name: Wait for OTBR REST API to be ready
  ansible.builtin.wait_for:
    host: localhost
    port: "{{ otbr_port_rest }}"
    timeout: 120
    delay: 10

- name: Wait for Matter Server to be ready
  ansible.builtin.wait_for:
    host: localhost
    port: "{{ matter_server_port }}"
    timeout: 120
    delay: 10

- name: Verify OTBR REST API is responding
  ansible.builtin.uri:
    url: "http://localhost:{{ otbr_port_rest }}/node/state"
    method: GET
    status_code: [200, 503]  # 503 if Thread not started yet, which is OK
    timeout: 10
  register: otbr_api_check
  retries: 5
  delay: 5
  until: otbr_api_check.status in [200, 503]

- name: Display Thread Matter Stack deployment status
  ansible.builtin.debug:
    msg: |
      Thread Matter Stack deployed successfully!

      OTBR (OpenThread Border Router):
        - Web UI: http://{{ ansible_host }}:{{ otbr_port_web }}
        - REST API: http://{{ ansible_host }}:{{ otbr_port_rest }}
        - Thread Channel: {{ thread_channel }}
        - Network Name: {{ thread_network_name }}

      Python Matter Server:
        - WebSocket API: ws://{{ ansible_host }}:{{ matter_server_port }}/ws

      Home Assistant Integration:
        1. Go to Settings -> Devices & Services -> Add Integration
        2. Search for "Matter (BETA)"
        3. Select "Connect to an existing Matter server"
        4. Enter URL: ws://{{ ansible_host }}:{{ matter_server_port }}/ws

        For Thread Border Router:
        1. Go to Settings -> Devices & Services -> Add Integration
        2. Search for "Thread"
        3. The OTBR should be auto-discovered, or enter:
           http://{{ ansible_host }}:{{ otbr_port_rest }}
