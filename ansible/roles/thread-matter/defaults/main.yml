---
# Thread Matter Stack - Default Configuration
# Deploys OpenThread Border Router (OTBR) and Python Matter Server

# Docker images
otbr_image: "openthread/otbr"
otbr_version: "latest"
matter_server_image: "ghcr.io/home-assistant-libs/python-matter-server"
matter_server_version: "stable"

# Container names
otbr_container_name: "otbr"
matter_server_container_name: "matter-server"

# Base directories (using existing /srv/docker NFS mount)
thread_matter_base_dir: "/srv/docker/thread-matter"
thread_matter_compose_dir: "/opt/thread-matter"

# Data directories
otbr_data_dir: "{{ thread_matter_base_dir }}/otbr"
matter_server_data_dir: "{{ thread_matter_base_dir }}/matter-server"

# USB Device Configuration (Sonoff ZB-Dongle-E with OpenThread firmware)
# Use persistent by-id path to avoid issues with device enumeration order
thread_usb_device: "/dev/serial/by-id/usb-ITEAD_SONOFF_Zigbee_3.0_USB_Dongle_Plus_V2_20221029081826-if00"

# Thread Network Configuration
thread_channel: 15                          # Thread channel (default 15, avoids Zigbee channel 20)
thread_network_name: "HomeThread"           # Thread network name
thread_panid: "0x1234"                      # PAN ID (16-bit hex)
thread_extpanid: "1111111122222222"         # Extended PAN ID (64-bit hex)
thread_network_key: "{{ vault_thread_network_key }}"  # 128-bit network key (from vault)

# OTBR Configuration
otbr_port_web: 8086                         # OTBR Web UI port
otbr_port_rest: 8081                        # OTBR REST API port
otbr_backbone_interface: "eth0"             # Host network interface for Thread backbone

# Matter Server Configuration
matter_server_port: 5580                    # WebSocket API port (Home Assistant connects here)

# Timezone (inherit from global or default to UTC)
thread_matter_timezone: "{{ timezone | default('UTC') }}"

# Home Assistant integration info (for documentation in output)
home_assistant_host: "192.168.1.144"
