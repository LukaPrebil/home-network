---
# Deploy autoheal container

# No notify: the compose deploy task (state: present) recreates on template
# changes; `docker compose restart` would double-bounce without re-reading them.
- name: Deploy autoheal docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ autoheal_compose_dir }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'

# No pull: always - the image is pinned to a digest (autoheal_image_digest), so
# `state: present` below pulls that exact digest only if it is missing locally.
- name: Start autoheal service
  community.docker.docker_compose_v2:
    project_src: "{{ autoheal_compose_dir }}"
    state: present
  register: autoheal_deploy

# autoheal exposes no HTTP endpoint; running container state is the readiness
# signal. The default('') keeps the until null-safe while compose recreates.
- name: Wait for autoheal container to be running
  community.docker.docker_container_info:
    name: "{{ autoheal_container_name }}"
  register: autoheal_info
  until: autoheal_info.exists and (autoheal_info.container.State.Status | default('')) == 'running'
  retries: 30
  delay: 5
