---
# Uptime Kuma default configuration

# Directories
# Compose file stays on NFS-backed /srv/docker (consistent with other services)
uptime_kuma_base_dir: "/srv/docker/uptime-kuma"
# Data directory on iSCSI mount (NOT NFS — Uptime Kuma 2.x uses SQLite which requires POSIX file locking)
uptime_kuma_data_dir: "/mnt/uptime-kuma"

# Docker image
uptime_kuma_image: "louislam/uptime-kuma:2.5.0"
uptime_kuma_container_name: "uptime-kuma"

# Network configuration
uptime_kuma_port: 3001
uptime_kuma_docker_network: "traefik"  # Connect to Traefik network for reverse proxy

# iSCSI configuration
uptime_kuma_iscsi_target_ip: "{{ truenas_nfs_server }}"
uptime_kuma_iscsi_target_iqn: "iqn.2005-10.org.freenas.ctl:uptime-kuma"
uptime_kuma_iscsi_mount_point: "/mnt/uptime-kuma"

# Service state (can be overridden during migration)
uptime_kuma_service_state: "started"  # Options: started, stopped, present
