---
# Deploy and manage Uptime Kuma with Docker Compose

- name: Ensure traefik network exists
  community.docker.docker_network:
    name: "{{ uptime_kuma_docker_network }}"
    state: present

- name: Deploy Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ uptime_kuma_base_dir }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'

- name: Pull Uptime Kuma Docker image
  community.docker.docker_compose_v2:
    project_src: "{{ uptime_kuma_base_dir }}"
    pull: "always"
  register: uptime_kuma_pull

- name: Start Uptime Kuma service
  community.docker.docker_compose_v2:
    project_src: "{{ uptime_kuma_base_dir }}"
    state: present
  register: uptime_kuma_deploy
  when: uptime_kuma_service_state != 'stopped'

# 302 covers the redirect to /dashboard when redirect-following is off
- name: Wait for Uptime Kuma to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ uptime_kuma_port }}/"
    method: GET
    status_code: [200, 302]
  register: uptime_kuma_health
  until: uptime_kuma_health.status in [200, 302]
  retries: 30
  delay: 5
  changed_when: false
  when: uptime_kuma_service_state == 'started'

- name: Display Uptime Kuma deployment status
  ansible.builtin.debug:
    msg:
      - "Uptime Kuma deployment complete!"
      - "State: {{ uptime_kuma_service_state }}"
      - "Access Uptime Kuma at: http://{{ ansible_host }}:{{ uptime_kuma_port }}"
      - "Public URL: https://kuma.lukapg.dev (via Traefik)"
  when: uptime_kuma_service_state == 'started'
