---
# OctoEverywhere default configuration

# Base directory for OctoEverywhere
octoeverywhere_base_dir: "/srv/docker/octoeverywhere"
octoeverywhere_data_dir: "{{ octoeverywhere_base_dir }}/data"

# Docker image
octoeverywhere_image: "octoeverywhere/octoeverywhere:4.6.8"
octoeverywhere_container_name: "octoeverywhere"

# OctoEverywhere configuration
octoeverywhere_companion_mode: "elegoo"  # Companion mode for Elegoo Neptune printers
octoeverywhere_printer_ip: "192.168.1.100"  # IP address of the 3D printer

# Service state (can be overridden during migration)
octoeverywhere_service_state: "started"  # Options: started, stopped, present
