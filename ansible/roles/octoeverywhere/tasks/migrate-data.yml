---
# Migrate OctoEverywhere data from rpi4 (two-stage: rpi4 → local → containers VM)

# Stage 1: Sync from rpi4 to local Ansible control node (one-time)
- name: Create local backup directory for OctoEverywhere data
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../backups/octoeverywhere"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false
  run_once: true
  when: octoeverywhere_migrate_data | bool

- name: Check if local backup already exists
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../backups/octoeverywhere/octoeverywhere.conf"
  register: local_backup
  delegate_to: localhost
  become: false
  run_once: true
  when: octoeverywhere_migrate_data | bool

- name: Stop OctoEverywhere on rpi4 for initial sync
  community.docker.docker_compose_v2:
    project_src: "/home/luka/ha"
    services:
      - octoeverywhere-elegoo-connect
    state: stopped
  delegate_to: "{{ octoeverywhere_source_host }}"
  when:
    - octoeverywhere_migrate_data | bool
    - not local_backup.stat.exists
  run_once: true

- name: Sync OctoEverywhere data from rpi4 to local backup
  ansible.posix.synchronize:
    src: "{{ hostvars[octoeverywhere_source_host].ansible_user }}@{{ hostvars[octoeverywhere_source_host].ansible_host }}:{{ octoeverywhere_source_data_dir }}/"
    dest: "{{ playbook_dir }}/../backups/octoeverywhere/"
    mode: pull
    recursive: yes
    delete: no
    checksum: yes
    rsync_opts:
      - "--exclude=logs"
      - "--exclude=*.log"
      - "--exclude=.DS_Store"
  delegate_to: localhost
  become: false
  when:
    - octoeverywhere_migrate_data | bool
    - not local_backup.stat.exists
  run_once: true

- name: Restart OctoEverywhere on rpi4 after initial sync
  community.docker.docker_compose_v2:
    project_src: "/home/luka/ha"
    services:
      - octoeverywhere-elegoo-connect
    state: present
  delegate_to: "{{ octoeverywhere_source_host }}"
  when:
    - octoeverywhere_migrate_data | bool
    - not local_backup.stat.exists
  run_once: true

- name: Display Stage 1 status
  ansible.builtin.debug:
    msg: "{{ 'Stage 1: Data synced from rpi4 to local backup' if not local_backup.stat.exists else 'Stage 1: Skipped - local backup already exists' }}"
  when: octoeverywhere_migrate_data | bool
  run_once: true

# Stage 2: Push from local backup to containers VM (idempotent)
- name: Sync OctoEverywhere data from local backup to containers VM
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../backups/octoeverywhere/"
    dest: "{{ octoeverywhere_data_dir }}/"
    mode: push
    recursive: yes
    delete: no
    checksum: yes
  when: octoeverywhere_migrate_data | bool

- name: Fix ownership of migrated data
  ansible.builtin.file:
    path: "{{ octoeverywhere_data_dir }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    recurse: yes
  when: octoeverywhere_migrate_data | bool

- name: Display migration complete status
  ansible.builtin.debug:
    msg:
      - "OctoEverywhere data migration complete!"
      - "Local backup: {{ playbook_dir }}/../backups/octoeverywhere/"
      - "Destination: {{ octoeverywhere_data_dir }}"
      - "Source rpi4 instance still running (not affected)"
  when: octoeverywhere_migrate_data | bool
