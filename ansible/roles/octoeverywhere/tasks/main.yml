---
# Main tasks file for OctoEverywhere role

- name: Include directory setup tasks
  ansible.builtin.include_tasks: directories.yml
  tags:
    - octoeverywhere
    - directories

- name: Include data migration tasks
  ansible.builtin.include_tasks: migrate-data.yml
  when: octoeverywhere_migrate_data | bool
  tags:
    - octoeverywhere
    - migrate

- name: Include deployment tasks
  ansible.builtin.include_tasks: deploy.yml
  tags:
    - octoeverywhere
    - deploy
