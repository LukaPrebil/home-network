---
# First-run bootstrap via mmctl in local mode (in-container unix socket, no
# admin token needed). Idempotent: every create is guarded by a prior existence
# check. Skipped under --check since it execs into the live container, which is
# only simulated in check mode.

- name: Bootstrap Mattermost (real-run only)
  when: not ansible_check_mode
  block:
    - name: List existing Mattermost users
      ansible.builtin.command:
        cmd: docker exec mattermost mmctl --local user list
      register: mattermost_existing_users
      changed_when: false

    - name: Create the system administrator account
      ansible.builtin.command:
        cmd: >
          docker exec mattermost mmctl --local user create
          --email {{ mattermost_admin_email }}
          --username {{ mattermost_admin_username }}
          --password {{ vault_mattermost_admin_password | quote }}
          --system-admin
      when: mattermost_admin_username not in mattermost_existing_users.stdout
      changed_when: true
      no_log: true  # contains the admin password

    - name: List existing teams
      ansible.builtin.command:
        cmd: docker exec mattermost mmctl --local team list
      register: mattermost_existing_teams
      changed_when: false

    - name: Create the team
      ansible.builtin.command:
        cmd: >
          docker exec mattermost mmctl --local team create
          --name {{ mattermost_team_name }}
          --display-name {{ mattermost_team_display_name | quote }}
      when: mattermost_team_name not in mattermost_existing_teams.stdout
      changed_when: true

    - name: List existing channels for the team
      ansible.builtin.command:
        cmd: docker exec mattermost mmctl --local channel list {{ mattermost_team_name }}
      register: mattermost_existing_channels
      changed_when: false

    - name: Create channels
      ansible.builtin.command:
        cmd: >
          docker exec mattermost mmctl --local channel create
          --team {{ mattermost_team_name }}
          --name {{ item.name }}
          --display-name {{ item.display_name | quote }}
      loop: "{{ mattermost_channels }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name not in mattermost_existing_channels.stdout
      changed_when: true

    - name: Show onboarding next steps
      ansible.builtin.debug:
        msg:
          - "✅ Mattermost bootstrapped"
          - "Admin: {{ mattermost_admin_username }} (password in vault)"
          - "Team: {{ mattermost_team_display_name }} ({{ mattermost_team_name }})"
          - "Invite teammates: open {{ mattermost_site_url }}, team menu -> Invite People -> Copy invite link, share it out-of-band. Open registration is disabled."
          - "GitHub plugin + incoming webhooks (Grafana/Uptime Kuma) are enabled in the System Console; the GitHub plugin needs a GitHub OAuth app."
