---
# Deploy and manage Mattermost with Docker Compose.
# The compose/env templates are applied by docker_compose_v2 state: present
# (it detects compose-file and env-file drift and recreates the changed
# containers), so they must NOT notify a restart handler.

- name: Render the Mattermost environment file
  ansible.builtin.template:
    src: mattermost.env.j2
    dest: "{{ mattermost_env_file }}"
    mode: '0600'

- name: Render the Mattermost Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ mattermost_compose_file }}"
    mode: '0644'

- name: Assert the uploads path is a real NFS mount
  ansible.builtin.include_role:
    name: common
    tasks_from: assert_nfs_mount
  vars:
    common_nfs_mount_path: "{{ mattermost_nfs_mount_point }}"

- name: Deploy the Mattermost Docker Compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ mattermost_base_dir }}"
    state: present

- name: Verify Mattermost readiness (real-run only)
  # uri has no check-mode support and the compose deploy above is only simulated
  # under --check, so there is nothing live to probe. Skip the whole health
  # check in check mode (matches the immich/monitoring pattern).
  when: not ansible_check_mode
  block:
    - name: Wait for Mattermost to be ready
      ansible.builtin.uri:
        url: "http://localhost:{{ mattermost_port }}/api/v4/system/ping"
        method: GET
        status_code: 200
      register: mattermost_ping
      until: mattermost_ping.status == 200
      retries: 30
      delay: 5
      changed_when: false

    - name: Display Mattermost deployment status
      ansible.builtin.debug:
        msg:
          - "✅ Mattermost is running"
          - "Public URL: {{ mattermost_site_url }}"
          - "Local: http://{{ ansible_host }}:{{ mattermost_port }}"
          - "Pinned version: {{ mattermost_version }}"
