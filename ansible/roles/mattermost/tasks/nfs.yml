---
# The uploads NFS dataset is mounted on the n5p host and bind-mounted into this
# LXC by setup-mattermost-nfs.yml, so inside the container the mount point and
# its contents already exist - we must NOT create or chmod it here (the dataset
# is owned by the idmap-shifted app uid, which container-root cannot chmod over
# the maproot-root NFS share). deploy.yml asserts it is a real NFS mount before
# writing. The create + direct-mount tasks run only on non-LXC hosts (none today,
# kept for parity with the immich role).

- name: Check if running in an LXC container
  ansible.builtin.stat:
    path: /proc/1/environ
  register: mattermost_proc_environ

- name: Detect LXC environment
  ansible.builtin.command: grep -q container=lxc /proc/1/environ
  register: mattermost_is_lxc
  failed_when: false
  changed_when: false
  when: mattermost_proc_environ.stat.exists

- name: Install NFS client packages (non-LXC only; LXC uses host bind mounts)
  ansible.builtin.apt:
    name:
      - nfs-common
    state: present
  when: mattermost_is_lxc.rc | default(1) != 0

- name: Create the uploads mount point (non-LXC only; LXC gets it from the pct bind)
  ansible.builtin.file:
    path: "{{ mattermost_nfs_mount_point }}"
    state: directory
    mode: '0755'
  when: mattermost_is_lxc.rc | default(1) != 0

- name: Mount the TrueNAS uploads NFS share (non-LXC only)
  ansible.posix.mount:
    path: "{{ mattermost_nfs_mount_point }}"
    src: "{{ mattermost_nfs_server }}:{{ mattermost_nfs_share }}"
    fstype: nfs
    opts: "{{ mattermost_nfs_opts }}"
    state: mounted
  when: mattermost_is_lxc.rc | default(1) != 0
