---
# Create the Mattermost directory tree on the LXC local rootfs (encrypted
# dataset). The container runs as {{ mattermost_run_uid }}:{{ mattermost_run_gid }},
# so its writable paths must be owned by that uid. These are local-rootfs paths,
# so the unshifted uid is correct here. Postgres chowns its own data dir on first
# init. The uploads NFS dataset is different: it is a maproot-root share, so the
# container's writes arrive at TrueNAS as the idmap-shifted host uid - it is
# chowned to that shifted uid by setup-mattermost-nfs.yml, not here.

- name: Create Mattermost base directory
  ansible.builtin.file:
    path: "{{ mattermost_base_dir }}"
    state: directory
    mode: '0755'

- name: Create Postgres data directory
  ansible.builtin.file:
    path: "{{ mattermost_db_data_dir }}"
    state: directory
    mode: '0755'

- name: Create Mattermost app directories owned by the container uid
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ mattermost_run_uid }}"
    group: "{{ mattermost_run_gid }}"
    mode: '0750'
  loop:
    - "{{ mattermost_config_dir }}"
    - "{{ mattermost_logs_dir }}"
    - "{{ mattermost_plugins_dir }}"
    - "{{ mattermost_client_plugins_dir }}"
