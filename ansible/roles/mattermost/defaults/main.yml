---
# Mattermost role default variables

# Mattermost (free Team Edition). 11.8.2 is the current stable; bump as needed:
# https://hub.docker.com/r/mattermost/mattermost-team-edition/tags
mattermost_version: "11.8.2"
mattermost_image: "mattermost/mattermost-team-edition:{{ mattermost_version }}"

# PostgreSQL (stock image). Mattermost 11 requires PG 14+ with no stated upper
# bound, so 18 is fine.
mattermost_postgres_image: "postgres:18-alpine"
mattermost_db_name: "mattermost"
mattermost_db_user: "mattermost"
mattermost_db_hostname: "mattermost_postgres"

# Directories. All state lives on the LXC local rootfs, which is itself on the
# encrypted truenas-vms-enc dataset - so Postgres gets correct POSIX locking
# (no-DB-on-NFS rule) and at-rest encryption at the same time.
mattermost_base_dir: "/opt/mattermost"
mattermost_db_data_dir: "{{ mattermost_base_dir }}/database"
mattermost_config_dir: "{{ mattermost_base_dir }}/config"
mattermost_logs_dir: "{{ mattermost_base_dir }}/logs"
mattermost_plugins_dir: "{{ mattermost_base_dir }}/plugins"
mattermost_client_plugins_dir: "{{ mattermost_base_dir }}/client-plugins"

# Compose / env file paths
mattermost_compose_file: "{{ mattermost_base_dir }}/docker-compose.yml"
mattermost_env_file: "{{ mattermost_base_dir }}/.env"

# File uploads on the encrypted NFS dataset, bind-mounted into the LXC by the
# n5p host (setup-mattermost-nfs.yml) and into the container by compose.
mattermost_uploads_mount: "/mnt/mattermost-uploads"
mattermost_nfs_server: "{{ truenas_nfs_server }}"
mattermost_nfs_share: "/mnt/tank/mattermost-uploads"
mattermost_nfs_mount_point: "{{ mattermost_uploads_mount }}"
mattermost_nfs_opts: "{{ nfs_common_opts }}"

# The Mattermost container runs as uid:gid 2000:2000; bind-mounted paths must be
# owned by it or the server cannot write config/logs/uploads.
mattermost_run_uid: 2000
mattermost_run_gid: 2000

# Unprivileged LXC idmap base (Proxmox default). The container's uid 2000 maps to
# host uid 100000+2000 on the maproot-root NFS share, so the uploads dataset must
# be owned by the shifted uid for the server's writes to land (mirrors the
# immich-photos dataset, chowned to the 100000 base). setup-mattermost-nfs.yml
# applies this; the local rootfs dirs in directories.yml use the unshifted uid.
mattermost_lxc_uid_offset: 100000
mattermost_uploads_host_uid: "{{ mattermost_lxc_uid_offset + mattermost_run_uid }}"
mattermost_uploads_host_gid: "{{ mattermost_lxc_uid_offset + mattermost_run_gid }}"

# App port published on the LXC; Traefik (separate LXC) fronts it via its file
# provider, so no Docker labels are needed here.
mattermost_port: 8065

# Public site (internet-exposed via Cloudflare -> Traefik). SiteURL MUST be the
# public HTTPS URL or Mattermost mis-builds links and WebSockets fail.
mattermost_hostname: "chat.lukapg.dev"
mattermost_site_url: "https://{{ mattermost_hostname }}"

# Push notifications: TPNS (free, best-effort). HPNS is paid (Team Edition is
# excluded), and a self-hosted proxy needs custom mobile app builds.
mattermost_push_server: "https://push-test.mattermost.com"

# Onboarding model: invite-link only. Open self-registration is disabled
# (mandatory on a public instance); invited users can still create accounts.
mattermost_enable_open_server: false
mattermost_enable_user_creation: true

# Enable local mode so `mmctl --local` (via the in-container unix socket) can
# drive team/channel/bot bootstrap without storing an admin token.
mattermost_enable_local_mode: true

mattermost_service_state: "started"

# Bootstrap (idempotent, via mmctl --local). Human passwords are NOT stored:
# only the bootstrap system-admin password lives in vault; everyone else
# self-registers via the team invite link.
mattermost_admin_email: "luka.prebil.grintal@proton.me"
mattermost_admin_username: "luka_admin"
mattermost_team_name: "pentla"  # URL slug
mattermost_team_display_name: "Pentla"
mattermost_channels:
  - name: "dev"
    display_name: "Dev"
  - name: "product"
    display_name: "Product"
  - name: "alerts"
    display_name: "Alerts"
