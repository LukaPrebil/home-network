---
# Create required directories for ATProto PDS

- name: Create PDS base directory
  ansible.builtin.file:
    path: "{{ pds_base_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Create PDS data directories on iSCSI mount
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: 1000
    group: 1000
    mode: '0755'
  loop:
    - "{{ pds_data_dir }}"
    - "{{ pds_blocks_dir }}"
