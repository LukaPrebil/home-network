---
# matterjs-server Role - Default Configuration

# Docker images
matter_server_image: "ghcr.io/matter-js/matterjs-server"
matter_server_version: "1.4.0"

# Container names
matter_server_container_name: "matter-server"

# Base directories (local rootfs, M-09: the fabric keys in /data must not sit
# on the LAN-readable NFS export)
matter_server_base_dir: "/opt/matter-server"
matter_server_compose_dir: "/opt/matter-server"

# Data directories
matter_server_data_dir: "{{ matter_server_base_dir }}/data"

# Matter Server Configuration
matter_server_port: 5580  # WebSocket API port for Home Assistant
matter_server_log_level: "info"  # Log level: debug, info, warning, error
# Only safe while the host clock is NTP-synced; timesyncd is managed by the common role on docker_hosts
matter_server_time_sync: true

# Timezone (inherit from global or default to UTC)
matter_server_timezone: "{{ timezone | default('UTC') }}"

# Home Assistant integration info
matter_server_home_assistant_host: "{{ hostvars['haos']['ansible_host'] }}"

# OTBR connection (Matter Server connects to OTBR over network for Thread)
matter_server_otbr_host: "{{ hostvars['containers']['ansible_host'] }}"
matter_server_otbr_rest_api_port: 8081
