---
# Python Matter Server Role - Default Configuration

# Docker images
matter_server_image: "ghcr.io/matter-js/python-matter-server"
matter_server_version: "8.1.2"

# Container names
matter_server_container_name: "matter-server"

# Base directories (on rpi4 local storage or NFS)
matter_server_base_dir: "/srv/docker/matter-server"
matter_server_compose_dir: "/opt/matter-server"

# Data directories
matter_server_data_dir: "{{ matter_server_base_dir }}/data"

# Matter Server Configuration
matter_server_port: 5580  # WebSocket API port for Home Assistant
matter_server_log_level: "info"  # Log level: debug, info, warning, error

# Timezone (inherit from global or default to UTC)
matter_server_timezone: "{{ timezone | default('UTC') }}"

# Home Assistant integration info
home_assistant_host: "{{ hostvars['haos']['ansible_host'] }}"

# OTBR connection (Matter Server connects to OTBR over network for Thread)
otbr_host: "{{ hostvars['containers']['ansible_host'] }}"
otbr_rest_api_port: 8081
