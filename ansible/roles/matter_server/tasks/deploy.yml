---
# Deploy Matter Server container

- name: Assert Matter Server data path is an NFS mount
  ansible.builtin.include_role:
    name: common
    tasks_from: assert_nfs_mount
  vars:
    common_nfs_mount_path: "{{ matter_server_base_dir }}"

- name: Deploy Matter Server docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ matter_server_compose_dir }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'

- name: Pull Docker images
  community.docker.docker_compose_v2:
    project_src: "{{ matter_server_compose_dir }}"
    pull: always
  register: matter_server_pull

- name: Start Matter Server service
  community.docker.docker_compose_v2:
    project_src: "{{ matter_server_compose_dir }}"
    state: present
  register: matter_server_deploy

# 60 x 15s matches the image's built-in healthcheck start_period of 15 min:
# a first start may convert python-matter-server storage and re-interview every node
- name: Wait for Matter Server container to report healthy
  community.docker.docker_container_info:
    name: "{{ matter_server_container_name }}"
  register: matter_server_container_info
  retries: 60
  delay: 15
  until: >-
    matter_server_container_info.container.State.Health.Status | default('') == 'healthy'

- name: Display Matter Server deployment status
  ansible.builtin.debug:
    msg: |
      matterjs-server deployed successfully!

      WebSocket API: ws://{{ ansible_host }}:{{ matter_server_port }}/ws

      CRITICAL: Update Home Assistant Configuration
      ──────────────────────────────────────────────
      The Matter Server has moved from containers VM to rpi4.
      You MUST update Home Assistant to use the new URL:

      1. Navigate to Home Assistant
         http://{{ matter_server_home_assistant_host }}:8123

      2. Go to Settings -> Devices & Services

      3. Find 'Matter (BETA)' integration

      4. Click the 3-dot menu -> Configure

      5. Update Server URL to:
         ws://{{ ansible_host }}:{{ matter_server_port }}/ws

      6. Click Submit and wait for connection

      7. Verify all Matter devices are still visible

      Thread Border Router:
        OTBR Location: {{ matter_server_otbr_host }}:{{ matter_server_otbr_rest_api_port }}
        Matter Server will discover Thread network automatically
