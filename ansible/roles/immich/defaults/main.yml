---
# Immich role default variables

# Immich version
immich_version: "v3.1.0"

# Immich directories
immich_base_dir: "/opt/immich"
immich_upload_dir: "/mnt/immich-photos"  # NFS mount point for photo library

# NFS configuration for photo storage
immich_nfs_server: "{{ truenas_nfs_server }}"
immich_nfs_share: "/mnt/tank/immich-photos"
immich_nfs_mount_point: "{{ immich_upload_dir }}"
immich_nfs_opts: "{{ nfs_common_opts }}"

# External libraries configuration (for importing existing photos)
# List of host paths to mount read-only into the container
# These are typically NFS mounts on the LXC host
immich_external_libraries:
  - /mnt/external-data

# Docker Compose configuration
immich_compose_file: "{{ immich_base_dir }}/docker-compose.yml"
immich_env_file: "{{ immich_base_dir }}/.env"

# Database configuration
immich_postgres_image: "ghcr.io/immich-app/postgres:18-vectorchord0.5.3-pgvector0.8.1"
immich_db_name: "immich"
immich_db_user: "immich"
immich_db_hostname: "immich_postgres"

# Redis configuration
immich_redis_hostname: "immich_redis"

# Immich configuration
immich_log_level: "log"  # log, verbose, debug, warn, error

# Hardware acceleration
immich_enable_hw_accel: true  # Master switch for any GPU acceleration
immich_enable_vaapi: true     # VA-API for video transcoding (works)
immich_enable_rocm: true      # ROCm for ML inference (official v2.6.0 image uses ROCm 7.2 + MIGraphX)
immich_gpu_devices:
  - /dev/dri/card0
  - /dev/dri/renderD128

# ROCm configuration
# HSA GFX version override for GPU compatibility (empty = use native gfx1150 support)
# Set to "11.0.2" if the official ROCm 7.2 image doesn't work with gfx1150
immich_hsa_override: ""

# VA-API packages for AMD GPU hardware transcoding
immich_vaapi_packages:
  - mesa-va-drivers  # AMD VA-API drivers
  - libva-drm2       # VA-API DRM runtime
  - vainfo           # VA-API info tool for testing
  - radeontop        # AMD GPU monitoring tool
