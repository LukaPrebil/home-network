---
# Configure NFS mount for Immich photo library
#
# For LXC containers: NFS should be mounted on the Proxmox host and bind-mounted into the container
# For VMs/bare metal: NFS is mounted directly

- name: Check if running in LXC container
  ansible.builtin.stat:
    path: /proc/1/environ
  register: immich_proc_environ

- name: Detect LXC environment
  ansible.builtin.command: grep -q container=lxc /proc/1/environ
  register: immich_is_lxc
  failed_when: false
  changed_when: false
  when: immich_proc_environ.stat.exists

- name: Install NFS client packages (not needed for LXC with bind mounts)
  ansible.builtin.apt:
    name:
      - nfs-common
    state: present
  when: immich_is_lxc.rc | default(1) != 0

- name: Create Immich photo library mount point
  ansible.builtin.file:
    path: "{{ immich_nfs_mount_point }}"
    state: directory
    mode: '0755'

- name: Mount TrueNAS NFS share for Immich photos (VMs/bare metal only)
  ansible.posix.mount:
    path: "{{ immich_nfs_mount_point }}"
    src: "{{ immich_nfs_server }}:{{ immich_nfs_share }}"
    fstype: nfs
    opts: "{{ immich_nfs_opts }}"
    state: mounted
  when: immich_is_lxc.rc | default(1) != 0  # Skip for LXC containers

- name: Verify storage is accessible
  ansible.builtin.stat:
    path: "{{ immich_nfs_mount_point }}"
  register: immich_nfs_mount_check

- name: Display storage mount status
  ansible.builtin.debug:
    msg: "Immich photo library accessible at {{ immich_nfs_mount_point }}"
  when: immich_nfs_mount_check.stat.exists
