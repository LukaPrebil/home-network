---
# Deploy and manage Immich with Docker Compose

# Runs on LXC too: the bind-mounted NFS shows fstype nfs4 in the container's
# /proc/mounts, so the guard correctly distinguishes a live mount from a stale
# empty stub (verified live 2026-06-12). The old LXC carve-out let immich deploy
# straight onto an empty stub during a host NFS-bind drop.
- name: Assert Immich photo library path is an NFS mount
  ansible.builtin.include_role:
    name: common
    tasks_from: assert_nfs_mount
  vars:
    common_nfs_mount_path: "{{ immich_nfs_mount_point }}"

- name: Deploy Immich Docker Compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ immich_base_dir }}"
    state: present
    pull: "missing"  # Pins are exact tags, so a bump pulls anyway; "always" would re-check the 23.7 GB ML image every converge

- name: Verify Immich readiness and version (real-run only)
  # uri has no check-mode support, so under --check these probes are skipped and
  # immich_ping/immich_about come back as skip-dicts with no .status - the
  # downstream `when: .status == 200` then errors on the missing attribute. The
  # compose deploy above is also only simulated in check mode, so there is
  # nothing live to health-check. Skip the whole verification under --check.
  when: not ansible_check_mode
  block:
    - name: Wait for Immich to be ready
      ansible.builtin.uri:
        url: "http://localhost:2283/api/server/ping"
        method: GET
        status_code: 200
      register: immich_ping
      until: immich_ping.status == 200
      retries: 30
      delay: 10
      changed_when: false

    # /api/server/about requires auth from v3.0.0 on, which made the old probe return
    # 401 and every downstream check skip its own `when` instead of failing. This
    # endpoint is public and returns major/minor/patch, so the mismatch check below
    # is unconditional and a wrong deployed version is a hard failure again.
    - name: Verify deployed version
      ansible.builtin.uri:
        url: "http://localhost:2283/api/server/version"
        method: GET
        status_code: 200
      register: immich_version_probe
      changed_when: false

    - name: Check version mismatch
      ansible.builtin.fail:
        msg: "Version mismatch. Expected {{ immich_version }}, deployed v{{ immich_deployed_version }}"
      vars:
        immich_deployed_version: "{{ immich_version_probe.json.major }}.{{ immich_version_probe.json.minor }}.{{ immich_version_probe.json.patch }}"
      when: "'v' ~ immich_deployed_version != immich_version"

    # The ML container ships its own /opt/rocm and reaches the GPU through the
    # /dev/dri and /dev/kfd passthrough alone, so there is nothing ROCm-shaped on
    # the guest left to test. Probing inside the container is the stronger check
    # anyway: it proves the GPU is visible where inference actually runs. Losing
    # it means silently falling back to CPU, which nothing else would report.
    - name: Verify the GPU is visible inside the ML container
      ansible.builtin.command:
        cmd: docker exec immich_machine_learning rocminfo
      register: immich_rocminfo
      changed_when: false
      failed_when: false
      when: immich_enable_rocm

    - name: Fail if the ML container cannot see the GPU
      ansible.builtin.fail:
        msg: >-
          rocminfo reported no {{ immich_gpu_target }} agent inside
          immich_machine_learning (rc={{ immich_rocminfo.rc }}). ROCm is enabled,
          so inference would silently fall back to CPU.
      when:
        - immich_enable_rocm
        - immich_gpu_target not in immich_rocminfo.stdout | default('')

    - name: Display Immich deployment status
      ansible.builtin.debug:
        msg:
          - "Immich {{ immich_version }} is running"
          - "Access: http://{{ ansible_host }}:2283"
          - "GPU: {{ immich_gpu_target }} visible in the ML container"
