---
# Setup Docker environment for Immich

- name: Create Immich base directory
  ansible.builtin.file:
    path: "{{ immich_base_dir }}"
    state: directory
    mode: '0755'

- name: Create Immich data directories
  ansible.builtin.file:
    path: "{{ immich_base_dir }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - postgres
    - model-cache

- name: Deploy Immich .env file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ immich_env_file }}"
    mode: '0600'
  notify: restart immich

- name: Deploy hardware acceleration config files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ immich_base_dir }}/{{ item }}"
    mode: '0644'
  loop:
    - hwaccel.ml.yml
    - hwaccel.transcoding.yml

- name: Deploy custom ROCm Dockerfile
  ansible.builtin.template:
    src: Dockerfile.j2
    dest: "{{ immich_base_dir }}/Dockerfile"
    mode: '0644'
  when: immich_enable_rocm
  register: dockerfile_deployed

- name: Build custom Immich ML image with ROCm 6.4.4
  community.docker.docker_image:
    name: "immich-ml-rocm-custom"
    tag: "{{ immich_version }}"
    source: build
    build:
      path: "{{ immich_base_dir }}"
      dockerfile: Dockerfile
    force_source: "{{ dockerfile_deployed is changed }}"
  when: immich_enable_rocm
  register: custom_image_build

- name: Display custom image build status
  ansible.builtin.debug:
    msg: "Custom ROCm image built successfully: immich-ml-rocm-custom:{{ immich_version }}"
  when:
    - immich_enable_rocm
    - custom_image_build is changed

- name: Deploy Immich docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ immich_compose_file }}"
    mode: '0644'
  notify: restart immich
