---
# Setup Docker environment for Immich

- name: Create Immich base directory
  ansible.builtin.file:
    path: "{{ immich_base_dir }}"
    state: directory
    mode: '0755'

- name: Create Immich data directories
  ansible.builtin.file:
    path: "{{ immich_base_dir }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - postgres
    - model-cache

- name: Deploy Immich .env file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ immich_env_file }}"
    mode: '0600'
  notify: restart immich

- name: Deploy hardware acceleration config files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ immich_base_dir }}/{{ item }}"
    mode: '0644'
  loop:
    - hwaccel.ml.yml
    - hwaccel.transcoding.yml

- name: Deploy Immich docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ immich_compose_file }}"
    mode: '0644'
  notify: restart immich
