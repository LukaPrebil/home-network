---
# Install ROCm 7.2 from AMD repositories for GPU acceleration

- name: Remove old ROCm packages from Ubuntu repos
  ansible.builtin.apt:
    name:
      - rocminfo
      - libhsa-runtime64-1
    state: absent
    purge: true

# Left on disk after install so get_url is a no-op on re-converge. Deleting it
# (as a cleanup step used to) made every run re-download + re-mark changed.
- name: Download AMD GPU install package for ROCm 7.2
  ansible.builtin.get_url:
    url: https://repo.radeon.com/amdgpu-install/7.2/ubuntu/noble/amdgpu-install_7.2.70200-1_all.deb
    dest: /tmp/amdgpu-install_7.2.70200-1_all.deb
    mode: '0644'

- name: Install AMD GPU package manager
  ansible.builtin.apt:
    deb: /tmp/amdgpu-install_7.2.70200-1_all.deb
    state: present

- name: Update apt cache after adding AMD repos
  ansible.builtin.apt:
    update_cache: true

- name: Install ROCm prerequisites
  ansible.builtin.apt:
    name:
      - python3-setuptools
      - python3-wheel
    state: present

- name: Install ROCm runtime and tools
  ansible.builtin.apt:
    name:
      - rocm-hip-runtime
      - rocminfo
      - rocprofiler-register  # Required by rocminfo in ROCm 7.2 (not auto-pulled by rocm-hip-runtime)
    state: present
  # Note: Using rocm-hip-runtime instead of full 'rocm' package to save space
  # This includes the HSA runtime and ROCm tools needed for inference

- name: Test ROCm installation
  ansible.builtin.command:
    cmd: rocminfo
  register: immich_rocminfo_output
  changed_when: false
  failed_when: false

- name: Display ROCm information
  ansible.builtin.debug:
    msg: "{{ immich_rocminfo_output.stdout_lines | select('search', 'Agent|Name:|gfx') | list }}"
  when: immich_rocminfo_output.rc == 0

- name: Warn if ROCm test failed
  ansible.builtin.debug:
    msg: "WARNING: ROCm test failed. GPU may not be detected."
  when: immich_rocminfo_output.rc != 0
