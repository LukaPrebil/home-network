---
# Hermes Agent role defaults
#
# Hermes is an autonomous AI agent (Nous Research, MIT) installed via the
# upstream curl one-liner into a per-user uv-managed venv. We run it as a
# dedicated `hermes` user under systemd, with state under ~hermes/.hermes/.
#
# The agent's brain is a first-class model provider (Ollama Cloud today,
# switchable by vars), it talks to Home Assistant over the WS API, and
# surfaces a Telegram bot.

# ── Local user and install paths ─────────────────────────────────────
hermes_user: hermes
hermes_user_uid: 10000
hermes_user_home: "/home/{{ hermes_user }}"
hermes_home: "{{ hermes_user_home }}/.hermes"          # HERMES_HOME (state + config + skills + session DB)
hermes_install_dir: "{{ hermes_home }}/hermes-agent"    # uv venv + checkout

# ── Upstream installer ───────────────────────────────────────────────
# The official installer pins versions internally; we don't track an explicit
# Hermes release here. `hermes update` is the supported upgrade path. Re-running
# this role does NOT auto-upgrade — the install task is gated on binary presence.
hermes_installer_url: "https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh"

# ── Model / brain ────────────────────────────────────────────────────
# The brain is a vars edit away: switch provider + model here, and set the
# matching API key in SOPS (templates/env.j2 carries one key block per
# supported provider; empty = unset). Supported set: ollama-cloud,
# opencode-go, deepseek. Model:tag notation is preserved for ollama-cloud.
hermes_model_provider: "ollama-cloud"
hermes_model_default: "deepseek-v4.1-flash:cloud"

# ── Gateway platforms ────────────────────────────────────────────────
# Telegram is the human surface (approvals land in the same chat). The Home
# Assistant gateway platform is ON and event-driven: the adapter subscribes
# over WebSocket and wakes the agent for the entities in
# hermes_ha_watch_entities, and for nothing else. It needs
# vault_hermes_hass_token; with the token unset the platform does not load and
# the wake silently does nothing, which is what the deploy health check is for.
hermes_enable_telegram: true
hermes_enable_homeassistant: true

# The chat hermes sends unsolicited messages to: event wakes, cron results,
# startup notices. Telegram's home channel is normally set by running /sethome
# in the chat, but that only writes into config.yaml - which this role owns and
# rewrites wholesale - so it is declared here and rendered into .env instead
# (upstream reads TELEGRAM_HOME_CHANNEL at load time).
#
# Derived from the allowed-users list so no Telegram id is committed to the
# repository. Override this var if the home chat should differ from the first
# entry in the allowlist. Empty allowlist = no home channel and therefore no
# unsolicited messages.
hermes_telegram_home_channel: "{{ (vault_hermes_telegram_allowed_users | default('')) | string | split(',') | first | trim }}"
# Forum topic the home channel lives in; empty means the channel itself.
hermes_telegram_home_channel_thread_id: ""

# The ha-mcp MCP tool surface is separate from the gateway platform above:
# pull-only house access (read + service-call whitelist below) stays ON
# while the event-driven wake stays OFF.
hermes_enable_hamcp: true
hermes_enable_discord: false
hermes_enable_slack: false
hermes_enable_signal: false

# ── Home Assistant ───────────────────────────────────────────────────
# Pulls the HAOS host's address from inventory rather than hardcoding. The port
# is separate because the readiness check below filters on it.
hermes_hass_port: 8123
hermes_hass_url: "http://{{ hostvars['haos']['ansible_host'] }}:{{ hermes_hass_port }}"

# Event-driven wake, and the only thing that can start an agent turn on its
# own. Deliberately narrow: watching every state change costs roughly
# 700-800k wakes/day, while this list is budgeted at 10-25 wakes/day. Every
# entry must pass the watch-decision gate, recorded with the plan at
# .claude/state/plans/2026-09-20-hermes-ha-wake-and-doorbell.md:
#   1. name an action no existing automation takes;
#   2. no duplication with an existing automation's trigger or notify;
#   3. under 5 events/day sustained over 7d, else watch a derived helper or
#      accept the cooldown;
#   4. watch absence-of-signal through a synthetic *_alive helper, never the
#      raw feed, because a dead feed and a healthy one look identical;
#   5. device-level entities only, never map-derived or progress entities;
#   6. ship the reason inline with the entry;
#   7. prune monthly - a wake that did nothing gets removed.
#
# Two planned entries are blocked on helpers that do not exist yet (the
# Tigo-bridge-alive helper and the inverter-bridge heartbeat helper). Add them
# only once the helpers land and the heartbeat pattern is settled.
hermes_ha_watch_entities:
  # Mower job ends and faults. sensor.vrt_luba_progress is deliberately absent:
  # gate rule 5 excludes progress state, and a job end is read from the state
  # change plus sensor.vrt_luba_last_error_time.
  - lawn_mower.vrt_luba
  - sensor.vrt_luba_last_error_time
  # Doorbell ring - the trigger for the visitor flow (plan decision 4).
  - binary_sensor.zvonec_zunaj_visitor
  # ARSO severe-weather warning going active for the Ljubljana airport region.
  - binary_sensor.arso_opozorila_letalisce_jozeta_pucnika_ljubljana_aktivno_opozorilo
  # Nightly automatic backup, and new Home Assistant repair issues.
  - event.backup_automatic_backup
  - event.repair

# Upstream default is 30s between events for the same entity. Spelled out so
# the value is reviewable whenever an entry is added.
hermes_ha_cooldown_seconds: 30

# What the agent is told when it wakes on an event. Injected as a per-channel
# system prompt (platforms.<name>.channel_overrides.<chat_id>.system_prompt,
# which upstream resolves by chat_id, then thread_id, then parent_id), so it
# applies to the Home Assistant channel and nothing else.
#
# The platform answers its own channel as an HA persistent notification, which
# nobody reads away from a browser, so the agent is told to report on Telegram
# instead. `send_message` is NOT an LLM tool in this build (the module never
# calls registry.register and no toolset lists it), so the route is the
# `hermes send` CLI, which needs no running gateway and no agent loop. It is
# also the only route that can attach a picture, which the doorbell flow needs.
hermes_ha_channel_prompt: >-
  You were woken by a Home Assistant event, not by a person, and nothing reads
  this channel. Report to the operator on Telegram with:
  hermes send -t telegram '<text>'. Put MEDIA:<path> in the text to attach a
  picture. Send one short message, only when the event is worth reporting;
  otherwise stay silent.

# ── Security ─────────────────────────────────────────────────────────
# approvals.mode "manual": every dangerous terminal command becomes a
# propose-wait prompt in the Telegram chat; cron/webhook contexts fail
# closed (upstream defaults: cron_mode/single_query_mode/unattended_mode
# deny). Valid upstream modes are smart | manual | off — NOT "on".
# Tier-1 "act then notify" can come later via command_allowlist mining.
hermes_approvals_mode: "manual"

# ── Home Assistant tool surface (ha-mcp) ──────────────────────────────
# Whitelist of ha-mcp tools hermes may call: read + service-call only.
# The agent must not author automations/scripts/helpers (operator decision,
# 2026-09-13 house-AI discussion), and approvals do NOT gate MCP tool calls,
# so this include list IS the HA privilege boundary. New upstream tools
# default to hidden; additions need a deliberate change here.
hermes_hamcp_include_tools:
  - ha_get_overview
  - ha_get_state
  - ha_get_entity
  - ha_search
  - ha_search_tools
  - ha_list_services
  - ha_call_service
  - ha_bulk_control
  - ha_get_history
  - ha_list_floors_areas
  - ha_get_zone
  - ha_get_device
  - ha_get_integration
  - ha_get_system_health
  - ha_get_operation_status
  - ha_error_code
  - ha_version
  - ha_get_automation_traces
  - ha_config_get_automation
  - ha_config_get_script
  - ha_config_get_scene
  - ha_get_camera_image

# Setting HASS_TOKEN turns on upstream's built-in `homeassistant` toolset by
# itself (ha_list_entities, ha_get_state, ha_list_services, ha_call_service):
# a second HA service-call path that the whitelist above does not govern.
# Disabled so ha-mcp stays the single HA tool surface - one privilege
# boundary, one result shape, no duplicate read tools. agent.disabled_toolsets
# is a global suppression list that upstream applies last, after every
# per-platform toolset list.
hermes_disabled_toolsets:
  - homeassistant

# Terminal backend: local execution inside this LXC. The LXC IS the sandbox.
# Use "docker" instead if we ever stand up MCP servers that need container
# isolation beyond what the LXC already provides.
hermes_terminal_backend: "local"

# Dashboard (web UI) and API server: localhost only. Reach via SSH tunnel or
# Tailscale, never expose on LAN — dashboard stores API keys.
hermes_dashboard_bind: "127.0.0.1"
hermes_dashboard_port: 9119

# ── systemd ──────────────────────────────────────────────────────────
hermes_service_name: "hermes-gateway"
hermes_dashboard_service_name: "hermes-dashboard"
hermes_service_state: "started"  # started | stopped | restarted
hermes_service_enabled: true
