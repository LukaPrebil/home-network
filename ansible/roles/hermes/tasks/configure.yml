---
# Template Hermes config.yaml and .env into HERMES_HOME.
#
# Both files live in ~hermes/.hermes/ and are managed exclusively by this role.
# Hand-edits will be overwritten on next converge — change defaults or the
# templates instead.

- name: Template Hermes config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ hermes_home }}/config.yaml"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
  notify: Restart Hermes gateway

- name: Template Hermes .env (secrets)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ hermes_home }}/.env"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: '0600'
  notify: Restart Hermes gateway
  no_log: true  # secrets in this file
