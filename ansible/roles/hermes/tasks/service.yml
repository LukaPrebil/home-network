---
# systemd units: hermes-gateway (messaging platforms + cron) and
# hermes-dashboard (web UI, loopback only). ExecStart uses the foreground
# verb `gateway run`; see the gateway unit template for why `gateway start`
# is wrong inside its own unit.

- name: Template hermes-gateway systemd unit
  ansible.builtin.template:
    src: hermes-gateway.service.j2
    dest: "/etc/systemd/system/{{ hermes_service_name }}.service"
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd

- name: Template hermes-dashboard systemd unit
  ansible.builtin.template:
    src: hermes-dashboard.service.j2
    dest: "/etc/systemd/system/{{ hermes_dashboard_service_name }}.service"
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd

- name: Flush handlers so daemon-reload runs before enable/start
  ansible.builtin.meta: flush_handlers

- name: Manage hermes-gateway service
  ansible.builtin.systemd:
    name: "{{ hermes_service_name }}"
    state: "{{ hermes_service_state }}"
    enabled: "{{ hermes_service_enabled }}"

- name: Manage hermes-dashboard service
  ansible.builtin.systemd:
    name: "{{ hermes_dashboard_service_name }}"
    state: "{{ hermes_service_state }}"
    enabled: "{{ hermes_service_enabled }}"

# Dashboard binds 127.0.0.1 only; this runs on the target host, so it reaches it.
# The FIRST start builds the web UI (npm), which can take ~2 minutes, hence 60
# retries x 5s; later starts serve the prebuilt dist immediately.
- name: Wait for hermes dashboard to be ready
  ansible.builtin.uri:
    url: "http://{{ hermes_dashboard_bind }}:{{ hermes_dashboard_port }}/"
    method: GET
    status_code: 200
  register: hermes_health
  until: hermes_health.status == 200
  retries: 60
  delay: 5
  changed_when: false
  when: hermes_service_state != 'stopped'

# The dashboard serves the last state the gateway published, so a restart leaves a
# window of a few seconds in which it still reports the previous process as
# connected. Reading state alone would pass there, which is exactly the failure this
# check exists to catch. A socket cannot outlive its process, so requiring the
# gateway to be holding the Home Assistant WebSocket right now closes that window.
- name: Assert the running gateway holds the Home Assistant WebSocket
  ansible.builtin.shell: |
    set -o pipefail
    ss -tnp state established "( dport = :{{ hermes_hass_port }} )" \
      | grep -c 'hermes",pid=' || true
  args:
    executable: /bin/bash
  register: hermes_ha_socket
  until: hermes_ha_socket.stdout | trim | int > 0
  retries: 30
  delay: 5
  changed_when: false
  when:
    - not ansible_check_mode  # check mode restarts nothing, so it proves nothing
    - hermes_service_state != 'stopped'
    - hermes_enable_homeassistant

# Proves the event wake is armed, which the rendered config alone does not: with
# vault_hermes_hass_token empty the Home Assistant platform never loads and the
# watch list is inert. The dashboard reports each gateway platform's live state,
# which is the only application-level view of it - the adapter logs its connect
# at INFO, below the gateway's WARNING log level, so the journal never carries it.
- name: Assert the gateway connected to Home Assistant
  ansible.builtin.uri:
    url: "http://{{ hermes_dashboard_bind }}:{{ hermes_dashboard_port }}/api/status"
    method: GET
    status_code: 200
    return_content: true
  register: hermes_status
  until: >-
    (hermes_status.json.gateway_platforms | default({}))
    .get('homeassistant', {}).get('state') == 'connected'
  retries: 30
  delay: 5
  changed_when: false
  when:
    - not ansible_check_mode  # a check run restarts nothing, so it proves nothing
    - hermes_service_state != 'stopped'
    - hermes_enable_homeassistant
