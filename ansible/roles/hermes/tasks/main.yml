---
# Hermes Agent role main entry

- name: Include install tasks
  ansible.builtin.include_tasks: install.yml
  tags:
    - hermes
    - install

- name: Include configuration tasks
  ansible.builtin.include_tasks: configure.yml
  tags:
    - hermes
    - config

- name: Include systemd service tasks
  ansible.builtin.include_tasks: service.yml
  tags:
    - hermes
    - service

- name: Include EV hunt monitor tasks
  # Opt-in: the script, its filter contract, and the judgment skill for the
  # listing monitor. The cron jobs that call them are runtime state on the LXC.
  ansible.builtin.include_tasks: ev_hunt.yml
  tags:
    - hermes
    - ev-hunt
  when: hermes_enable_ev_hunt | bool
