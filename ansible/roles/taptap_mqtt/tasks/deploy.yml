---
# config.ini is bind-mounted INTO the container, so compose cannot see it change
# and notifies the restart handler. The compose template below does not notify:
# `docker_compose_v2` with state: present is itself the apply mechanism for
# compose-file drift.
- name: Deploy taptap-mqtt configuration
  ansible.builtin.template:
    src: config.ini.j2
    dest: "{{ taptap_mqtt_base_dir }}/config.ini"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'
  no_log: true  # don't print the rendered secret under --check --diff
  notify: Restart taptap-mqtt

# Bind-mounted INTO the watchdog container, so compose cannot see it change
# either. It restarts only the sidecar: a watchdog change is no reason to bounce
# the bridge, which costs a reconnect and a re-enumeration.
- name: Deploy the taptap-mqtt watchdog script
  ansible.builtin.copy:
    src: taptap_watchdog.py
    dest: "{{ taptap_mqtt_base_dir }}/taptap_watchdog.py"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  notify: Restart taptap-mqtt watchdog

- name: Deploy taptap-mqtt Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ taptap_mqtt_base_dir }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'

# A config change must land before readiness is judged, or a bridge still
# running the previous config would pass the check. meta tasks ignore `when`,
# so this stays outside the check-mode block below; it is a no-op under --check
# because nothing was actually written.
- name: Apply pending taptap-mqtt restarts before the readiness check
  ansible.builtin.meta: flush_handlers

- name: Deploy and verify taptap-mqtt (real-run only)
  # Under --check the compose file above is only simulated, so docker_compose_v2
  # fails outright with "does not contain docker-compose.yml" on a first deploy,
  # and no heartbeat file can exist to stat afterwards.
  when: not ansible_check_mode
  block:
    - name: Pull taptap-mqtt Docker image
      community.docker.docker_compose_v2:
        project_src: "{{ taptap_mqtt_base_dir }}"
        pull: "always"
      register: taptap_mqtt_pull

    - name: Start taptap-mqtt service
      community.docker.docker_compose_v2:
        project_src: "{{ taptap_mqtt_base_dir }}"
        state: present
      register: taptap_mqtt_deploy
      when: taptap_mqtt_service_state != 'stopped'

    # Deliberately NOT the repo's usual container-running probe. This bridge
    # holds its MQTT connection open even when the bus goes quiet, so "the
    # container is running" is true in exactly the failure this check exists to
    # catch. The heartbeat file is the one thing the process must keep doing to
    # be alive. It proves the loop is turning and nothing more - a silent bus
    # surfaces as HA entities going unavailable after TIMEOUT instead.
    - name: Wait for the taptap-mqtt heartbeat file to appear
      ansible.builtin.stat:
        path: "{{ taptap_mqtt_base_dir }}/run/taptap.state"
      register: taptap_mqtt_heartbeat
      until: taptap_mqtt_heartbeat.stat.exists
      retries: 30
      delay: 5
      when: taptap_mqtt_service_state == 'started'

    - name: Read the current time on the target host
      ansible.builtin.command: date +%s
      register: taptap_mqtt_now
      changed_when: false
      when: taptap_mqtt_service_state == 'started'

    - name: Assert the taptap-mqtt heartbeat is fresh
      ansible.builtin.assert:
        that:
          - (taptap_mqtt_now.stdout | int) - (taptap_mqtt_heartbeat.stat.mtime | int) < taptap_mqtt_heartbeat_max_age
        fail_msg: >-
          taptap-mqtt heartbeat is stale
          ({{ (taptap_mqtt_now.stdout | int) - (taptap_mqtt_heartbeat.stat.mtime | int) }}s old).
          The container may be running while the bridge loop is wedged - check
          `docker logs {{ taptap_mqtt_container_name }}`.
        success_msg: "taptap-mqtt heartbeat is fresh."
      when: taptap_mqtt_service_state == 'started'


    # Enumeration self-heal.
    #
    # The bridge binds panel names to optimizers in two ways. Power reports
    # carry only a gateway-assigned node ID, so on a first start it assigns each
    # node the first unused name in the list - a guess. The real binding arrives
    # in taptap's infrastructure report, which carries each node's barcode.
    #
    # The defect: when that report arrives AFTER temporary mappings already
    # exist, the bridge does not reconcile them. It logs nothing, raises
    # nothing, and every panel keeps its guessed name indefinitely. Worse, the
    # obvious health signal lies - nodes_identified_count reads 30 because it
    # counts nodes holding any node ID, confirmed or guessed.
    #
    # taptap persists the topology it learns, so the ordering is only wrong on
    # a run that begins with no state file. Once the file exists, a restart
    # processes the infrastructure report before any power report and all
    # bindings resolve. That is the whole fix, hence a restart rather than an
    # assertion: failing loudly would just hand the operator the same restart.
    #
    # Observed 2026-08-27: state file written at 06:38, still 0 of 30 bound
    # hours later; one restart bound all 30.
    - name: Read taptap-mqtt container state
      community.docker.docker_container_info:
        name: "{{ taptap_mqtt_container_name }}"
      register: taptap_mqtt_state
      changed_when: false

    - name: Check whether taptap has persisted a topology yet
      ansible.builtin.stat:
        path: "{{ taptap_mqtt_base_dir }}/data/taptap.json"
      register: taptap_mqtt_topology

    - name: Count optimizers bound to a barcode since container start
      ansible.builtin.shell: >
        set -o pipefail &&
        docker logs --since '{{ taptap_mqtt_state.container.State.StartedAt }}'
        {{ taptap_mqtt_container_name }} 2>&1
        | grep -c 'Permanently enumerated' || true
      args:
        executable: /bin/bash
      register: taptap_mqtt_bound
      changed_when: false
      when: taptap_mqtt_topology.stat.exists

    # Only ever fires when a topology is known but unbound - never on a genuine
    # first run, where there is nothing to bind to yet.
    - name: Restart taptap-mqtt to bind optimizers against the known topology
      community.docker.docker_compose_v2:
        project_src: "{{ taptap_mqtt_base_dir }}"
        state: restarted
      when:
        - taptap_mqtt_topology.stat.exists
        - (taptap_mqtt_bound.stdout | int) < (taptap_mqtt_module_count | int)

    - name: Recount optimizers bound to a barcode after the restart
      ansible.builtin.shell: >
        set -o pipefail &&
        docker logs --tail 2000 {{ taptap_mqtt_container_name }} 2>&1
        | grep -c 'Permanently enumerated' || true
      args:
        executable: /bin/bash
      register: taptap_mqtt_rebound
      until: (taptap_mqtt_rebound.stdout | int) >= (taptap_mqtt_module_count | int)
      retries: 12
      delay: 5
      changed_when: false
      when:
        - taptap_mqtt_topology.stat.exists
        - (taptap_mqtt_bound.stdout | int) < (taptap_mqtt_module_count | int)

    - name: Report optimizer binding state
      ansible.builtin.debug:
        msg: >-
          {{ taptap_mqtt_module_count }} optimizers configured;
          {{ 'topology not yet learned - panel names stay provisional until the bus reports barcodes'
             if not taptap_mqtt_topology.stat.exists
             else 'all bound to their barcodes' }}
      when: taptap_mqtt_service_state == 'started'

    # Throughput, not liveness.
    #
    # Every check above can read green while the optimiser bus is silent, which
    # is how 2026-09-17 went unnoticed for three days. The Elfin stopped feeding
    # the socket the bridge already held; the socket stayed ESTABLISHED and kept
    # ACKing keepalives, so nothing looked wrong from either end; the bridge
    # logged nothing; and the heartbeat stayed fresh because the bridge touches
    # it on every pass whether or not data arrived.
    #
    # The MQTT state topic does not close that gap either. The bridge republishes
    # it every UPDATE seconds regardless of the bus, stamped with its own clock,
    # so the topic stays fresh while every value inside it goes stale. The one
    # number that stops moving is the optimisers' own newest report time, which
    # is what the watchdog sidecar exports.
    - name: Wait for the watchdog to consume a state message
      # Gates the watchdog itself. No message means the sidecar is not wired to
      # the broker, which the converge should report as such rather than reading
      # an absent metric as a silent bus.
      #
      # Checked on the host's own address, not loopback: the sidecar publishes
      # its port bound to that address, the same way the broker does, so a
      # loopback request is refused by design.
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ taptap_mqtt_watchdog_port }}/metrics"
        return_content: true
      register: taptap_mqtt_freshness
      until: >-
        (taptap_mqtt_freshness.content | regex_findall('taptap_mqtt_state_messages_total ([0-9]+)') | map('int') | first | default(0)) > 0
      retries: 12
      delay: 5
      changed_when: false
      when: taptap_mqtt_service_state == 'started'

    - name: Work out how long ago the newest optimiser report arrived
      # The age comes from the watchdog rather than from a clock read here. A
      # reference read once goes stale across the retries below, which makes a
      # silent bus look fresher than it is - the one direction this check must
      # never be wrong in. An absent metric line reads as the never-reported
      # sentinel and so lands in the stale branch.
      ansible.builtin.set_fact:
        taptap_mqtt_report_age: >-
          {{ taptap_mqtt_freshness.content | regex_findall('taptap_mqtt_report_age_seconds ([0-9.]+)') | map('float') | first | default(taptap_mqtt_report_age_never) }}
      when: taptap_mqtt_service_state == 'started'

    - name: Reconnect taptap-mqtt when the optimiser bus is silent
      # The sanctioned repair for this failure: the bridge's own TCP client is
      # black-holed, so a fresh connection is all it needs. The tap bridge is
      # read-only by construction and is never written to, so reconnecting
      # cannot disturb the bus behind it.
      community.docker.docker_compose_v2:
        project_src: "{{ taptap_mqtt_base_dir }}"
        services:
          - taptap-mqtt
        state: restarted
      when:
        - taptap_mqtt_service_state == 'started'
        - (taptap_mqtt_report_age | float) >= (taptap_mqtt_report_max_age | int)

    - name: Wait for the optimiser bus to report after the reconnect
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ taptap_mqtt_watchdog_port }}/metrics"
        return_content: true
      register: taptap_mqtt_freshness_after
      until: >-
        taptap_mqtt_report_age_after | float < (taptap_mqtt_report_max_age | int)
      vars:
        taptap_mqtt_report_age_after: >-
          {{ taptap_mqtt_freshness_after.content | regex_findall('taptap_mqtt_report_age_seconds ([0-9.]+)') | map('float') | first | default(taptap_mqtt_report_age_never) }}
      retries: 12
      delay: 5
      changed_when: false
      # The assertion below owns the failure message: it can name the upstream
      # causes, which an exhausted retry loop cannot.
      failed_when: false
      when:
        - taptap_mqtt_service_state == 'started'
        - (taptap_mqtt_report_age | float) >= (taptap_mqtt_report_max_age | int)

    - name: Fail when the optimiser bus is still silent after a reconnect
      ansible.builtin.assert:
        that:
          - >-
            taptap_mqtt_freshness_after.content | regex_findall('taptap_mqtt_report_age_seconds ([0-9.]+)') | map('float') | first | default(taptap_mqtt_report_age_never)
            < (taptap_mqtt_report_max_age | int)
        fail_msg: >-
          The optimiser bus is not delivering. The newest optimiser report is
          still older than {{ taptap_mqtt_report_max_age }}s after reconnecting
          the bridge, so the bridge's own socket is not what is broken - look
          upstream. In order: CCA and TAP radio power (the TAP radios are fed at
          the array), the unmanaged switch in the PV enclosure, then the Elfin
          EE11A at {{ taptap_mqtt_address }} (it should answer ping and accept a
          read-only connect on port {{ taptap_mqtt_port }}). Do not add
          termination to that bridge and never write to it.
        success_msg: "The optimiser bus is reporting again."
      when:
        - taptap_mqtt_service_state == 'started'
        - (taptap_mqtt_report_age | float) >= (taptap_mqtt_report_max_age | int)

    - name: Display taptap-mqtt deployment status
      ansible.builtin.debug:
        msg:
          - "taptap-mqtt deployment complete!"
          - "State: {{ taptap_mqtt_service_state }}"
          - "Tap bridge: {{ taptap_mqtt_address }}:{{ taptap_mqtt_port }}"
          - "Broker: {{ mosquitto_endpoint }}"
          - "Modules go unavailable in HA after {{ taptap_mqtt_timeout }}s without a message."
      when: taptap_mqtt_service_state == 'started'
