---
# No notify on the env/compose templates: ha-mcp.env is an env_file, so the
# compose deploy task (state: present) recreates on changes to either;
# `docker compose restart` would double-bounce without re-reading them.
- name: Deploy ha-mcp environment file
  ansible.builtin.template:
    src: ha-mcp.env.j2
    dest: "{{ ha_mcp_base_dir }}/ha-mcp.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'

- name: Deploy ha-mcp Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ ha_mcp_base_dir }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'

- name: Pull ha-mcp Docker image
  community.docker.docker_compose_v2:
    project_src: "{{ ha_mcp_base_dir }}"
    pull: "always"
  register: ha_mcp_pull

- name: Start ha-mcp service
  community.docker.docker_compose_v2:
    project_src: "{{ ha_mcp_base_dir }}"
    state: present
  register: ha_mcp_deploy
  when: ha_mcp_service_state != 'stopped'

# MCP streamable-http rejects plain GET (needs POST + SSE Accept header), so
# any HTTP status from the listed set proves the server is up and answering.
- name: Wait for ha-mcp to be ready
  # Probe the secret path, not /mcp: the MCP path is the credential and moves
  # with MCP_SECRET_PATH. A GET on it returns the browser landing page (200).
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ ha_mcp_port }}{{ ha_mcp_secret_path }}"
    method: GET
    status_code: [200, 400, 405, 406]
  register: ha_mcp_health
  until: ha_mcp_health.status in [200, 400, 405, 406]
  retries: 30
  delay: 5
  changed_when: false
  when: ha_mcp_service_state == 'started'

- name: Display ha-mcp deployment status
  ansible.builtin.debug:
    msg:
      - "ha-mcp deployment complete!"
      - "State: {{ ha_mcp_service_state }}"
      - "MCP endpoint: http://{{ ansible_host }}:{{ ha_mcp_port }} + MCP_SECRET_PATH"
      - "The path is the credential and is deliberately not logged; read it from vault_ha_mcp_secret_path in group_vars/all/secrets.sops.yml."
  when: ha_mcp_service_state == 'started'
