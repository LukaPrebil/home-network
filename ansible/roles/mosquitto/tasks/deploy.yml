---
# mosquitto.conf and passwd are bind-mounted INTO the container, so compose
# cannot see them change. Both notify the restart handler; the compose template
# below does not, because `docker_compose_v2` with state: present is itself the
# apply mechanism for compose-file drift.
- name: Deploy Mosquitto configuration
  ansible.builtin.template:
    src: mosquitto.conf.j2
    dest: "{{ mosquitto_base_dir }}/config/mosquitto.conf"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  notify: Restart Mosquitto

# The hashed password file is stored whole in sops rather than being generated
# here. `mosquitto_passwd` salts every hash, so generating on each converge
# would rewrite the file every run and restart the broker every run. Regenerate
# by hand when a credential changes:
#   docker run --rm -it eclipse-mosquitto:2 mosquitto_passwd -c -b /tmp/p <user> <pass>
- name: Deploy Mosquitto password file
  ansible.builtin.template:
    src: passwd.j2
    dest: "{{ mosquitto_base_dir }}/config/passwd"
    owner: "{{ mosquitto_uid }}"
    group: "{{ mosquitto_gid }}"
    mode: '0600'
  notify: Restart Mosquitto

- name: Deploy Mosquitto Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ mosquitto_base_dir }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'

- name: Pull Mosquitto Docker image
  community.docker.docker_compose_v2:
    project_src: "{{ mosquitto_base_dir }}"
    pull: "always"
  register: mosquitto_pull

- name: Start Mosquitto service
  community.docker.docker_compose_v2:
    project_src: "{{ mosquitto_base_dir }}"
    state: present
  register: mosquitto_deploy
  when: mosquitto_service_state != 'stopped'

# The config notifies above must land before readiness is judged, or a broker
# still running the previous config would pass the check.
- name: Apply pending Mosquitto restarts before the readiness check
  ansible.builtin.meta: flush_handlers

# Mosquitto exposes no HTTP endpoint and writes no heartbeat file, so the
# running container state is the readiness signal. The default('') keeps the
# until null-safe while compose recreates.
- name: Wait for Mosquitto container to be running
  community.docker.docker_container_info:
    name: "{{ mosquitto_container_name }}"
  register: mosquitto_info
  until: mosquitto_info.exists and (mosquitto_info.container.State.Status | default('')) == 'running'
  retries: 30
  delay: 5
  when: mosquitto_service_state == 'started'

- name: Display Mosquitto deployment status
  ansible.builtin.debug:
    msg:
      - "Mosquitto deployment complete!"
      - "State: {{ mosquitto_service_state }}"
      - "Broker: {{ mosquitto_endpoint }}"
  when: mosquitto_service_state == 'started'
