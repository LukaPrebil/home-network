---
# Omada Controller role defaults

# Omada Controller version
omada_controller_version: "6.1.0.19"
omada_controller_deb_url: "https://static.tp-link.com/upload/software/2026/202601/20260121/Omada_Network_Application_v6.1.0.19_linux_x64_20260117100106.deb"
omada_controller_deb_local: "{{ playbook_dir }}/../backups/omada/Omada_Network_Application_v6.1.0.19_linux_x64_20260117100106.deb"

# Installation paths
omada_install_dir: "/opt/tplink/EAPController"
omada_data_dir: "/opt/tplink/EAPController/data"
omada_work_dir: "/opt/tplink/EAPController/work"
omada_logs_dir: "/opt/tplink/EAPController/logs"

# Service configuration
omada_service_state: started
omada_service_enabled: true

# Network configuration
omada_http_port: 8088
omada_https_port: 8043
omada_portal_http_port: 8088
omada_portal_https_port: 8843
omada_device_mgmt_port: 29817  # New in v6.0 for optimized device management

# MongoDB configuration (bundled with Omada)
omada_mongodb_port: 27217

# Java configuration
omada_java_version: "21"  # Java 21 recommended for v6.0

# Upgrade configuration
omada_upgrade_mode: false  # Set to true when upgrading
omada_previous_version: "6.0.0.25"  # Track previous version for upgrade path

# Migration/backup configuration
omada_restore_backup: false
omada_backup_source_dir: "{{ playbook_dir }}/../backups/omada"
omada_use_local_deb: true  # Use pre-downloaded .deb from backups folder
