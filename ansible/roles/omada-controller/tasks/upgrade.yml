---
# Upgrade Omada Controller from v5 to v6

- name: Display upgrade information
  ansible.builtin.debug:
    msg:
      - "=========================================="
      - "Upgrading Omada Controller"
      - "From: {{ omada_previous_version }}"
      - "To: {{ omada_controller_version }}"
      - "=========================================="

- name: Check current Omada Controller version
  ansible.builtin.shell:
    cmd: "{{ omada_install_dir }}/bin/control.sh status | grep -i version || echo 'unknown'"
  register: current_version
  changed_when: false
  failed_when: false

- name: Display current version
  ansible.builtin.debug:
    msg: "Current Omada version: {{ current_version.stdout }}"

# MongoDB Upgrade Steps (7.0 → 8.0)
- name: Check current MongoDB version
  ansible.builtin.shell:
    cmd: "mongod --version | head -n1"
  register: current_mongodb_version
  changed_when: false
  failed_when: false

- name: Display current MongoDB version
  ansible.builtin.debug:
    msg: "Current MongoDB version: {{ current_mongodb_version.stdout }}"

- name: Determine if MongoDB upgrade is needed
  ansible.builtin.set_fact:
    mongodb_upgrade_needed: "{{ current_mongodb_version.stdout is not search('v8.') }}"

- name: Detect actual MongoDB port
  ansible.builtin.shell:
    cmd: "ss -tlnp | grep mongod | awk '{print $4}' | sed 's/.*://'"
  register: detected_mongodb_port
  changed_when: false
  when: mongodb_upgrade_needed

- name: Set MongoDB port for backup
  ansible.builtin.set_fact:
    mongodb_backup_port: "{{ detected_mongodb_port.stdout | default('27017') }}"
  when: mongodb_upgrade_needed

- name: Display MongoDB port being used
  ansible.builtin.debug:
    msg: "MongoDB is running on port {{ mongodb_backup_port }}"
  when: mongodb_upgrade_needed

- name: Stop Omada Controller for MongoDB upgrade
  ansible.builtin.systemd:
    name: omada
    state: stopped
  when: mongodb_upgrade_needed

- name: Backup MongoDB database
  ansible.builtin.shell:
    cmd: "mongodump --port {{ mongodb_backup_port }} --out /tmp/mongodb-backup-$(date +%Y%m%d-%H%M%S)"
  when: mongodb_upgrade_needed
  register: mongodb_backup
  changed_when: true

- name: Display MongoDB backup location
  ansible.builtin.debug:
    msg: "MongoDB backup created at: {{ mongodb_backup.stdout_lines[-1] if mongodb_backup.stdout_lines else 'N/A' }}"
  when: mongodb_upgrade_needed

# Remove old MongoDB 7.0 repository
- name: Remove old MongoDB 7.0 repository
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/mongodb-org-7.0.list
    state: absent
  when: mongodb_upgrade_needed

- name: Remove old MongoDB 7.0 GPG key
  ansible.builtin.file:
    path: /usr/share/keyrings/mongodb-server-7.0.gpg
    state: absent
  when: mongodb_upgrade_needed

# The prerequisites.yml will install MongoDB 8.0 since we're on v6
- name: Update apt cache for MongoDB 8.0
  ansible.builtin.apt:
    update_cache: yes
  when: mongodb_upgrade_needed

- name: Upgrade MongoDB to 8.0
  ansible.builtin.apt:
    name:
      - mongodb-org
    state: latest
  when: mongodb_upgrade_needed

- name: Restart MongoDB after upgrade
  ansible.builtin.systemd:
    name: mongod
    state: restarted
  when: mongodb_upgrade_needed

- name: Wait for MongoDB to be ready
  ansible.builtin.wait_for:
    port: "{{ mongodb_backup_port }}"
    delay: 5
    timeout: 60
  when: mongodb_upgrade_needed

- name: Verify MongoDB 8.0 is running
  ansible.builtin.shell:
    cmd: "mongod --version | head -n1"
  register: new_mongodb_version
  changed_when: false
  when: mongodb_upgrade_needed

- name: Display new MongoDB version
  ansible.builtin.debug:
    msg: "MongoDB upgraded to: {{ new_mongodb_version.stdout }}"
  when: mongodb_upgrade_needed

# Upgrade Omada Controller
- name: Create temporary directory for Omada upgrade
  ansible.builtin.file:
    path: /tmp/omada-upgrade
    state: directory
    mode: '0755'

- name: Copy local Omada v6 .deb package to target
  ansible.builtin.copy:
    src: "{{ omada_controller_deb_local }}"
    dest: "/tmp/omada-upgrade/omada_{{ omada_controller_version }}.deb"
    mode: '0644'
  when: omada_use_local_deb | bool

- name: Download Omada Controller v6 .deb package
  ansible.builtin.get_url:
    url: "{{ omada_controller_deb_url }}"
    dest: "/tmp/omada-upgrade/omada_{{ omada_controller_version }}.deb"
    mode: '0644'
  when: not (omada_use_local_deb | bool)

- name: Upgrade Omada Controller to v6
  ansible.builtin.apt:
    deb: "/tmp/omada-upgrade/omada_{{ omada_controller_version }}.deb"
    state: present
  register: omada_upgrade_result

- name: Clean up temporary upgrade files
  ansible.builtin.file:
    path: /tmp/omada-upgrade
    state: absent

- name: Start Omada Controller after upgrade
  ansible.builtin.systemd:
    name: omada
    state: started

- name: Wait for Omada Controller to be ready
  ansible.builtin.wait_for:
    port: "{{ omada_https_port }}"
    delay: 10
    timeout: 120

- name: Verify upgraded Omada Controller version
  ansible.builtin.shell:
    cmd: "{{ omada_install_dir }}/bin/control.sh status | grep -i version || echo 'unknown'"
  register: upgraded_version
  changed_when: false
  failed_when: false

- name: Display upgrade completion status
  ansible.builtin.debug:
    msg:
      - "=========================================="
      - "Omada Controller Upgrade Complete!"
      - "Previous version: {{ current_version.stdout }}"
      - "New version: {{ upgraded_version.stdout }}"
      - "MongoDB: {{ new_mongodb_version.stdout if mongodb_upgrade_needed else 'No upgrade needed' }}"
      - "Web UI: https://{{ ansible_host }}:{{ omada_https_port }}"
      - "New device management port: {{ omada_device_mgmt_port }}"
      - "=========================================="
