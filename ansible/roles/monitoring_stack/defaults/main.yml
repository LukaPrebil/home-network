---
# Monitoring Stack role default variables

# Base directory for monitoring stack data.
# Local LXC rootfs (ext4 disk image on truenas-vms), NOT the /srv/docker NFS bind:
# Prometheus TSDB + Loki chunks + Grafana SQLite need correct POSIX locking, which
# NFS does not provide reliably, and an NFS-bind drop on the host silently empties
# the path (see the 2026-06-12 outage). Compose file still lives under the same /opt tree.
monitoring_stack_base_dir: "/opt/monitoring/data"

# Component-specific directories
monitoring_stack_grafana_data_dir: "{{ monitoring_stack_base_dir }}/grafana"
monitoring_stack_prometheus_data_dir: "{{ monitoring_stack_base_dir }}/prometheus"
monitoring_stack_prometheus_config_dir: "{{ monitoring_stack_base_dir }}/prometheus/config"
monitoring_stack_loki_data_dir: "{{ monitoring_stack_base_dir }}/loki"
monitoring_stack_loki_config_dir: "{{ monitoring_stack_base_dir }}/loki/config"

# Docker Compose configuration
monitoring_stack_compose_dir: "/opt/monitoring"
monitoring_stack_compose_file: "{{ monitoring_stack_compose_dir }}/docker-compose.yml"

# Grafana configuration
monitoring_stack_grafana_version: "12.4.3"
monitoring_stack_grafana_port: 3000
monitoring_stack_grafana_admin_user: "admin"
monitoring_stack_grafana_admin_password: "{{ vault_grafana_admin_password }}"

# Prometheus configuration
monitoring_stack_prometheus_version: "v3.11.2"
monitoring_stack_prometheus_port: 9090
monitoring_stack_prometheus_retention: "30d"

# Loki configuration
monitoring_stack_loki_version: "3.7.1"
monitoring_stack_loki_port: 3100
monitoring_stack_loki_retention_days: 30

# cAdvisor configuration
monitoring_stack_cadvisor_version: "0.56.2"
monitoring_stack_cadvisor_port: 8080

# Proxmox Exporter configuration
monitoring_stack_proxmox_exporter_version: "3.8.2"
monitoring_stack_proxmox_exporter_port: 9221
monitoring_stack_proxmox_api_url: "https://{{ hostvars['n5p']['ansible_host'] }}:8006"
monitoring_stack_proxmox_api_verify_ssl: false

# Omada Exporter configuration
monitoring_stack_omada_exporter_version: "0.13.1"
monitoring_stack_omada_exporter_port: 9202
monitoring_stack_omada_controller_url: "https://{{ hostvars['omada']['ansible_host'] }}:8043"
monitoring_stack_omada_site: "Home"

# Docker network
monitoring_stack_docker_network: "monitoring"

# Traefik integration
monitoring_stack_domain: "{{ domain | default('home.local') }}"
monitoring_stack_grafana_subdomain: "grafana"

# Speedtest Exporter configuration (Ookla)
# Image is abandoned upstream (last push 2024-09-05). Pinned to the current
# working digest so Docker Hub tag drift / deletion can't break us.
# To unpin: switch to a maintained fork and rewrite dashboards (metric names differ).
monitoring_stack_speedtest_exporter_digest: "sha256:143d88cac32ecb4fbfc7a3af14ac740de487fe09a7d891826e1ffda662473113"
monitoring_stack_speedtest_exporter_port: 9469
# Server IDs (comma-separated for multiple servers):
#   Slovenia: 41998 (Telekom), 53146 (Telemach), 54112 (A1)
#   Frankfurt: 19034 (Vodafone), 54504 (Deutsche Glasfaser), 32298 (SYNLINQ)
# Using Telekom Slovenije (41998). The previous T-2 id (11367) was
# decommissioned by Ookla - the CLI threw NoServersException, the script
# exited 0 with no output, and the dashboard silently showed "No data".
monitoring_stack_speedtest_server_ids: "41998"
monitoring_stack_speedtest_scrape_interval: "30m"
monitoring_stack_speedtest_scrape_timeout: "300s"

# Telegram alerting
monitoring_stack_grafana_telegram_bot_token: "{{ vault_grafana_telegram_bot_token }}"
monitoring_stack_grafana_telegram_chat_id: "{{ vault_grafana_telegram_chat_id }}"
