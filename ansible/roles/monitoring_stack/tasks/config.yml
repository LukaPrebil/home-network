---
# Deploy configuration files for monitoring stack

- name: Deploy Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ monitoring_stack_prometheus_config_dir }}/prometheus.yml"
    mode: '0644'
  notify: Restart Monitoring Stack
  tags:
    - monitoring-stack
    - config
    - prometheus

- name: Deploy Loki configuration
  ansible.builtin.template:
    src: loki-config.yml.j2
    dest: "{{ monitoring_stack_loki_config_dir }}/loki-config.yml"
    mode: '0644'
  notify: Restart Monitoring Stack
  tags:
    - monitoring-stack
    - config
    - loki

- name: Deploy Grafana datasource provisioning
  ansible.builtin.template:
    src: grafana-datasources.yml.j2
    dest: "{{ monitoring_stack_grafana_data_dir }}/provisioning/datasources/datasources.yml"
    mode: '0644'
  notify: Restart Monitoring Stack
  tags:
    - monitoring-stack
    - config
    - grafana

- name: Deploy Grafana dashboard provisioning
  ansible.builtin.template:
    src: grafana-dashboards.yml.j2
    dest: "{{ monitoring_stack_grafana_data_dir }}/provisioning/dashboards/dashboards.yml"
    mode: '0644'
  notify: Restart Monitoring Stack
  tags:
    - monitoring-stack
    - config
    - grafana

- name: Find all dashboard JSON files
  ansible.builtin.find:
    paths: "{{ role_path }}/files/dashboards"
    patterns: "*.json"
  register: monitoring_stack_dashboard_files
  delegate_to: localhost
  become: false
  tags:
    - monitoring-stack
    - config
    - grafana

- name: Deploy Grafana dashboard definitions
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ monitoring_stack_grafana_data_dir }}/provisioning/dashboards/definitions/{{ item.path | basename }}"
    mode: '0644'
  loop: "{{ monitoring_stack_dashboard_files.files }}"
  when: monitoring_stack_dashboard_files.files | length > 0
  notify: Restart Monitoring Stack
  tags:
    - monitoring-stack
    - config
    - grafana

# No notify: the compose deploy task (state: present) recreates on template
# changes; `docker compose restart` would double-bounce without re-reading them.
- name: Deploy Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ monitoring_stack_compose_file }}"
    mode: '0644'
  tags:
    - monitoring-stack
    - config

- name: Deploy Grafana alerting message templates
  ansible.builtin.template:
    src: grafana-alerting-templates.yml.j2
    dest: "{{ monitoring_stack_grafana_data_dir }}/provisioning/alerting/templates.yml"
    mode: '0644'
  notify: Restart Monitoring Stack
  tags:
    - monitoring-stack
    - config
    - grafana
    - alerting

- name: Deploy Grafana alerting contact points
  ansible.builtin.template:
    src: grafana-alerting-contact-points.yml.j2
    dest: "{{ monitoring_stack_grafana_data_dir }}/provisioning/alerting/contact-points.yml"
    mode: '0644'
  notify: Restart Monitoring Stack
  tags:
    - monitoring-stack
    - config
    - grafana
    - alerting

- name: Deploy Grafana alerting notification policies
  ansible.builtin.template:
    src: grafana-alerting-notification-policies.yml.j2
    dest: "{{ monitoring_stack_grafana_data_dir }}/provisioning/alerting/notification-policies.yml"
    mode: '0644'
  notify: Restart Monitoring Stack
  tags:
    - monitoring-stack
    - config
    - grafana
    - alerting

- name: Deploy Grafana alerting rules
  ansible.builtin.template:
    src: grafana-alerting-rules.yml.j2
    dest: "{{ monitoring_stack_grafana_data_dir }}/provisioning/alerting/rules.yml"
    mode: '0644'
  notify: Restart Monitoring Stack
  tags:
    - monitoring-stack
    - config
    - grafana
    - alerting
