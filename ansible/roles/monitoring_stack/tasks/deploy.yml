---
# Deploy and manage monitoring stack with Docker Compose

- name: Pull monitoring stack Docker images
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_compose_dir }}"
    pull: "always"
  register: monitoring_pull
  tags:
    - monitoring-stack
    - deploy

- name: Start monitoring stack
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_compose_dir }}"
    state: present
  register: monitoring_deploy
  tags:
    - monitoring-stack
    - deploy

- name: Wait for Prometheus to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ prometheus_port }}/-/ready"
    method: GET
    status_code: 200
  register: prometheus_health
  until: prometheus_health.status == 200
  retries: 30
  delay: 5
  changed_when: false
  tags:
    - monitoring-stack
    - deploy
    - healthcheck

- name: Wait for Grafana to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ grafana_port }}/api/health"
    method: GET
    status_code: 200
  register: grafana_health
  until: grafana_health.status == 200
  retries: 30
  delay: 5
  changed_when: false
  tags:
    - monitoring-stack
    - deploy
    - healthcheck

- name: Wait for Loki to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ loki_port }}/ready"
    method: GET
    status_code: 200
  register: loki_health
  until: loki_health.status == 200
  retries: 30
  delay: 5
  changed_when: false
  tags:
    - monitoring-stack
    - deploy
    - healthcheck

- name: Display monitoring stack deployment status
  ansible.builtin.debug:
    msg:
      - "Monitoring stack is now running!"
      - "Grafana: http://{{ ansible_host }}:{{ grafana_port }} (admin/{{ grafana_admin_password }})"
      - "Prometheus: http://{{ ansible_host }}:{{ prometheus_port }}"
      - "Loki: http://{{ ansible_host }}:{{ loki_port }}"
  tags:
    - monitoring-stack
    - deploy
