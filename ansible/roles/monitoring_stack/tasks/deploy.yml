---
# Deploy and manage monitoring stack with Docker Compose

# Pinned backend cert (M-10): public material, verified out of band. The omada
# exporter's SSL_CERT_FILE points at this file via the compose mount. The PVE
# root CA pin was removed - see the defaults comment (M-10/M-33).
- name: Copy pinned Omada controller certificate into the compose directory
  ansible.builtin.copy:
    src: omada-tls.crt
    dest: "{{ monitoring_stack_compose_dir }}/omada-tls.crt"
    owner: root
    group: root
    mode: '0644'

- name: Resolve the omada controller hostname for the exporter
  # The controller cert's SAN is DNS:Omada only, so the exporter URL must use
  # the name; there is no DNS record for it (search domain home.local).
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '\s[Oo]mada(\s|$)'
    line: "{{ hostvars['omada']['ansible_host'] }} omada"
    owner: root
    group: root
    mode: '0644'

- name: Pull monitoring stack Docker images
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_stack_compose_dir }}"
    pull: "always"
  register: monitoring_stack_pull
  tags:
    - monitoring-stack
    - deploy

- name: Start monitoring stack
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_stack_compose_dir }}"
    state: present
  register: monitoring_stack_deploy
  tags:
    - monitoring-stack
    - deploy

- name: Wait for Prometheus to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ monitoring_stack_prometheus_port }}/-/ready"
    method: GET
    status_code: 200
  register: monitoring_stack_prometheus_health
  until: monitoring_stack_prometheus_health.status == 200
  retries: 30
  delay: 5
  changed_when: false
  tags:
    - monitoring-stack
    - deploy
    - healthcheck

- name: Wait for Grafana to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ monitoring_stack_grafana_port }}/api/health"
    method: GET
    status_code: 200
  register: monitoring_stack_grafana_health
  until: monitoring_stack_grafana_health.status == 200
  retries: 30
  delay: 5
  changed_when: false
  tags:
    - monitoring-stack
    - deploy
    - healthcheck

- name: Wait for Loki to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ monitoring_stack_loki_port }}/ready"
    method: GET
    status_code: 200
  register: monitoring_stack_loki_health
  until: monitoring_stack_loki_health.status == 200
  retries: 30
  delay: 5
  changed_when: false
  tags:
    - monitoring-stack
    - deploy
    - healthcheck

- name: Display monitoring stack deployment status
  ansible.builtin.debug:
    msg:
      - "Monitoring stack is now running!"
      - "Grafana: http://{{ ansible_host }}:{{ monitoring_stack_grafana_port }} (admin user; password in vault)"
      - "Prometheus: http://{{ ansible_host }}:{{ monitoring_stack_prometheus_port }}"
      - "Loki: http://{{ ansible_host }}:{{ monitoring_stack_loki_port }}"
  tags:
    - monitoring-stack
    - deploy
