---
# Create directories for the monitoring stack

- name: Create monitoring compose directory
  ansible.builtin.file:
    path: "{{ monitoring_stack_compose_dir }}"
    state: directory
    mode: '0755'
  tags:
    - monitoring-stack
    - setup

- name: Create monitoring directories on Proxmox host (for unprivileged LXCs)
  ansible.builtin.file:
    path: "/mnt/pve/truenas-docker/{{ item }}"
    state: directory
    mode: '0777'
  loop:
    - grafana
    - grafana/provisioning
    - grafana/provisioning/datasources
    - grafana/provisioning/dashboards
    - grafana/provisioning/dashboards/definitions
    - grafana/provisioning/alerting
    - prometheus
    - prometheus/config
    - loki
    - loki/config
  delegate_to: "{{ groups['proxmox_hosts'][0] }}"
  when: inventory_hostname in groups.get('lxc_containers', [])
  tags:
    - monitoring-stack
    - setup

- name: Create monitoring directories locally (for VMs)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ monitoring_stack_grafana_data_dir }}"
    - "{{ monitoring_stack_grafana_data_dir }}/provisioning"
    - "{{ monitoring_stack_grafana_data_dir }}/provisioning/datasources"
    - "{{ monitoring_stack_grafana_data_dir }}/provisioning/dashboards"
    - "{{ monitoring_stack_grafana_data_dir }}/provisioning/dashboards/definitions"
    - "{{ monitoring_stack_grafana_data_dir }}/provisioning/alerting"
    - "{{ monitoring_stack_prometheus_data_dir }}"
    - "{{ monitoring_stack_prometheus_config_dir }}"
    - "{{ monitoring_stack_loki_data_dir }}"
    - "{{ monitoring_stack_loki_config_dir }}"
  when: inventory_hostname not in groups.get('lxc_containers', [])
  tags:
    - monitoring-stack
    - setup
