---
# Create directories for the monitoring stack

- name: Create monitoring compose directory
  ansible.builtin.file:
    path: "{{ monitoring_stack_compose_dir }}"
    state: directory
    mode: '0755'
  tags:
    - monitoring-stack
    - setup

# Data dirs live on the local LXC rootfs (see monitoring_stack_base_dir) - no
# host-delegated NFS dirs: the prior /mnt/pve/truenas-docker path was the source
# of the silent-empty-stub failure mode and is gone after the relocation.
# 0777 preserves the existing writability for the non-root container uids
# (grafana 472, prometheus 65534/nobody, loki 10001), which create their own
# files under these roots. Tightening to per-uid ownership is a wave-6 task.
- name: Create monitoring data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0777'
  loop:
    - "{{ monitoring_stack_grafana_data_dir }}"
    - "{{ monitoring_stack_prometheus_data_dir }}"
    - "{{ monitoring_stack_loki_data_dir }}"
  tags:
    - monitoring-stack
    - setup

# Config + provisioning hold root-owned files the containers only read.
- name: Create monitoring config and provisioning directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ monitoring_stack_grafana_data_dir }}/provisioning"
    - "{{ monitoring_stack_grafana_data_dir }}/provisioning/datasources"
    - "{{ monitoring_stack_grafana_data_dir }}/provisioning/dashboards"
    - "{{ monitoring_stack_grafana_data_dir }}/provisioning/dashboards/definitions"
    - "{{ monitoring_stack_grafana_data_dir }}/provisioning/alerting"
    - "{{ monitoring_stack_prometheus_config_dir }}"
    - "{{ monitoring_stack_loki_config_dir }}"
  tags:
    - monitoring-stack
    - setup
