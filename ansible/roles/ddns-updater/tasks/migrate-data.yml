---
# Migrate ddns-updater data from rpi4 (two-stage: rpi4 → local → containers VM)

# Stage 1: Sync from rpi4 to local Ansible control node (one-time)
- name: Create local backup directory for ddns-updater data
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../backups/ddns-updater"
    state: directory
    mode: '0755'
  delegate_to: localhost
  run_once: true
  when: ddns_updater_migrate_data | bool

- name: Check if local backup already exists
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../backups/ddns-updater/config.json"
  register: local_backup
  delegate_to: localhost
  run_once: true
  when: ddns_updater_migrate_data | bool

- name: Stop ddns-updater on rpi4 for initial sync
  community.docker.docker_compose_v2:
    project_src: "/home/luka/ha"
    services:
      - ddns-updater
    state: stopped
  delegate_to: "{{ ddns_updater_source_host }}"
  when:
    - ddns_updater_migrate_data | bool
    - not local_backup.stat.exists
  run_once: true

- name: Sync ddns-updater data from rpi4 to local backup
  ansible.posix.synchronize:
    src: "{{ ddns_updater_source_data_dir }}/"
    dest: "{{ playbook_dir }}/../backups/ddns-updater/"
    mode: pull
    recursive: yes
    delete: no
    checksum: yes
    rsync_opts:
      - "--exclude=*.log"
      - "--exclude=.DS_Store"
  delegate_to: "{{ ddns_updater_source_host }}"
  when:
    - ddns_updater_migrate_data | bool
    - not local_backup.stat.exists
  run_once: true

- name: Restart ddns-updater on rpi4 after initial sync
  community.docker.docker_compose_v2:
    project_src: "/home/luka/ha"
    services:
      - ddns-updater
    state: started
  delegate_to: "{{ ddns_updater_source_host }}"
  when:
    - ddns_updater_migrate_data | bool
    - not local_backup.stat.exists
  run_once: true

- name: Display Stage 1 status
  ansible.builtin.debug:
    msg: "{{ 'Stage 1: Data synced from rpi4 to local backup' if not local_backup.stat.exists else 'Stage 1: Skipped - local backup already exists' }}"
  when: ddns_updater_migrate_data | bool
  run_once: true

# Stage 2: Push from local backup to containers VM (idempotent)
- name: Sync ddns-updater data from local backup to containers VM
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../backups/ddns-updater/"
    dest: "{{ ddns_updater_data_dir }}/"
    mode: push
    recursive: yes
    delete: no
    checksum: yes
  when: ddns_updater_migrate_data | bool

- name: Fix ownership of migrated data
  ansible.builtin.file:
    path: "{{ ddns_updater_data_dir }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    recurse: yes
  when: ddns_updater_migrate_data | bool

- name: Display migration complete status
  ansible.builtin.debug:
    msg:
      - "ddns-updater data migration complete!"
      - "Local backup: {{ playbook_dir }}/../backups/ddns-updater/"
      - "Destination: {{ ddns_updater_data_dir }}"
      - "Source rpi4 instance still running (not affected)"
  when: ddns_updater_migrate_data | bool
