---
# Create required directories for ddns-updater

- name: Create ddns-updater base directory
  ansible.builtin.file:
    path: "{{ ddns_updater_base_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Create ddns-updater data directory
  ansible.builtin.file:
    path: "{{ ddns_updater_data_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
