---
# ddns-updater default configuration

# Base directory for ddns-updater
ddns_updater_base_dir: "/srv/docker/ddns-updater"
ddns_updater_data_dir: "{{ ddns_updater_base_dir }}/data"

# Docker image
ddns_updater_image: "qmcgaw/ddns-updater:v2.9.0"
ddns_updater_container_name: "ddns-updater"

# Network configuration
ddns_updater_port: 8000
ddns_updater_docker_network: "traefik"  # Connect to Traefik network (optional for web UI)

# Service state (can be overridden during migration)
ddns_updater_service_state: "started"  # Options: started, stopped, present
