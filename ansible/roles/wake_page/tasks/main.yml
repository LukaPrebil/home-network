---
# Wake page: sends the n5p magic packet and reports whether it came back.
#
# Native systemd unit rather than a container, so the recovery path does not
# depend on the Docker daemon that also runs Matter Server on this host.

- name: Create the wake page service account
  ansible.builtin.user:
    name: "{{ wake_page_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Create the wake page directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ wake_page_lib_dir }}"
    - "{{ wake_page_config_dir }}"

- name: Install the wake page backend
  ansible.builtin.copy:
    src: wake_page.py
    dest: "{{ wake_page_lib_dir }}/wake_page.py"
    owner: root
    group: root
    mode: '0644'
  notify: Restart wake page

- name: Render the wake page
  ansible.builtin.template:
    src: page.html.j2
    dest: "{{ wake_page_page_path }}"
    owner: root
    group: root
    mode: '0644'
  notify: Restart wake page

- name: Render the wake page configuration
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ wake_page_config_dir }}/config.json"
    owner: root
    group: root
    mode: '0644'
  notify: Restart wake page

- name: Install the wake page unit
  ansible.builtin.template:
    src: wake-page.service.j2
    dest: /etc/systemd/system/wake-page.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart wake page

- name: Enable and start the wake page
  # Not dry-runnable on first provision: check mode simulates the unit template
  # above (the file is never written), so systemd has no service to enable.
  when: not ansible_check_mode
  ansible.builtin.systemd:
    name: wake-page
    enabled: true
    state: started
    daemon_reload: true
  notify: Restart wake page

- name: Flush handlers before the readiness check
  ansible.builtin.meta: flush_handlers

- name: Check the wake page answers on loopback
  ansible.builtin.uri:
    url: "{{ wake_page_serve_target }}/status"
    headers:
      Tailscale-User-Login: "{{ wake_page_allow_login }}"
    status_code: 200
  register: wake_page_health
  until: wake_page_health.status == 200
  retries: 30
  delay: 5
  changed_when: false

# Read-only probe. Publishing rewrites tailscaled state, so it only runs when
# the config does not already point at this service.
- name: Read the Tailscale Serve configuration
  ansible.builtin.command: tailscale serve status --json
  register: wake_page_serve_status
  changed_when: false
  check_mode: false

- name: Publish the wake page to the tailnet
  # `tailscale serve` waits on stdin when HTTPS certificates are not enabled for
  # the tailnet, and prints a consent URL while it waits. The timeout keeps a
  # converge from hanging on that, and the assert below surfaces the URL.
  ansible.builtin.command: >-
    timeout 30 tailscale serve --bg --https={{ wake_page_serve_port }}
    {{ wake_page_serve_target }}
  register: wake_page_serve_publish
  changed_when: true
  failed_when: false
  when:
    - not ansible_check_mode
    - wake_page_serve_target not in wake_page_serve_status.stdout

- name: Assert the wake page is published
  ansible.builtin.assert:
    that: wake_page_serve_publish.rc == 0
    fail_msg: >-
      tailscale serve did not publish {{ wake_page_serve_target }}.
      {{ wake_page_serve_publish.stdout | default('') | trim }}
      Open the login.tailscale.com/f/serve URL printed above in a browser to
      enable Serve for this tailnet, then converge again.
    quiet: true
  when:
    - wake_page_serve_publish.rc is defined
    - wake_page_serve_publish.rc != 0
