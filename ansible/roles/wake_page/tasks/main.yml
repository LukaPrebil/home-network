---
# Wake page: sends the n5p magic packet and reports whether it came back.
#
# Native systemd unit rather than a container, so the recovery path does not
# depend on the Docker daemon that also runs Matter Server on this host.

- name: Create the wake page service account
  ansible.builtin.user:
    name: "{{ wake_page_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Create the wake page directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ wake_page_lib_dir }}"
    - "{{ wake_page_config_dir }}"

- name: Install the wake page backend
  ansible.builtin.copy:
    src: wake_page.py
    dest: "{{ wake_page_lib_dir }}/wake_page.py"
    owner: root
    group: root
    mode: '0644'
  notify: Restart wake page

- name: Render the wake page configuration
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ wake_page_config_dir }}/config.json"
    owner: root
    group: root
    mode: '0644'
  notify: Restart wake page

- name: Install the wake page unit
  ansible.builtin.template:
    src: wake-page.service.j2
    dest: /etc/systemd/system/wake-page.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart wake page

- name: Enable and start the wake page
  # Not dry-runnable on first provision: check mode simulates the unit template
  # above (the file is never written), so systemd has no service to enable.
  when: not ansible_check_mode
  ansible.builtin.systemd:
    name: wake-page
    enabled: true
    state: started
    daemon_reload: true
  notify: Restart wake page
