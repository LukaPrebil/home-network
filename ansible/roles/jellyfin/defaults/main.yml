---
# Jellyfin role default variables

# Jellyfin version
jellyfin_version: "10.11.8"

# Base directories
jellyfin_base_dir: "/mnt/plex-apps"  # NFS mount point for app configs
jellyfin_media_dir: "/mnt/plex-bulk"  # NFS mount point for media library
jellyfin_config_dir: "{{ jellyfin_base_dir }}/jellyfin"
jellyfin_cache_dir: "{{ jellyfin_config_dir }}/cache"

# Docker Compose configuration
jellyfin_compose_dir: "/opt/jellyfin"
jellyfin_compose_file: "{{ jellyfin_compose_dir }}/docker-compose.yml"

# Jellyfin configuration
jellyfin_port: 8096  # Main Jellyfin HTTP port
jellyfin_https_port: 8920  # HTTPS port
jellyfin_network: "host"  # Use host networking for best compatibility and DLNA

# Media library structure on plex-bulk
jellyfin_movies_dir: "{{ jellyfin_media_dir }}/movies"
jellyfin_tv_dir: "{{ jellyfin_media_dir }}/tv"
jellyfin_downloads_dir: "{{ jellyfin_media_dir }}/downloads"

# Docker network (if not using host mode)
jellyfin_docker_network: "jellyfin"

# GPU configuration
jellyfin_gpu_vendor: "amd"  # amd, nvidia, or intel
jellyfin_enable_gpu: true

# Timezone
jellyfin_timezone: "{{ timezone | default('UTC') }}"
