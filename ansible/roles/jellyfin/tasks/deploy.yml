---
# Deploy and manage Jellyfin with Docker Compose

# Media stays on NFS post-relocation; guard it so a stale-stub bind (empty media
# tree) fails fast instead of Jellyfin coming up with an empty library.
- name: Assert media library path is an NFS mount
  ansible.builtin.include_role:
    name: common
    tasks_from: assert_nfs_mount
  vars:
    common_nfs_mount_path: "{{ jellyfin_media_dir }}"
  tags:
    - jellyfin
    - deploy

- name: Deploy Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ jellyfin_compose_file }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'

- name: Pull Jellyfin Docker image
  community.docker.docker_compose_v2:
    project_src: "{{ jellyfin_compose_dir }}"
    pull: "always"
  register: jellyfin_pull

- name: Start Jellyfin service
  community.docker.docker_compose_v2:
    project_src: "{{ jellyfin_compose_dir }}"
    state: present
  register: jellyfin_deploy

- name: Wait for Jellyfin to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ jellyfin_port }}/health"
    method: GET
    status_code: 200
  register: jellyfin_health
  until: jellyfin_health.status == 200
  retries: 30
  delay: 5
  changed_when: false

- name: Display Jellyfin deployment status
  ansible.builtin.debug:
    msg:
      - "Jellyfin deployment complete!"
      - "Access Jellyfin at: http://{{ ansible_host }}:{{ jellyfin_port }}"
      - "Public URL: https://jellyfin.lukapg.dev (via Traefik - after configuring)"
      - ""
      - "GPU Transcoding: {{ 'Enabled (AMD)' if jellyfin_enable_gpu else 'Disabled' }}"
      - "Media Library: Shared with Plex"
