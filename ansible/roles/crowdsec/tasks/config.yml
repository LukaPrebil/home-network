---
# Deploy CrowdSec configuration files

# No notify: the env_file is read by the compose deploy task (state: present),
# which recreates on env_file content drift - same apply path as the compose file.
- name: Deploy CrowdSec secrets env file
  ansible.builtin.template:
    src: crowdsec.env.j2
    dest: "{{ crowdsec_base_dir }}/crowdsec.env"
    owner: root
    group: root
    mode: '0600'
  no_log: true  # don't print the rendered secret under --check --diff

# No notify: the compose deploy task (state: present) recreates on template
# changes; `docker compose restart` would double-bounce without re-reading them.
- name: Deploy CrowdSec Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ crowdsec_compose_file }}"
    owner: root
    group: root
    mode: '0644'

- name: Deploy CrowdSec config overlay (Prometheus metrics)
  ansible.builtin.template:
    src: config.yaml.local.j2
    dest: "{{ crowdsec_config_dir }}/config.yaml.local"
    owner: root
    group: root
    mode: '0644'
  notify: Restart CrowdSec

- name: Deploy Traefik log acquisition config
  ansible.builtin.template:
    src: acquis-traefik.yaml.j2
    dest: "{{ crowdsec_config_dir }}/acquis.d/traefik.yaml"
    owner: root
    group: root
    mode: '0644'
  notify: Restart CrowdSec
