---
# CrowdSec default configuration

# Directories
crowdsec_base_dir: "/opt/crowdsec"
crowdsec_config_dir: "{{ crowdsec_base_dir }}/config"
crowdsec_data_dir: "{{ crowdsec_base_dir }}/data"

# Docker image
crowdsec_image: "crowdsecurity/crowdsec:v1.7.8"
crowdsec_container_name: "crowdsec"

# Docker Compose
crowdsec_compose_file: "{{ crowdsec_base_dir }}/docker-compose.yml"

# LAPI host port (exposed on localhost only for cscli access from host)
# Note: internal container port is always 8080; this maps the host-side port
# Default changed from 8080 to avoid conflict with Traefik dashboard
crowdsec_lapi_port: 9090

# Prometheus metrics port (exposed for Prometheus scraping)
crowdsec_metrics_port: 6060

# Collections to install on first start
# crowdsecurity/traefik includes: traefik log parser + base HTTP attack scenarios
crowdsec_collections:
  - "crowdsecurity/traefik"

# Bouncer API key (pre-registered on first start via BOUNCER_KEY_traefik env var)
# Must match traefik_crowdsec_bouncer_key - set both in host_vars, vault-encrypted
#
# `cscli bouncers list` shows two rows for this one key and both belong there.
# `traefik` (auto_created false) is the registration the entrypoint creates from
# BOUNCER_KEY_traefik and is what actually holds the key; its last_pull froze
# when the Traefik plugin moved to v1.7, which started announcing itself per IP.
# `traefik@<traefik-container-ip>` (auto_created true) is the child LAPI derives
# from the same key and is the row that keeps pulling. The frozen parent looks
# like cruft but is not removable: deleting it revokes the key and takes the
# child with it, so the live bouncer 403s on every stream pull until the
# container is restarted to re-register.
crowdsec_bouncer_key: ""

# Traefik log path on host (bind-mounted read-only into CrowdSec)
crowdsec_traefik_logs_dir: "/opt/traefik/logs"

# Docker network (must match Traefik's network for LAPI connectivity)
crowdsec_docker_network: "traefik"
