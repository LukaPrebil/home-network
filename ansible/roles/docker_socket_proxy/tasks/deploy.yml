---
# Deploy the docker-socket-proxy container

# The consumers (autoheal, Uptime Kuma) join this network as external, so it must
# exist before any of them deploy. This role runs before them in each play.
- name: Create the docker-socket-proxy network
  community.docker.docker_network:
    name: "{{ docker_socket_proxy_network }}"
    driver: bridge
    state: present

# The proxy runs as nobody and reaches the root:docker socket via group perms,
# so it needs the host's Docker socket gid as its group. That gid varies per host
# (and per LXC), so resolve it from the live socket instead of hardcoding.
- name: Stat the Docker socket to resolve its group id
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: docker_socket_proxy_sock_stat

- name: Fail if the Docker socket is missing
  ansible.builtin.assert:
    that:
      - docker_socket_proxy_sock_stat.stat.exists
    fail_msg: "/var/run/docker.sock not found - is Docker installed and running on this host?"
    quiet: true

- name: Set the Docker socket gid for the proxy's group
  ansible.builtin.set_fact:
    docker_socket_proxy_socket_gid: "{{ docker_socket_proxy_sock_stat.stat.gid }}"

# No notify: state: present recreates on compose drift; the proxy has no
# mounted config to hot-reload.
- name: Deploy docker-socket-proxy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ docker_socket_proxy_compose_dir }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'

- name: Start docker-socket-proxy service
  community.docker.docker_compose_v2:
    project_src: "{{ docker_socket_proxy_compose_dir }}"
    state: present

# Port 2375 is internal to the proxy network by design (never published to the
# host), so the running container state is the readiness signal. The default('')
# keeps the until null-safe while compose recreates.
- name: Wait for docker-socket-proxy container to be running
  community.docker.docker_container_info:
    name: "{{ docker_socket_proxy_container_name }}"
  register: docker_socket_proxy_info
  until: docker_socket_proxy_info.exists and (docker_socket_proxy_info.container.State.Status | default('')) == 'running'
  retries: 30
  delay: 5
