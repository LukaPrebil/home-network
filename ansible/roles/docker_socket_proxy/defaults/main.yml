---
# Docker Socket Proxy Role - Default Configuration
#
# tecnativa/docker-socket-proxy sits in front of the raw Docker socket so that
# consumers (autoheal, Uptime Kuma) never mount /var/run/docker.sock directly.
# This is the ONLY container that touches the raw socket; it serves a scoped
# subset of the Docker API over tcp on an internal-only bridge network.
#
# The cross-role contract (network name, container name, port, endpoint) lives in
# group_vars/all.yml so this role and its consumers cannot drift.

# Image pinned to a multi-arch manifest digest (works on amd64 LXCs and rpi4
# arm64). Upgrade = re-capture the running digest and bump deliberately.
docker_socket_proxy_image: "tecnativa/docker-socket-proxy"
docker_socket_proxy_version: "0.3.0"
docker_socket_proxy_image_digest: "sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2"
docker_socket_proxy_image_ref: "{{ docker_socket_proxy_image }}:{{ docker_socket_proxy_version }}{{ ('@' + docker_socket_proxy_image_digest) if docker_socket_proxy_image_digest else '' }}"

docker_socket_proxy_compose_dir: "/opt/docker-socket-proxy"
docker_socket_proxy_timezone: "{{ timezone | default('UTC') }}"

# API surface. CONTAINERS=1: GET /containers (autoheal's unhealthy filter +
# Kuma's docker monitors). ALLOW_RESTARTS=1: POST /containers/{id}/restart only
# (autoheal's action) without opening POST globally. Everything else stays at the
# image's secure-by-default deny.
docker_socket_proxy_containers: 1
docker_socket_proxy_allow_restarts: 1
