---
# Docker Socket Proxy Role - Default Configuration
#
# wollomatic/socket-proxy fronts the raw Docker socket so consumers (autoheal,
# Uptime Kuma) never mount /var/run/docker.sock. It is the ONLY container that
# touches the raw socket and exposes ONLY the exact method+path pairs the
# consumers need - per-method regex allowlists, default-deny everything else.
#
# Why not tecnativa/docker-socket-proxy: it cannot express "list + restart-only".
# Its global POST-deny rule runs before its ALLOW_RESTARTS allow, so restarts
# require POST=1, which (with CONTAINERS=1) also permits POST /containers/create
# - a privileged-create host-escape vector. wollomatic's per-method regexes avoid
# that entirely.
#
# The cross-role contract (network, container name, port, endpoint) lives in
# group_vars/all/main.yml so this role and its consumers cannot drift.

# Pinned to a multi-arch manifest digest (amd64 LXCs + rpi4 arm64). Upgrade =
# re-capture the running digest and bump deliberately.
docker_socket_proxy_image: "wollomatic/socket-proxy"
docker_socket_proxy_version: "1"
docker_socket_proxy_image_digest: "sha256:ad9df81849436b5ddae36396e2aefd6562d4cd587d1b65fcb5ac71e4578c9da3"
docker_socket_proxy_image_ref: "{{ docker_socket_proxy_image }}:{{ docker_socket_proxy_version }}{{ ('@' + docker_socket_proxy_image_digest) if docker_socket_proxy_image_digest else '' }}"

docker_socket_proxy_compose_dir: "/opt/docker-socket-proxy"
docker_socket_proxy_loglevel: "INFO"

# Runs as nobody (65534); the primary group is set to the host's Docker socket
# gid at deploy time (looked up in deploy.yml) so it can read the socket without
# running as root. Combined with cap_drop ALL + read_only + no-new-privileges.
docker_socket_proxy_uid: "65534"

# Source allowlist. The proxy is published only on the internal socket-proxy
# network (never to the host), so network membership is the access boundary;
# 0.0.0.0/0 trusts any container already on that isolated network.
docker_socket_proxy_allowfrom: "0.0.0.0/0"

# Method+path allowlists (anchored regex; every other method/path is denied).
#   GET  : _ping/version/info, container list (autoheal + Kuma's docker-host test)
#   POST : container restart only (autoheal) - NOT create/kill/stop/exec/etc.
#
# Container inspect (GET /containers/<name>/json) is deliberately NOT allowed:
# inspect returns Config.Env, i.e. every value Compose loaded from env_files, so
# allowing it let any container on the socket-proxy network read those secrets
# (env_file 0600 modes do not apply once Compose has swallowed the values).
# Kuma's docker-type monitors require inspect, so they were retired with this
# change (fix-list M-04, 2026-09-03); autoheal needs only list + restart.
docker_socket_proxy_allow_get: "^(/v[0-9.]+)?/(_ping|version|info|containers/json)$"
docker_socket_proxy_allow_post: "^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/restart$"
