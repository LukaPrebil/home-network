---
# Configure NFS mount for Paperless-ngx document storage
# Note: This role targets the 'containers' VM which supports direct NFS mounts.
# For LXC containers, NFS should be mounted on the Proxmox host and bind-mounted in.

- name: Install NFS client packages
  ansible.builtin.apt:
    name:
      - nfs-common
    state: present

- name: Create Paperless-ngx NFS mount point
  ansible.builtin.file:
    path: "{{ paperless_nfs_mount_point }}"
    state: directory
    mode: '0755'

- name: Check if storage is already mounted
  ansible.builtin.command: mountpoint -q {{ paperless_nfs_mount_point }}
  register: paperless_nfs_mounted
  failed_when: false
  changed_when: false

- name: Mount TrueNAS NFS share for Paperless-ngx documents
  ansible.posix.mount:
    path: "{{ paperless_nfs_mount_point }}"
    src: "{{ paperless_nfs_server }}:{{ paperless_nfs_share }}"
    fstype: nfs
    opts: "{{ paperless_nfs_opts }}"
    state: mounted
  when: paperless_nfs_mounted.rc != 0

- name: Create NFS subdirectories for Paperless-ngx
  ansible.builtin.file:
    path: "{{ paperless_nfs_mount_point }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - media
    - export

- name: Verify storage is accessible
  ansible.builtin.stat:
    path: "{{ paperless_nfs_mount_point }}"
  register: nfs_mount_check

- name: Display storage mount status
  ansible.builtin.debug:
    msg: "Paperless-ngx document storage accessible at {{ paperless_nfs_mount_point }}"
  when: nfs_mount_check.stat.exists
