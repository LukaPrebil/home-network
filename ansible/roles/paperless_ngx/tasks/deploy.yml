---
# Deploy and manage Paperless-ngx with Docker Compose

- name: Assert Paperless-ngx document path is an NFS mount
  ansible.builtin.include_role:
    name: common
    tasks_from: assert_nfs_mount
  vars:
    common_nfs_mount_path: "{{ paperless_ngx_nfs_mount_point }}"

- name: Assert Docker volumes path is an NFS mount
  ansible.builtin.include_role:
    name: common
    tasks_from: assert_nfs_mount
  vars:
    common_nfs_mount_path: "{{ paperless_ngx_base_dir }}"

- name: Ensure traefik network exists
  community.docker.docker_network:
    name: "{{ paperless_ngx_docker_network }}"
    state: present

- name: Deploy Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ paperless_ngx_compose_file }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'

- name: Deploy Paperless-ngx stack
  community.docker.docker_compose_v2:
    project_src: "{{ paperless_ngx_base_dir }}"
    pull: "always"
    state: present
  register: paperless_ngx_deploy

# 302 covers the redirect to the login page when redirect-following is off
- name: Wait for Paperless-ngx to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ paperless_ngx_port }}/"
    method: GET
    status_code: [200, 302]
  register: paperless_ngx_health
  until: paperless_ngx_health.status in [200, 302]
  retries: 30
  delay: 5
  changed_when: false

- name: Display Paperless-ngx deployment status
  ansible.builtin.debug:
    msg:
      - "Paperless-ngx deployment complete!"
      - "Access Paperless-ngx at: http://{{ ansible_host }}:{{ paperless_ngx_port }}"
      - "Public URL: https://documents.lukapg.dev (via Traefik)"
