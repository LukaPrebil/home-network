---
# Create required directories for Paperless-ngx

- name: Create Paperless-ngx base directory
  ansible.builtin.file:
    path: "{{ paperless_ngx_base_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Create Paperless-ngx data directories
  ansible.builtin.file:
    path: "{{ paperless_ngx_base_dir }}/{{ item.name }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - name: data
      owner: "{{ ansible_user }}"
    - name: consume
      owner: "{{ ansible_user }}"
    - name: pgdata
      owner: "{{ ansible_user }}"
    - name: redisdata
      owner: "{{ paperless_ngx_redis_uid }}"
  loop_control:
    label: "{{ item.name }}"
