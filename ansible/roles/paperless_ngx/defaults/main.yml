---
# Paperless-ngx default configuration

# Version pinning
paperless_ngx_version: "3.0.5"
paperless_ngx_redis_version: "8-alpine"
paperless_ngx_postgres_version: "18-alpine"

# Directories
paperless_ngx_base_dir: "/srv/docker/paperless-ngx"
paperless_ngx_compose_file: "{{ paperless_ngx_base_dir }}/docker-compose.yml"

# Network
paperless_ngx_port: 8010
paperless_ngx_docker_network: "traefik"

# NFS mount for document storage
paperless_ngx_nfs_server: "{{ truenas_nfs_server }}"
paperless_ngx_nfs_share: "{{ truenas_paperless_share }}"
paperless_ngx_nfs_mount_point: "/mnt/paperless"
paperless_ngx_nfs_opts: "{{ nfs_common_opts }}"

# Database
paperless_ngx_db_name: "paperless"
paperless_ngx_db_user: "paperless"

# Paperless config
paperless_ngx_ocr_language: "slv+eng"
paperless_ngx_ocr_install_languages: "slv"  # Additional Tesseract languages to install at startup
paperless_ngx_time_zone: "{{ timezone }}"
paperless_ngx_admin_user: "luka"
