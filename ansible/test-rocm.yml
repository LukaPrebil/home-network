---
# Test playbook to install and verify ROCm on Immich container
#
# Usage:
#   ansible-playbook test-rocm.yml

- name: Install and test ROCm
  hosts: immich
  become: true
  vars_files:
    - secrets.yml

  tasks:
    - name: Include ROCm installation
      ansible.builtin.include_role:
        name: immich
        tasks_from: rocm
