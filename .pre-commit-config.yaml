# Local guard: scans staged changes so a secret never reaches a commit object.
# CI re-scans full history, because a secret rewritten out of the working tree
# still lives in the objects a public clone hands out.
#
# Install once with: pre-commit install
repos:
  # Pinned to a commit SHA (annotated with its release tag) rather than a tag
  # or branch, so neither a re-pointed tag nor an upstream change can silently
  # alter what blocks a commit here. Dependabot security updates bump the SHA
  # via the version annotation.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      # Upstream entry is: gitleaks git --pre-commit --redact --staged --verbose
      # --redact matters locally: it keeps a detected secret out of terminal
      # scrollback and shell history when the hook reports the finding.
      - id: gitleaks
