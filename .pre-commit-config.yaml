# Local guard: scans staged changes so a secret never reaches a commit object.
# CI re-scans full history, because a secret rewritten out of the working tree
# still lives in the objects a public clone hands out.
#
# Install once with: pre-commit install
repos:
  # Pinned to a commit SHA (annotated with its release tag) rather than a tag
  # or branch, so neither a re-pointed tag nor an upstream change can silently
  # alter what blocks a commit here. Dependabot security updates bump the SHA
  # via the version annotation.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      # Upstream entry is: gitleaks git --pre-commit --redact --staged --verbose
      # --redact matters locally: it keeps a detected secret out of terminal
      # scrollback and shell history when the hook reports the finding.
      - id: gitleaks

  # The IaC roots have no other local gate: a badly formatted .tf file is
  # accepted by `tofu validate`, so it reaches a pull request and turns the CI
  # formatting step red for something a hook could have fixed locally.
  #
  # `local` rather than a third-party hook so the check runs the same `tofu`
  # binary the operator runs, at the same version the workflows pin. It formats
  # the whole root rather than the staged files, because `tofu fmt` needs the
  # directory to resolve nothing at all - and a recursive check over iac/ is the
  # exact command CI runs, so local and CI cannot disagree.
  - repo: local
    hooks:
      - id: tofu-fmt
        name: tofu fmt (iac/)
        entry: tofu fmt -check -recursive iac/
        language: system
        files: '^iac/.*\.tf$'
        pass_filenames: false
